# EduTalent production PostgreSQL client authentication policy.
# This preserves the pinned Supabase self-hosted defaults and adds one
# SCRAM-authenticated physical-replication path for the local WAL receiver.

local all  supabase_admin     trust
local all  all                peer map=supabase_map

# Physical replication is deliberately limited to the postgres role over
# the database container's own IPv4 loopback namespace.
host  replication  postgres  127.0.0.1/32  scram-sha-256

host  all  all  127.0.0.1/32  trust
host  all  all  ::1/128       trust

host  all  all  10.0.0.0/8      scram-sha-256
host  all  all  172.16.0.0/12   scram-sha-256
host  all  all  192.168.0.0/16  scram-sha-256
host  all  all  0.0.0.0/0       scram-sha-256
host  all  all  ::0/0           scram-sha-256
