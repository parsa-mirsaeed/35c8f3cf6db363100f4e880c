name: Fix signature inventory

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/fix-signature-inventory.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Enforce exact signature payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest_path = Path("scripts/appliance/release_manifest.py")
          manifest = manifest_path.read_text(encoding="utf-8")

          constants_anchor = '''SCAN_CHUNK_SIZE = 1024 * 1024
          SCAN_OVERLAP = 64 * 1024
          '''
          constants_replacement = constants_anchor + '''SIGNATURE_FILES = {
              "ephemeral": frozenset(
                  {
                      "verification.pub",
                      "release-manifest.sig",
                      "SHA256SUMS.sig",
                  }
              ),
              "keyless": frozenset(
                  {
                      "release-manifest.sigstore.json",
                      "SHA256SUMS.sigstore.json",
                  }
              ),
          }
          '''
          if manifest.count(constants_anchor) != 1:
              raise SystemExit("expected signature constants anchor exactly once")
          manifest = manifest.replace(constants_anchor, constants_replacement)

          function_anchor = '''def scan_forbidden_content(path: Path) -> None:
          '''
          function_replacement = '''def validate_signature_inventory(root: Path, signing_mode: str) -> None:
              signatures = root / "signatures"
              if signatures.is_symlink() or not signatures.is_dir():
                  raise RuntimeError("release signatures directory is missing or invalid")
              expected = SIGNATURE_FILES[signing_mode]
              actual: set[str] = set()
              for entry in sorted(signatures.iterdir()):
                  if entry.is_symlink() or not entry.is_file():
                      raise RuntimeError(
                          f"release signatures contain a non-file entry: {entry.name}"
                      )
                  actual.add(entry.name)
                  if stat.S_IMODE(entry.stat().st_mode) != 0o644:
                      raise RuntimeError(
                          f"release signature file mode is invalid: {entry.name}"
                      )
              if actual != expected:
                  extra = sorted(actual.difference(expected))
                  missing = sorted(expected.difference(actual))
                  raise RuntimeError(
                      f"release signature inventory mismatch; extra={extra}, missing={missing}"
                  )


          ''' + function_anchor
          if manifest.count(function_anchor) != 1:
              raise SystemExit("expected signature validation function anchor exactly once")
          manifest = manifest.replace(function_anchor, function_replacement)

          verify_anchor = '''    if release.get("signing_mode") not in {"ephemeral", "keyless"}:
                  raise RuntimeError("release manifest signing mode is invalid")
              expected_files = {row["path"]: row for row in manifest.get("files", [])}
          '''
          verify_replacement = '''    signing_mode = release.get("signing_mode")
              if signing_mode not in {"ephemeral", "keyless"}:
                  raise RuntimeError("release manifest signing mode is invalid")
              validate_signature_inventory(root, signing_mode)
              expected_files = {row["path"]: row for row in manifest.get("files", [])}
          '''
          if manifest.count(verify_anchor) != 1:
              raise SystemExit("expected release verify signing-mode block exactly once")
          manifest_path.write_text(
              manifest.replace(verify_anchor, verify_replacement),
              encoding="utf-8",
          )

          validate_path = Path("scripts/appliance/validate.sh")
          validate = validate_path.read_text(encoding="utf-8")

          keyless_order = '''python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
            --bundle "${fixture}/bundle"

          touch \\
            "${fixture}/bundle/signatures/release-manifest.sigstore.json" \\
            "${fixture}/bundle/signatures/SHA256SUMS.sigstore.json"
          '''
          keyless_reordered = '''touch \\
            "${fixture}/bundle/signatures/release-manifest.sigstore.json" \\
            "${fixture}/bundle/signatures/SHA256SUMS.sigstore.json"
          python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
            --bundle "${fixture}/bundle"
          '''
          if validate.count(keyless_order) != 1:
              raise SystemExit("expected keyless signature test ordering exactly once")
          validate = validate.replace(keyless_order, keyless_reordered)

          policy_anchor = '''cat > "${fixture}/bundle/signatures/policy.json" <<'JSON'
          {"certificate_oidc_issuer":"https://attacker.invalid","certificate_identity_regexp":".*"}
          JSON
          mkdir -p "${fixture}/fake-bin"
          '''
          policy_replacement = '''cat > "${fixture}/bundle/signatures/policy.json" <<'JSON'
          {"certificate_oidc_issuer":"https://attacker.invalid","certificate_identity_regexp":".*"}
          JSON
          if python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
            --bundle "${fixture}/bundle" >/dev/null 2>&1; then
            echo "Keyless release accepted an unsigned extra signature file." >&2
            exit 1
          fi
          rm -f "${fixture}/bundle/signatures/policy.json"
          python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
            --bundle "${fixture}/bundle"
          mkdir -p "${fixture}/fake-bin"
          '''
          if validate.count(policy_anchor) != 1:
              raise SystemExit("expected keyless policy fixture exactly once")
          validate = validate.replace(policy_anchor, policy_replacement)

          ephemeral_anchor = '''touch \\
            "${fixture}/bundle/signatures/verification.pub" \\
            "${fixture}/bundle/signatures/release-manifest.sig" \\
            "${fixture}/bundle/signatures/SHA256SUMS.sig"
          : > "${fixture}/cosign.log"
          '''
          ephemeral_replacement = '''touch \\
            "${fixture}/bundle/signatures/verification.pub" \\
            "${fixture}/bundle/signatures/release-manifest.sig" \\
            "${fixture}/bundle/signatures/SHA256SUMS.sig"
          printf 'unsigned payload\\n' > "${fixture}/bundle/signatures/extra.bin"
          if python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
            --bundle "${fixture}/bundle" >/dev/null 2>&1; then
            echo "Ephemeral release accepted an unsigned extra signature file." >&2
            exit 1
          fi
          rm -f "${fixture}/bundle/signatures/extra.bin"
          mkdir "${fixture}/bundle/signatures/nested"
          if python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
            --bundle "${fixture}/bundle" >/dev/null 2>&1; then
            echo "Release signature inventory accepted an unexpected directory." >&2
            exit 1
          fi
          rmdir "${fixture}/bundle/signatures/nested"
          python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
            --bundle "${fixture}/bundle"
          : > "${fixture}/cosign.log"
          '''
          if validate.count(ephemeral_anchor) != 1:
              raise SystemExit("expected ephemeral signature fixture exactly once")
          validate_path.write_text(
              validate.replace(ephemeral_anchor, ephemeral_replacement),
              encoding="utf-8",
          )
          PY

      - name: Run signature and appliance regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/appliance/release_manifest.py
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit signature inventory correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/appliance/release_manifest.py scripts/appliance/validate.sh
          git commit -m 'fix(appliance): enforce signature file inventory'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feature/air-gapped-packaging-ghcr
