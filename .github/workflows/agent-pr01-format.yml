name: PR-01 one-shot patch and format

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/agent-pr01-format.yml

permissions:
  contents: write

concurrency:
  group: agent-pr01-format
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/pr-01-assignment-authorization'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply compatibility fix and exact rustfmt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/api/src/repositories/authorized_assignment_repository.rs")
          source = path.read_text()

          old_call = '''        let material_ids = parse_material_ids(request.material_ids.as_deref())?;
                  self.verify_material_scope(actor, &material_ids).await?;
          '''
          new_call = '''        let material_ids = parse_material_ids(request.material_ids.as_deref())?;
                  self.verify_material_scope(actor, request.class_section_id, &material_ids)
                      .await?;
          '''

          old_scope = '''    async fn verify_material_scope(
                  &self,
                  actor: AuthorizedTeacher,
                  material_ids: &[Uuid],
              ) -> RepositoryResult<()> {
                  if material_ids.is_empty() {
                      return Ok(());
                  }
          
                  let authorized_count: i64 = sqlx::query_scalar(
                      r#"
                      SELECT COUNT(*)
                      FROM knowledge_assets ka
                      WHERE ka.id = ANY($1::uuid[])
                        AND ka.school_id = $2
                        AND ka.status::text = 'published'
                      "#,
                  )
                  .bind(material_ids)
                  .bind(actor.school_id)
                  .fetch_one(&*self.pool)
                  .await?;
          '''
          new_scope = '''    async fn verify_material_scope(
                  &self,
                  actor: AuthorizedTeacher,
                  class_section_id: ClassSectionId,
                  material_ids: &[Uuid],
              ) -> RepositoryResult<()> {
                  if material_ids.is_empty() {
                      return Ok(());
                  }
          
                  let authorized_count: i64 = sqlx::query_scalar(
                      r#"
                      SELECT COUNT(*)
                      FROM class_materials cm
                      JOIN class_sections cs ON cs.id = cm.class_section_id
                      JOIN teaching_assignments ta
                        ON ta.class_section_id = cm.class_section_id
                       AND ta.teacher_id = $4
                      WHERE cm.id = ANY($1::uuid[])
                        AND cm.class_section_id = $2
                        AND cs.school_id = $3
                      "#,
                  )
                  .bind(material_ids)
                  .bind::<Uuid>(class_section_id.into())
                  .bind(actor.school_id)
                  .bind::<Uuid>(actor.teacher_id.into())
                  .fetch_one(&*self.pool)
                  .await?;
          '''

          if source.count(old_call) != 1:
              raise SystemExit("expected material verification call was not found exactly once")
          if source.count(old_scope) != 1:
              raise SystemExit("expected material verification query was not found exactly once")

          path.write_text(source.replace(old_call, new_call).replace(old_scope, new_scope))
          PY

          rustfmt --edition 2021 --config skip_children=true \
            packages/api/src/repositories/authorized_assignment_repository.rs \
            packages/api/src/repositories/mod.rs \
            packages/api/src/server_functions/assignment_functions.rs
          git rm .github/workflows/agent-pr01-format.yml \
            scripts/agent/pr01-material-scope.patch
          git diff --check

      - name: Commit formatted PR-01 implementation
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/api/src/repositories/authorized_assignment_repository.rs \
            packages/api/src/repositories/mod.rs \
            packages/api/src/server_functions/assignment_functions.rs
          git commit -m 'style: format assignment authorization implementation'
          git push origin HEAD:${HEAD_BRANCH}
