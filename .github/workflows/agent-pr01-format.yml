name: PR-01 one-shot patch and format

on:
  push:
    branches:
      - agent/pr-01-assignment-authorization
    paths:
      - .github/workflows/agent-pr01-format.yml

permissions:
  contents: write

concurrency:
  group: agent-pr01-format
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply compatibility fix and exact rustfmt
        shell: bash
        run: |
          set -euo pipefail
          git apply scripts/agent/pr01-material-scope.patch
          rustfmt --edition 2021 --config skip_children=true \
            packages/api/src/repositories/authorized_assignment_repository.rs \
            packages/api/src/repositories/mod.rs \
            packages/api/src/server_functions/assignment_functions.rs
          git rm .github/workflows/agent-pr01-format.yml \
            scripts/agent/pr01-material-scope.patch
          git diff --check

      - name: Commit formatted PR-01 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/api/src/repositories/authorized_assignment_repository.rs \
            packages/api/src/repositories/mod.rs \
            packages/api/src/server_functions/assignment_functions.rs
          git commit -m 'style: format assignment authorization implementation'
          git push origin HEAD:${GITHUB_REF_NAME}

# Explicit retrigger after workflow registration on the feature branch.
