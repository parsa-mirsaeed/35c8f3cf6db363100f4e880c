name: Apply structural final review fixes

on:
  push:
    branches:
      - feature/controlled-external-ai
    paths:
      - .github/workflows/apply-final-review-fixes-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/controlled-external-ai
          fetch-depth: 0

      - name: Patch reviewed boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, source: str) -> None:
              Path(path).write_text(source, encoding="utf-8")

          def require_replace(path: str, old: str, new: str, count: int = 1) -> None:
              source = read(path)
              actual = source.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}")
              write(path, source.replace(old, new, count))

          old_collection = "edutalent_local_bge_v1"
          legacy_collection = "edutalent_materials_local_v1"
          matches = subprocess.check_output(
              ["git", "grep", "-l", old_collection, "--", ":(exclude).github/workflows"],
              text=True,
          ).splitlines()
          if not matches:
              raise SystemExit("no controlled-AI collection references found")
          for path in matches:
              write(path, read(path).replace(old_collection, legacy_collection))

          knowledge_path = "packages/api/src/services/knowledge_vector_store_service.rs"
          knowledge = read(knowledge_path)
          profile_condition = '''            Condition::matches("embedding_profile", self.profile.id.to_string()),\n'''
          actual = knowledge.count(profile_condition)
          if actual != 3:
              raise SystemExit(f"expected three legacy-incompatible profile filters, found {actual}")
          knowledge = knowledge.replace(profile_condition, "")
          write(knowledge_path, knowledge)

          vector_path = "packages/api/src/services/vector_store_service.rs"
          vector = read(vector_path)
          pattern = re.compile(
              r'''        let mut required = vec!\[Condition::matches\(\n'''
              r'''            "embedding_profile",\n'''
              r'''            self\.profile\.id\.to_string\(\),\n'''
              r'''        \)\];'''
          )
          replacement = '''        // The immutable collection and dimensions are the profile boundary.\n        // Legacy points in the unchanged local collection predate this payload field.\n        let mut required = Vec::new();'''
          vector, substitutions = pattern.subn(replacement, vector)
          if substitutions != 1:
              raise SystemExit(f"expected one material profile filter, found {substitutions}")
          write(vector_path, vector)

          profile_path = "packages/api/src/services/embedding_profile.rs"
          profile = read(profile_path)
          marker = '''    #[test]\n    fn matching_overrides_are_accepted() {'''
          regression = '''    #[test]\n    fn local_profile_preserves_the_existing_production_collection() {\n        assert_eq!(LOCAL_BGE_V1.collection, "edutalent_materials_local_v1");\n        assert_ne!(LOCAL_BGE_V1.collection, OPENAI_V1.collection);\n    }\n\n'''
          if regression not in profile:
              if profile.count(marker) != 1:
                  raise SystemExit("embedding profile test insertion point changed")
              profile = profile.replace(marker, regression + marker, 1)
          write(profile_path, profile)

          readme_path = "README.md"
          readme = read(readme_path)
          compatibility_note = "The unchanged local BGE profile deliberately retains the existing production collection name"
          if compatibility_note not in readme:
              anchor = "Changing profiles requires a distinct collection and complete re-index; automatic fallback between vector spaces is forbidden."
              if readme.count(anchor) != 1:
                  raise SystemExit("README profile note changed")
              readme = readme.replace(
                  anchor,
                  "The unchanged local BGE profile deliberately retains the existing production collection name `edutalent_materials_local_v1`, so upgrades keep previously indexed local vectors available. The OpenAI profile uses its own collection. Changing either model or dimensions still requires a distinct collection and complete re-index; automatic fallback between vector spaces is forbidden.",
                  1,
              )
          write(readme_path, readme)

          adr_path = "docs/adr/0002-controlled-external-ai.md"
          adr = read(adr_path)
          if "legacy points that predate the `embedding_profile` payload field" not in adr:
              anchor = "A profile change requires a distinct collection and complete re-index. Automatic fallback between profiles is forbidden because it would mix vector spaces. Qdrant writes and searches validate the active collection and dimensions, and governed knowledge queries retain PostgreSQL authorization before exact Qdrant asset filtering."
              if adr.count(anchor) != 1:
                  raise SystemExit("ADR profile contract changed")
              adr = adr.replace(
                  anchor,
                  "The unchanged local BGE profile retains the existing production collection name `edutalent_materials_local_v1` so an upgrade does not hide previously indexed vectors. Its collection and 384-dimensional contract remain the profile boundary even for legacy points that predate the `embedding_profile` payload field. A model or dimension change requires a distinct collection and complete re-index. Automatic fallback between profiles is forbidden, and governed knowledge queries retain PostgreSQL authorization before exact Qdrant asset filtering.",
                  1,
              )
          write(adr_path, adr)

          command_path = "edutalent"
          commands = read(command_path)
          old_dev = '        exec docker compose --env-file "${ENV_FILE}" -f "${DEV_COMPOSE}" --profile dev up --build dev'
          if commands.count(old_dev) != 1:
              raise SystemExit("dev startup command changed")
          commands = commands.replace(
              old_dev,
              '        exec docker compose --env-file "${ENV_FILE}" -f "${DEV_COMPOSE}" --profile dev up --build ai-gateway dev',
              1,
          )
          old_app = "        compose_dev --profile app up --build --detach app"
          if commands.count(old_app) != 2:
              raise SystemExit("app startup commands changed")
          commands = commands.replace(
              old_app,
              "        compose_dev --profile app up --build --detach ai-gateway app",
          )
          validation_anchor = "        grep -Fq 'production-ai-check' edutalent"
          if "--profile dev up --build ai-gateway dev" not in commands.split("validate)", 1)[1]:
              if commands.count(validation_anchor) != 1:
                  raise SystemExit("validation insertion point changed")
              commands = commands.replace(
                  validation_anchor,
                  validation_anchor
                  + "\n        grep -Fq -- '--profile dev up --build ai-gateway dev' edutalent"
                  + "\n        grep -Fq -- '--profile app up --build --detach ai-gateway app' edutalent",
                  1,
              )
          write(command_path, commands)

          gateway_path = "packages/api/src/ai_gateway_runtime.rs"
          gateway = read(gateway_path)
          start = gateway.index("async fn bounded_body(")
          end = gateway.index("fn validate_embedding_response(", start)
          bounded = '''async fn bounded_body(\n    mut response: reqwest::Response,\n    maximum: usize,\n) -> Result<Vec<u8>, ProviderFailure> {\n    if response\n        .content_length()\n        .is_some_and(|length| length > maximum as u64)\n    {\n        return Err(ProviderFailure::ResponseTooLarge);\n    }\n\n    let initial_capacity = response\n        .content_length()\n        .and_then(|length| usize::try_from(length).ok())\n        .unwrap_or_default()\n        .min(maximum);\n    let mut body = Vec::with_capacity(initial_capacity);\n    while let Some(chunk) = response\n        .chunk()\n        .await\n        .map_err(|_| ProviderFailure::InvalidResponse)?\n    {\n        let next_length = body\n            .len()\n            .checked_add(chunk.len())\n            .ok_or(ProviderFailure::ResponseTooLarge)?;\n        if next_length > maximum {\n            return Err(ProviderFailure::ResponseTooLarge);\n        }\n        body.extend_from_slice(&chunk);\n    }\n    Ok(body)\n}\n\n'''
          gateway = gateway[:start] + bounded + gateway[end:]

          import_line = "    use std::sync::atomic::{AtomicUsize, Ordering};"
          io_import = "    use tokio::io::{AsyncReadExt, AsyncWriteExt};"
          if io_import not in gateway:
              if gateway.count(import_line) != 1:
                  raise SystemExit("gateway test imports changed")
              gateway = gateway.replace(import_line, import_line + "\n" + io_import, 1)

          helper_marker = "    async fn spawn_embedding_mock("
          helper_name = "chunked_provider_body_stops_at_the_configured_limit"
          if helper_name not in gateway:
              if gateway.count(helper_marker) != 1:
                  raise SystemExit("gateway mock insertion point changed")
              helper = '''    async fn spawn_chunked_response(chunks: Vec<&'static [u8]>) -> Url {\n        let listener = TcpListener::bind("127.0.0.1:0")\n            .await\n            .expect("bind chunked response");\n        let address = listener.local_addr().expect("chunked response address");\n        tokio::spawn(async move {\n            let (mut socket, _) = listener.accept().await.expect("accept request");\n            let mut request = [0_u8; 1_024];\n            let _ = socket.read(&mut request).await;\n            socket\n                .write_all(\n                    b"HTTP/1.1 200 OK\\r\\nTransfer-Encoding: chunked\\r\\nConnection: close\\r\\n\\r\\n",\n                )\n                .await\n                .expect("write response headers");\n            for chunk in chunks {\n                socket\n                    .write_all(format!("{:X}\\r\\n", chunk.len()).as_bytes())\n                    .await\n                    .expect("write chunk size");\n                socket.write_all(chunk).await.expect("write chunk");\n                socket.write_all(b"\\r\\n").await.expect("finish chunk");\n            }\n            socket\n                .write_all(b"0\\r\\n\\r\\n")\n                .await\n                .expect("finish response");\n        });\n        Url::parse(&format!("http://{address}/")).expect("chunked response URL")\n    }\n\n    #[tokio::test]\n    async fn chunked_provider_body_stops_at_the_configured_limit() {\n        let response = reqwest::get(\n            spawn_chunked_response(vec![&b"abcd"[..], &b"efgh"[..]]).await,\n        )\n        .await\n        .expect("chunked response");\n        assert!(matches!(\n            bounded_body(response, 7).await,\n            Err(ProviderFailure::ResponseTooLarge)\n        ));\n    }\n\n'''
              gateway = gateway.replace(helper_marker, helper + helper_marker, 1)
          write(gateway_path, gateway)
          PY

          rustup component add rustfmt
          cargo fmt --all
          bash -n edutalent
          python3 -m py_compile deploy/production/validate-rendered-compose.py
          git diff --check
          ! git grep -n 'edutalent_local_bge_v1' -- ':(exclude).github/workflows'
          grep -Fq 'response.chunk()' packages/api/src/ai_gateway_runtime.rs
          grep -Fq 'chunked_provider_body_stops_at_the_configured_limit' packages/api/src/ai_gateway_runtime.rs

      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u ':!.github/workflows'
          git commit -m "fix(ai): close final review gaps"
          git push origin HEAD:feature/controlled-external-ai
