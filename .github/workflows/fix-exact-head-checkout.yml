name: Fix exact-head checkout

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/fix-exact-head-checkout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Bind every appliance checkout to the advertised source SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          air_path = Path('.github/workflows/air-gapped-appliance.yml')
          air = air_path.read_text(encoding='utf-8')
          simple = '''      - uses: actions/checkout@v6\n        with:\n          show-progress: false\n'''
          simple_replacement = '''      - uses: actions/checkout@v6\n        with:\n          ref: ${{ github.event.pull_request.head.sha || github.sha }}\n          show-progress: false\n'''
          if air.count(simple) != 4:
              raise SystemExit(f'expected four simple checkout blocks, found {air.count(simple)}')
          air = air.replace(simple, simple_replacement)
          deep = '''      - uses: actions/checkout@v6\n        with:\n          fetch-depth: 0\n          show-progress: false\n'''
          deep_replacement = '''      - uses: actions/checkout@v6\n        with:\n          ref: ${{ github.event.pull_request.head.sha || github.sha }}\n          fetch-depth: 0\n          show-progress: false\n'''
          if air.count(deep) != 1:
              raise SystemExit(f'expected one full-history checkout block, found {air.count(deep)}')
          air_path.write_text(air.replace(deep, deep_replacement, 1), encoding='utf-8')

          validate_path = Path('scripts/appliance/validate.sh')
          validate = validate_path.read_text(encoding='utf-8')
          anchor = '''test "$(grep -Fc "if: github.event_name != 'pull_request' || inputs.complete" "${air_workflow}")" -eq 2\n'''
          replacement = anchor + '''test "$(grep -Fc 'ref: ${{ github.event.pull_request.head.sha || github.sha }}' "${air_workflow}")" -eq 5\n'''
          if validate.count(anchor) != 1:
              raise SystemExit('exact-head checkout regression insertion point changed unexpectedly')
          validate_path.write_text(validate.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - name: Validate exact-head workflow binding and appliance regressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          test "$(grep -Fc 'ref: ${{ github.event.pull_request.head.sha || github.sha }}' .github/workflows/air-gapped-appliance.yml)" -eq 5
          git diff --check

      - name: Commit reviewed workflow correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/air-gapped-appliance.yml scripts/appliance/validate.sh
          git rm .github/workflows/fix-exact-head-checkout.yml
          git commit -m 'fix(ci): bind appliance proof to PR head'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feature/air-gapped-packaging-ghcr
