name: Patch production proof gating

on:
  push:
    branches:
      - feature/air-gapped-packaging-ghcr
    paths:
      - .github/workflows/patch-production-proof-gating.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0

      - name: Make complete production proof dispatch-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/production-foundation.yml')
          text = path.read_text(encoding='utf-8')
          old = "if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-validation') }}"
          new = "if: github.event_name != 'pull_request'"
          if text.count(old) != 2:
              raise SystemExit(f'expected exactly two complete-production PR conditions, found {text.count(old)}')
          text = text.replace(old, new)
          text = text.replace('actions/checkout@v4', 'actions/checkout@v6')
          text = text.replace('actions/upload-artifact@v4', 'actions/upload-artifact@v6')
          text = text.replace('docker/setup-buildx-action@v3', 'docker/setup-buildx-action@v4')
          path.write_text(text, encoding='utf-8')
          PY
          test "$(grep -c "if: github.event_name != 'pull_request'" .github/workflows/production-foundation.yml)" -eq 2
          ! grep -Fq "contains(github.event.pull_request.labels.*.name, 'full-validation')" .github/workflows/production-foundation.yml
          ! grep -Eq 'actions/(checkout|upload-artifact)@v4|docker/setup-buildx-action@v3' .github/workflows/production-foundation.yml
          git diff --check
          rm .github/workflows/patch-production-proof-gating.yml

      - name: Commit scoped workflow correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/production-foundation.yml .github/workflows/patch-production-proof-gating.yml
          git commit -m 'ci(production): reserve complete proof for dispatcher'
          git push origin HEAD:feature/air-gapped-packaging-ghcr

# Trigger after the workflow exists on the branch.
