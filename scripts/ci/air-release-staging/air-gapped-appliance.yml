name: Air-gapped Appliance

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    paths:
      - Dockerfile
      - Dockerfile.appliance-tools
      - compose.yaml
      - compose.release.yaml
      - edutalent
      - Makefile
      - deploy/appliance/**
      - deploy/production/**
      - scripts/appliance/**
      - scripts/ci/**
      - migrations/**
      - packages/**
      - .github/workflows/air-gapped-appliance.yml
      - .github/workflows/air-gapped-release.yml
      - .github/workflows/package.yml
      - .github/workflows/mirror-final-proof.yml
  workflow_call:
    inputs:
      version:
        description: Appliance version; defaults to the exact commit prefix
        required: false
        type: string
      complete:
        description: Run the complete offline and native architecture proof
        required: false
        default: false
        type: boolean
      create_archive:
        description: Create an ephemeral validation archive
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: air-gapped-appliance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/edutalent-app
  AI_GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/edutalent-ai-gateway
  MIGRATION_IMAGE: ghcr.io/${{ github.repository_owner }}/edutalent-migration
  TOOLS_IMAGE: ghcr.io/${{ github.repository_owner }}/edutalent-appliance-tools

jobs:
  validate:
    name: Validate appliance definitions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          show-progress: false

      - name: Validate scripts, lock files, workflow isolation, and tamper detection
        run: bash scripts/appliance/validate.sh

  build-offline:
    permissions:
      contents: read
    name: Build and verify complete air-gapped appliance
    if: inputs.complete
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EDUTALENT_APPLIANCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      bundle_dir: ${{ steps.version.outputs.bundle_dir }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: docker/setup-buildx-action@v4
        with:
          name: edutalent-appliance-builder
          keep-state: true

      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@v0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/appliance/requirements.txt

      - name: Install pinned connected-builder model client
        run: python -m pip install -r scripts/appliance/requirements.txt

      - id: version
        name: Resolve exact appliance version
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.version }}'
          if [[ -n "${requested}" ]]; then
            version="${requested}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_SHA::12}"
          fi
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "bundle_dir=dist/edutalent-appliance-${version}-amd64" >> "${GITHUB_OUTPUT}"

      - name: Build every selected image, model, SBOM, manifest, and signature
        shell: bash
        env:
          EDUTALENT_APPLIANCE_PLATFORM: linux/amd64
          EDUTALENT_APPLIANCE_SIGNING_MODE: ephemeral
          EDUTALENT_APPLIANCE_CREATE_ARCHIVE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.create_archive || false }}
          EDUTALENT_BUILD_CACHE_SCOPE: edutalent-runtime
        run: |
          set -o pipefail
          bash scripts/appliance/build.sh '${{ steps.version.outputs.version }}' \
            2>&1 | tee appliance-build.log

      - name: Prove first startup with all registry pulls disabled
        shell: bash
        run: |
          set -o pipefail
          bash scripts/appliance/offline_smoke.sh '${{ steps.version.outputs.bundle_dir }}' \
            2>&1 | tee appliance-offline-smoke.log

      - name: Write exact-head appliance evidence
        shell: bash
        run: |
          set -euo pipefail
          bundle='${{ steps.version.outputs.bundle_dir }}'
          python3 - "${bundle}" "${{ github.event.pull_request.head.sha || github.sha }}" > appliance-evidence.json <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          bundle = Path(sys.argv[1])
          expected_sha = sys.argv[2]
          manifest_path = bundle / "manifests/release-manifest.json"
          manifest = json.load(manifest_path.open(encoding="utf-8"))
          assert manifest["release"]["git_sha"] == expected_sha
          assert manifest["release"]["platform"] == "linux/amd64"
          assert len(manifest["images"]) >= 10, len(manifest["images"])
          assert manifest["model"]["revision"] == "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
          assert all(image["source_digest"].startswith("sha256:") for image in manifest["images"])
          assert all(not image["local_tag"].endswith(":latest") for image in manifest["images"])
          evidence = {
              "head_sha": expected_sha,
              "manifest_sha256": hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
              "image_count": len(manifest["images"]),
              "platform": manifest["release"]["platform"],
              "model_revision": manifest["model"]["revision"],
              "offline_startup": "success",
              "registry_pull_policy": "never",
          }
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Upload appliance proof and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: air-gapped-appliance-evidence
          path: |
            appliance-build.log
            appliance-offline-smoke.log
            appliance-evidence.json
            ${{ steps.version.outputs.bundle_dir }}/manifests/**
            ${{ steps.version.outputs.bundle_dir }}/signatures/**
            ${{ steps.version.outputs.bundle_dir }}/sbom/**
            ${{ steps.version.outputs.bundle_dir }}/models/local-bge-v1/MODEL_METADATA.json
            ${{ steps.version.outputs.bundle_dir }}/models/local-bge-v1/MODEL_SHA256SUMS
          if-no-files-found: warn
          retention-days: 7

      - name: Upload signed offline archive deliverables
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.create_archive)
        uses: actions/upload-artifact@v6
        with:
          name: edutalent-appliance-${{ steps.version.outputs.version }}-amd64
          path: |
            dist/edutalent-appliance-*.tar.gz
            dist/edutalent-appliance-*.tar.gz.*
            dist/edutalent-appliance-*.parts.SHA256SUMS
            dist/edutalent-appliance-*.parts.SHA256SUMS.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Stop and remove appliance smoke data
        if: always()
        shell: bash
        run: |
          bundle='${{ steps.version.outputs.bundle_dir }}'
          if [[ -x "${bundle}/edutalent-appliance" ]]; then
            "${bundle}/edutalent-appliance" stop >/dev/null 2>&1 || true
          fi
          docker system prune --all --force --volumes >/dev/null 2>&1 || true

  native-arm64:
    name: Build custom images natively for arm64
    if: inputs.complete
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          show-progress: false

      - uses: docker/setup-buildx-action@v4

      - name: Build runtime image on native arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=edutalent-runtime-arm64
          cache-to: type=gha,mode=max,scope=edutalent-runtime-arm64

      - name: Build installer tools image on native arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.appliance-tools
          platforms: linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=edutalent-appliance-tools-arm64
          cache-to: type=gha,mode=max,scope=edutalent-appliance-tools-arm64

  gate:
    name: Air-gapped appliance gate
    if: always()
    needs:
      - validate
      - build-offline
      - native-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce exact required outcomes
        shell: bash
        env:
          COMPLETE_REQUESTED: ${{ inputs.complete }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          OFFLINE_RESULT: ${{ needs.build-offline.result }}
          ARM64_RESULT: ${{ needs.native-arm64.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "${VALIDATE_RESULT}" = success
          if [[ "${COMPLETE_REQUESTED}" == true ]]; then
            test "${OFFLINE_RESULT}" = success
            test "${ARM64_RESULT}" = success
          else
            test "${OFFLINE_RESULT}" = skipped
            test "${ARM64_RESULT}" = skipped
          fi
          cat > air-gapped-appliance-gate.json <<EOF
          {
            "head_sha": "${HEAD_SHA}",
            "validation": "${VALIDATE_RESULT}",
            "offline_appliance": "${OFFLINE_RESULT}",
            "native_arm64": "${ARM64_RESULT}",
            "ghcr_platforms": "skipped",
            "ghcr_indexes": "skipped"
          }
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: air-gapped-appliance-gate
          path: air-gapped-appliance-gate.json
          if-no-files-found: error
          retention-days: 7
