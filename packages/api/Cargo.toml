[package]
name = "api"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "ai_gateway"
path = "src/bin/ai_gateway.rs"
required-features = ["server"]

[dependencies]
# Dioxus
dioxus = { workspace = true, features = ["fullstack"] }
dioxus-logger = { workspace = true }

# --- SHARED Dependencies (Client + Server) ---
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
# Validation & Utilities
validator = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
once_cell = { workspace = true }
uuid = { workspace = true, features = ["js"] }
chrono = { workspace = true }

# --- SERVER-ONLY Dependencies (Marked as optional) ---
# Database
sqlx = { workspace = true, optional = true, features = [
    "uuid",
    "chrono",
    "ipnetwork",
] }
# Authentication & Security
jsonwebtoken = { workspace = true, optional = true }
supabase_rs = { workspace = true, optional = true }
bcrypt = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# HTTP & Networking
reqwest = { workspace = true, optional = true }
# Async helpers
futures = { workspace = true, optional = true }
# Async & Runtime
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
# Logging & Tracing
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# Environment & Configuration
dotenvy = { workspace = true, optional = true }
config = { workspace = true, optional = true }

# --- Axum 0.8 Upgrade ---
axum = { version = "0.8", optional = true }
axum-extra = { version = "0.10", optional = true, features = ["cookie"] }
async-trait = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
ipnetwork = { workspace = true, optional = true }
time = { version = "0.3", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
# Vector Database
qdrant-client = { version = "1.13", optional = true }
# PDF text extraction (pure Rust, no external services)
pdf-extract = { version = "0.10", optional = true }

[features]
# Add all optional dependencies here
server = [
    "dioxus/server",
    "dep:sqlx",
    "dep:jsonwebtoken",
    "dep:supabase_rs",
    "dep:bcrypt",
    "dep:base64",
    "dep:reqwest",
    "dep:futures",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:dotenvy",
    "dep:config",
    "dep:axum",
    "dep:axum-extra",
    "dep:async-trait",
    "dep:rand",
    "dep:sha2",
    "dep:regex",
    "dep:ipnetwork",
    "dep:time",
    "dep:serde_urlencoded",
    "dep:qdrant-client",
    "dep:pdf-extract",
]
