name: Apply final review fixes
# Trigger after workflow creation and validate flexible job-key ordering.

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/apply-final-review-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Apply reusable proof and stable state corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/apply-final-review-fixes.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/appliance/validate.sh")
          text = path.read_text(encoding="utf-8")
          old = '''for job, permissions in expected_mirror.items():
              index = mirror_lines.index(f"  {job}:")
              name_index = index + 1
              permission_index = name_index + 1
              assert mirror_lines[permission_index] == "    permissions:", (job, mirror_lines[index:index + 8])
              block = mirror_lines[permission_index + 1:permission_index + 1 + len(permissions)]
              assert tuple(line.strip() for line in block) == permissions, (job, block)
          '''
          new = '''for job, permissions in expected_mirror.items():
              index = mirror_lines.index(f"  {job}:")
              end = next(
                  (candidate for candidate in range(index + 1, len(mirror_lines))
                   if mirror_lines[candidate].startswith("  ")
                   and not mirror_lines[candidate].startswith("    ")
                   and mirror_lines[candidate].endswith(":")),
                  len(mirror_lines),
              )
              job_block = mirror_lines[index + 1:end]
              permission_line = "    permissions:"
              assert permission_line in job_block, (job, job_block)
              permission_index = job_block.index(permission_line)
              block = job_block[permission_index + 1:permission_index + 1 + len(permissions)]
              assert tuple(line.strip() for line in block) == permissions, (job, block)
          '''
          if text.count(old) != 1:
              raise SystemExit("mirror permission regression changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate scripts, workflows, and appliance regressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            deploy/appliance/edutalent-appliance \
            scripts/appliance/build.sh \
            scripts/appliance/offline_smoke.sh \
            scripts/appliance/validate.sh
          python3 -m py_compile scripts/appliance/release_manifest.py
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path) }' \
            .github/workflows/air-gapped-appliance.yml \
            .github/workflows/mirror-final-proof.yml
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit reviewed source and workflow corrections
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/apply-final-review-fixes.py \
            .github/workflows/apply-final-review-fixes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/apply-final-review-fixes.py \
            .github/workflows/apply-final-review-fixes.yml \
            .github/workflows/air-gapped-appliance.yml \
            .github/workflows/mirror-final-proof.yml \
            deploy/appliance/README.md \
            deploy/appliance/edutalent-appliance \
            scripts/appliance/build.sh \
            scripts/appliance/validate.sh
          git commit -m 'fix(appliance): reuse final proof and installation state'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
