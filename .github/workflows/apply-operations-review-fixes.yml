name: Apply Operations Review Fixes

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/production-operations' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-operations
          fetch-depth: 0
          show-progress: false

      - name: Apply fail-closed backup and monitoring fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import json

          def replace_function(text: str, name: str, next_name: str, body: str) -> str:
              start_marker = f"{name}() {{"
              next_marker = f"\n{next_name}() {{"
              start = text.find(start_marker)
              end = text.find(next_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit(f"function boundary not found: {name} -> {next_name}")
              return text[:start] + dedent(body).strip() + "\n\n" + text[end + 1 :]

          helper_path = Path('deploy/production/operations/edutalent_ops.py')
          helper = helper_path.read_text(encoding='utf-8')
          metadata_anchor = '''    return {"directories": directories, "files": files}


          def create_manifest(root: Path, metadata: dict[str, Any] | None = None) -> dict[str, Any]:
          '''
          metadata_replacement = '''    return {"directories": directories, "files": files}


          def verify_backup_metadata(metadata_path: Path, backup_dir: Path) -> dict[str, Any]:
              backup_dir = backup_dir.resolve()
              if metadata_path.is_symlink() or not metadata_path.is_file():
                  raise RuntimeError(f"backup metadata is not a regular file: {metadata_path}")
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              if metadata.get("schema_version") != 1:
                  raise RuntimeError("unsupported backup metadata schema")
              archive_name = metadata.get("archive")
              if not isinstance(archive_name, str) or Path(archive_name).name != archive_name:
                  raise RuntimeError("backup metadata contains an invalid archive name")
              archive = (backup_dir / archive_name).resolve()
              if archive.parent != backup_dir or archive.is_symlink() or not archive.is_file():
                  raise RuntimeError(f"backup archive is missing or unsafe: {archive_name}")
              expected = metadata.get("sha256")
              if not isinstance(expected, str) or len(expected) != 64 or any(
                  character not in "0123456789abcdef" for character in expected.lower()
              ):
                  raise RuntimeError("backup metadata contains an invalid SHA-256 digest")
              observed = sha256_file(archive)
              if observed != expected.lower():
                  raise RuntimeError(f"backup archive checksum mismatch: {archive_name}")
              created_at = metadata.get("created_at")
              if not isinstance(created_at, str) or parse_iso8601_epoch(created_at) is None:
                  raise RuntimeError("backup metadata contains an invalid creation timestamp")
              return metadata


          def create_manifest(root: Path, metadata: dict[str, Any] | None = None) -> dict[str, Any]:
          '''
          if helper.count(metadata_anchor) != 1:
              raise SystemExit(f"metadata helper anchor count was {helper.count(metadata_anchor)}")
          helper = helper.replace(metadata_anchor, metadata_replacement)

          eval_start = helper.find('def evaluate_alerts(')
          eval_end = helper.find('\n\n@dataclass', eval_start)
          if eval_start < 0 or eval_end < 0:
              raise SystemExit('evaluate_alerts boundary not found')
          evaluate_alerts = dedent('''
          def evaluate_alerts(snapshot: dict[str, Any], policy: dict[str, Any]) -> list[dict[str, Any]]:
              alerts: list[dict[str, Any]] = []
              now = float(snapshot.get("collected_epoch", time.time()))
              required_services = set(policy.get("required_services", []))
              services = snapshot.get("services") or []
              states: dict[str, tuple[str, str]] = {}
              for row in services:
                  if not isinstance(row, dict):
                      continue
                  name = str(row.get("Service") or row.get("Name") or row.get("service") or "")
                  state = str(row.get("State") or row.get("state") or "unknown").lower()
                  health = str(row.get("Health") or row.get("health") or "").lower()
                  if name:
                      states[name] = (state, health)
              for service in sorted(required_services):
                  state, health = states.get(service, ("missing", ""))
                  if state != "running" or health in {"unhealthy", "starting"}:
                      alerts.append({"severity": "critical", "code": "service_unhealthy", "service": service, "state": state, "health": health})

              disk_free = int(snapshot.get("disk_free_bytes", -1))
              min_disk = int(policy.get("minimum_disk_free_bytes", 0))
              if disk_free < 0:
                  alerts.append({"severity": "critical", "code": "disk_status_unknown"})
              elif disk_free < min_disk:
                  alerts.append({"severity": "critical", "code": "disk_free_low", "observed": disk_free, "threshold": min_disk})

              if snapshot.get("backup_configured") is True:
                  backup_disk_free = int(snapshot.get("backup_disk_free_bytes", -1))
                  min_backup_disk = int(policy.get("minimum_backup_disk_free_bytes", min_disk))
                  if backup_disk_free < 0:
                      alerts.append({"severity": "critical", "code": "backup_disk_status_unknown"})
                  elif backup_disk_free < min_backup_disk:
                      alerts.append({"severity": "critical", "code": "backup_disk_free_low", "observed": backup_disk_free, "threshold": min_backup_disk})
                  if snapshot.get("latest_backup_verified") is not True:
                      alerts.append({"severity": "critical", "code": "backup_unverifiable"})

              cert_seconds = int(snapshot.get("tls_seconds_remaining", -1))
              cert_min = int(policy.get("minimum_tls_seconds_remaining", 0))
              if cert_seconds < 0:
                  alerts.append({"severity": "critical", "code": "tls_status_unknown"})
              elif cert_seconds < cert_min:
                  alerts.append({"severity": "critical", "code": "tls_expiring", "observed": cert_seconds, "threshold": cert_min})

              connections = int(snapshot.get("database_connections", -1))
              connection_limit = int(snapshot.get("database_connection_limit", -1))
              max_ratio = float(policy.get("maximum_database_connection_ratio", 0.85))
              if connections >= 0 and connection_limit > 0 and connections / connection_limit >= max_ratio:
                  alerts.append({"severity": "warning", "code": "database_connections_high", "observed": connections, "limit": connection_limit})

              for key, code, max_age_key in (
                  ("latest_backup_created_at", "backup_stale", "maximum_backup_age_seconds"),
                  ("latest_wal_received_at", "wal_archive_stale", "maximum_wal_age_seconds"),
              ):
                  maximum_age = int(policy.get(max_age_key, 0))
                  observed = parse_iso8601_epoch(snapshot.get(key))
                  if maximum_age > 0 and (observed is None or now - observed > maximum_age):
                      alerts.append({"severity": "critical", "code": code, "observed": snapshot.get(key), "maximum_age_seconds": maximum_age})

              if snapshot.get("wal_receiver_running") is not True:
                  alerts.append({"severity": "critical", "code": "wal_receiver_stopped"})
              if snapshot.get("core_health") is False:
                  alerts.append({"severity": "critical", "code": "core_health_failed"})
              if snapshot.get("qdrant_health") is False:
                  alerts.append({"severity": "warning", "code": "qdrant_unavailable"})
              if snapshot.get("ai_gateway_health") is False:
                  alerts.append({"severity": "warning", "code": "ai_gateway_unavailable"})
              return alerts
          ''').strip()
          helper = helper[:eval_start] + evaluate_alerts + helper[eval_end:]

          command_anchor = '''def command_compose_security(args: argparse.Namespace) -> None:
          '''
          command_insert = '''def command_backup_metadata_verify(args: argparse.Namespace) -> None:
              metadata = verify_backup_metadata(args.metadata, args.backup_dir)
              print(metadata["created_at"])


          def command_compose_security(args: argparse.Namespace) -> None:
          '''
          if helper.count(command_anchor) != 1:
              raise SystemExit('metadata command anchor not found exactly once')
          helper = helper.replace(command_anchor, command_insert)
          parser_anchor = '''    security = subparsers.add_parser("compose-security")
          '''
          parser_insert = '''    metadata = subparsers.add_parser("backup-metadata-verify")
              metadata.add_argument("--metadata", type=Path, required=True)
              metadata.add_argument("--backup-dir", type=Path, required=True)
              metadata.set_defaults(func=command_backup_metadata_verify)

              security = subparsers.add_parser("compose-security")
          '''
          if helper.count(parser_anchor) != 1:
              raise SystemExit('metadata parser anchor not found exactly once')
          helper = helper.replace(parser_anchor, parser_insert)
          helper_path.write_text(helper, encoding='utf-8')

          script_path = Path('deploy/production/edutalent-operations')
          script = script_path.read_text(encoding='utf-8')
          latest_anchor = '''latest_file_time_iso() {
            local directory="$1" pattern="$2" latest
            latest="$(find "${directory}" -maxdepth 1 -type f -name "${pattern}" -printf '%T@ %p\\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2- || true)"
            if [[ -n "${latest}" ]]; then
              date -u -d "@$(stat -c %Y "${latest}")" +%Y-%m-%dT%H:%M:%SZ
            fi
          }
          '''
          latest_replacement = latest_anchor + '''
          latest_wal_time_iso() {
            local latest
            latest="$(find "${WAL_DIR}" -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9A-F]{24}' -printf '%T@ %p\\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2- || true)"
            if [[ -n "${latest}" ]]; then
              date -u -d "@$(stat -c %Y "${latest}")" +%Y-%m-%dT%H:%M:%SZ
            fi
          }
          '''
          if script.count(latest_anchor) != 1:
              raise SystemExit(f'latest WAL helper anchor count was {script.count(latest_anchor)}')
          script = script.replace(latest_anchor, latest_replacement)

          script = replace_function(script, 'collect_snapshot', 'evaluate_alerts', r'''
          collect_snapshot() {
            require_definitions
            require_command docker
            require_command openssl
            initialize_state
            local temp output now services_json stats_json db_metrics disk_free backup_disk_free tls_remaining
            local latest_backup latest_wal latest_metadata tls_cert not_after expiry_epoch container_ids
            local core_health=false qdrant_health=false ai_health=false
            local backup_configured=false backup_verified=false wal_receiver_running=false
            temp="$(mktemp -d)"
            trap 'rm -rf "${temp}"' RETURN
            services_json="${temp}/services.json"
            stats_json="${temp}/stats.json"
            if ! compose ps --format json >"${services_json}" 2>/dev/null; then
              printf '[]\n' >"${services_json}"
            fi
            container_ids="$(compose ps --quiet 2>/dev/null | paste -sd' ' - || true)"
            if [[ -n "${container_ids}" ]]; then
              # shellcheck disable=SC2086
              docker stats --no-stream --format '{{json .}}' ${container_ids} >"${stats_json}" 2>/dev/null || :
            else
              : >"${stats_json}"
            fi
            if compose exec -T app curl --fail --silent --max-time 5 http://127.0.0.1:8080/healthz >/dev/null 2>&1; then core_health=true; fi
            if compose exec -T app sh -eu -c 'curl --fail --silent --max-time 5 --header "api-key: ${QDRANT_API_KEY}" http://qdrant:6333/readyz >/dev/null' >/dev/null 2>&1; then qdrant_health=true; fi
            if compose exec -T app curl --fail --silent --max-time 5 http://ai-gateway:8090/healthz >/dev/null 2>&1; then ai_health=true; fi
            db_metrics="$(compose exec -T db psql -U postgres -d "$(read_env "${SUPABASE_ENV}" POSTGRES_DB || true)" -AtF'|' -c "SELECT count(*), current_setting('max_connections')::int, pg_database_size(current_database())" 2>/dev/null || true)"
            [[ "${db_metrics}" =~ ^[0-9]+\|[0-9]+\|[0-9]+$ ]] || db_metrics="-1|-1|-1"
            disk_free="$(df -Pk "${OPERATIONS_STATE}" 2>/dev/null | awk 'NR==2 {print $4 * 1024}' || true)"
            [[ "${disk_free}" =~ ^[0-9]+$ ]] || disk_free=-1
            backup_disk_free=-1
            latest_backup=""
            if [[ -n "${EDUTALENT_BACKUP_DIR:-}" ]]; then
              backup_configured=true
              if [[ -d "${EDUTALENT_BACKUP_DIR}" ]]; then
                backup_disk_free="$(df -Pk "${EDUTALENT_BACKUP_DIR}" 2>/dev/null | awk 'NR==2 {print $4 * 1024}' || true)"
                [[ "${backup_disk_free}" =~ ^[0-9]+$ ]] || backup_disk_free=-1
                latest_metadata="$(find "${EDUTALENT_BACKUP_DIR}" -maxdepth 1 -type f -name '*.metadata.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2- || true)"
                if [[ -n "${latest_metadata}" ]] && latest_backup="$(python3 "${HELPER}" backup-metadata-verify --metadata "${latest_metadata}" --backup-dir "${EDUTALENT_BACKUP_DIR}" 2>/dev/null)"; then
                  backup_verified=true
                else
                  latest_backup=""
                fi
              fi
            fi
            tls_remaining=-1
            tls_cert="$(read_env "${APP_ENV}" TLS_CERT_FILE)"
            if [[ -r "${tls_cert}" ]] && not_after="$(openssl x509 -in "${tls_cert}" -noout -enddate 2>/dev/null | cut -d= -f2-)" && expiry_epoch="$(date -d "${not_after}" +%s 2>/dev/null)"; then
              tls_remaining="$(( expiry_epoch - $(date +%s) ))"
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' edutalent-pitr-archive 2>/dev/null || true)" == true ]]; then
              wal_receiver_running=true
            fi
            latest_wal="$(latest_wal_time_iso)"
            now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            output="${SNAPSHOT_DIR}/$(date -u +%Y%m%dT%H%M%SZ).json"
            python3 - "${services_json}" "${stats_json}" "${output}" "${now}" "${disk_free}" "${backup_disk_free}" "${tls_remaining}" "${db_metrics}" "${latest_backup}" "${latest_wal}" "${core_health}" "${qdrant_health}" "${ai_health}" "${backup_configured}" "${backup_verified}" "${wal_receiver_running}" <<'PY'
          import json, sys, time
          from pathlib import Path
          services_path, stats_path, output, collected, disk, backup_disk, tls, db, backup, wal, core, qdrant, ai, backup_configured, backup_verified, wal_receiver = sys.argv[1:]
          def read_maybe_lines(path):
              text = Path(path).read_text(encoding="utf-8").strip()
              if not text:
                  return []
              try:
                  value = json.loads(text)
                  return value if isinstance(value, list) else [value]
              except json.JSONDecodeError:
                  return [json.loads(line) for line in text.splitlines() if line.strip()]
          connections, connection_limit, database_size = (int(item) for item in db.split("|"))
          payload = {
              "schema_version": 1,
              "collected_at": collected,
              "collected_epoch": time.time(),
              "services": read_maybe_lines(services_path),
              "container_stats": read_maybe_lines(stats_path),
              "disk_free_bytes": int(float(disk)),
              "backup_disk_free_bytes": int(float(backup_disk)),
              "tls_seconds_remaining": int(tls),
              "database_connections": connections,
              "database_connection_limit": connection_limit,
              "database_size_bytes": database_size,
              "latest_backup_created_at": backup or None,
              "latest_backup_verified": backup_verified == "true",
              "backup_configured": backup_configured == "true",
              "latest_wal_received_at": wal or None,
              "wal_receiver_running": wal_receiver == "true",
              "core_health": core == "true",
              "qdrant_health": qdrant == "true",
              "ai_gateway_health": ai == "true",
          }
          Path(output).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(output)
          PY
            cp "${output}" "${SNAPSHOT_DIR}/current.json.tmp"
            mv "${SNAPSHOT_DIR}/current.json.tmp" "${SNAPSHOT_DIR}/current.json"
            printf '%s\n' "${output}"
          }
          ''')

          script = replace_function(script, 'backup_create', 'backup_verify', r'''
          backup_create() {
            require_definitions
            backup_preflight >/dev/null
            require_command docker
            require_envs
            local timestamp name archive temp payload metadata_file db_id db_name db_password collection
            local qdrant_response qdrant_output qdrant_status snapshot_name service required_service id app_recovered wal_file
            local -a running_services=() quiesced_services=()
            local services_resumed=false
            db_id="$(compose ps --quiet db)"
            [[ -n "${db_id}" ]] || { echo "Database container is not running." >&2; exit 1; }
            timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
            name="edutalent-backup-${timestamp}"
            archive="${EDUTALENT_BACKUP_DIR}/${name}.tar.gz.enc"
            metadata_file="${archive}.metadata.json"
            [[ ! -e "${archive}" && ! -e "${metadata_file}" ]] || { echo "Backup already exists: ${archive}" >&2; exit 1; }
            temp="$(mktemp -d)"
            payload="${temp}/${name}"
            cleanup_backup() {
              local status=$?
              if [[ "${services_resumed}" != true && ${#quiesced_services[@]} -gt 0 ]]; then
                if compose start "${quiesced_services[@]}" >/dev/null; then
                  services_resumed=true
                else
                  echo "Failed to resume services after backup capture." >&2
                  status=1
                fi
              fi
              rm -rf "${temp}" "${archive}.partial"
              return "${status}"
            }
            trap cleanup_backup RETURN
            mkdir -p "${payload}/database" "${payload}/storage" "${payload}/qdrant" "${payload}/configuration/public" "${payload}/configuration/secret-escrow" "${payload}/wal"
            chmod 0700 "${payload}" "${payload}/configuration/secret-escrow"

            mapfile -t running_services < <(compose ps --services --filter status=running)
            for service in "${running_services[@]}"; do
              case "${service}" in
                gateway|app|kong|supavisor|studio|auth|rest|realtime|storage|meta|functions)
                  quiesced_services+=("${service}")
                  ;;
              esac
            done
            for required_service in gateway app storage; do
              printf '%s\n' "${quiesced_services[@]}" | grep -Fxq "${required_service}" || {
                echo "Required writer-facing service is not running: ${required_service}" >&2
                exit 1
              }
            done
            compose stop --timeout 30 "${quiesced_services[@]}" >/dev/null
            for service in "${quiesced_services[@]}"; do
              id="$(compose ps --all --quiet "${service}" 2>/dev/null || true)"
              if [[ -n "${id}" && "$(docker inspect --format '{{.State.Running}}' "${id}" 2>/dev/null || true)" == true ]]; then
                echo "Writer-facing service did not quiesce: ${service}" >&2
                exit 1
              fi
            done

            db_name="$(read_env "${SUPABASE_ENV}" POSTGRES_DB)"
            db_name="${db_name:-postgres}"
            db_password="$(read_env "${SUPABASE_ENV}" POSTGRES_PASSWORD)"
            docker exec -e "PGPASSWORD=${db_password}" "${db_id}" \
              pg_dump -h 127.0.0.1 -U postgres -d "${db_name}" --format=custom --no-owner --no-acl \
              >"${payload}/database/database.dump"
            docker exec -e "PGPASSWORD=${db_password}" "${db_id}" \
              pg_dumpall -h 127.0.0.1 -U postgres --globals-only --no-role-passwords \
              >"${payload}/database/globals.sql"
            docker exec -e "PGPASSWORD=${db_password}" "${db_id}" \
              pg_basebackup -h 127.0.0.1 -U postgres -D - --format=tar --wal-method=fetch --checkpoint=fast --no-password \
              >"${payload}/database/base.tar"

            compose cp storage:/var/lib/storage/. "${payload}/storage" >/dev/null
            collection="$(read_env "${APP_ENV}" QDRANT_COLLECTION)"
            qdrant_response="${temp}/qdrant-snapshot.json"
            qdrant_output="$(compose run --rm --no-deps --pull never --entrypoint sh app -eu -c '
              response=/tmp/edutalent-qdrant-snapshot.json
              status="$(curl --silent --show-error --output "${response}" --write-out "%{http_code}" --request POST --header "api-key: ${QDRANT_API_KEY}" "http://qdrant:6333/collections/${QDRANT_COLLECTION}/snapshots")"
              printf "%s\n" "${status}"
              cat "${response}"
            ' 2>"${temp}/qdrant-client.log" || true)"
            qdrant_status="$(printf '%s\n' "${qdrant_output}" | head -n1)"
            printf '%s\n' "${qdrant_output}" | tail -n +2 >"${qdrant_response}"
            if [[ "${qdrant_status}" == "200" ]]; then
              snapshot_name="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["result"]["name"])' "${qdrant_response}")"
              compose cp "qdrant:/qdrant/storage/collections/${collection}/snapshots/${snapshot_name}" "${payload}/qdrant/${snapshot_name}" >/dev/null
              printf '%s\n' "${snapshot_name}" >"${payload}/qdrant/snapshot-name.txt"
            elif [[ "${qdrant_status}" == "404" ]]; then
              printf '%s\n' "collection-not-created" >"${payload}/qdrant/status.txt"
            else
              echo "Qdrant snapshot failed with HTTP ${qdrant_status:-unknown}." >&2
              cat "${temp}/qdrant-client.log" >&2 || true
              cat "${qdrant_response}" >&2 || true
              exit 1
            fi

            cp "${SCRIPT_DIR}/.env.edutalent.example" "${payload}/configuration/public/"
            cp "${SCRIPT_DIR}/compose.production.yaml" "${payload}/configuration/public/"
            cp "${SCRIPT_DIR}/Caddyfile" "${payload}/configuration/public/"
            cp "${SCRIPT_DIR}/SUPABASE_UPSTREAM" "${payload}/configuration/public/"
            cp "${APP_ENV}" "${payload}/configuration/secret-escrow/.env.edutalent"
            cp "${SUPABASE_ENV}" "${payload}/configuration/secret-escrow/supabase.env"
            chmod 0600 "${payload}/configuration/secret-escrow/.env.edutalent" "${payload}/configuration/secret-escrow/supabase.env"
            if [[ -f "${ROOT_CANDIDATE}/manifests/release-manifest.json" ]]; then
              cp "${ROOT_CANDIDATE}/manifests/release-manifest.json" "${payload}/configuration/public/"
            elif command -v git >/dev/null 2>&1 && git -C "${ROOT_CANDIDATE}" rev-parse HEAD >/dev/null 2>&1; then
              git -C "${ROOT_CANDIDATE}" rev-parse HEAD >"${payload}/configuration/public/git-head.txt"
            fi
            while IFS= read -r wal_file; do
              cp -a "${wal_file}" "${payload}/wal/"
            done < <(find "${WAL_DIR}" -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9A-F]{24}' -print | sort)

            compose start "${quiesced_services[@]}" >/dev/null
            services_resumed=true
            app_recovered=false
            for attempt in $(seq 1 90); do
              if compose exec -T app curl --fail --silent --max-time 5 http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
                app_recovered=true
                break
              fi
              sleep 2
            done
            [[ "${app_recovered}" == true ]] || { echo "Application did not recover after backup quiescence." >&2; exit 1; }

            python3 - "${temp}/metadata.json" "${timestamp}" "${db_name}" "${collection}" <<'PY'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
            "backup_type": "full",
            "consistency": "write-quiesced",
            "created_at_compact": sys.argv[2],
            "database": sys.argv[3],
            "qdrant_collection": sys.argv[4],
            "includes": ["postgres-logical", "postgres-base", "storage", "qdrant", "encrypted-secret-escrow", "wal", "release-manifest"],
            "provisional_rpo_seconds": 900,
            "provisional_rto_seconds": 7200
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
            python3 "${HELPER}" manifest-create --root "${payload}" --metadata "${temp}/metadata.json" >/dev/null
            tar -C "${temp}" -czf - "${name}" | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
              -pass "file:${EDUTALENT_BACKUP_PASSPHRASE_FILE}" -out "${archive}.partial"
            chmod 0600 "${archive}.partial"
            mv "${archive}.partial" "${archive}"
            verify_temp="${temp}/verify"
            mkdir -p "${verify_temp}"
            decrypt_backup "${archive}" "${verify_temp}"
            verify_decrypted_payload "${verify_temp}/${name}"
            archive_sha="$(sha256sum "${archive}" | awk '{print $1}')"
            python3 - "${metadata_file}.partial" "${archive}" "${archive_sha}" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          from pathlib import Path
          path, archive, digest = sys.argv[1:]
          Path(path).write_text(json.dumps({
            "schema_version": 1,
            "created_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "archive": os.path.basename(archive),
            "sha256": digest,
            "encrypted": True,
            "cipher": "AES-256-CBC",
            "kdf": "PBKDF2-SHA256",
            "iterations": 600000
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
            chmod 0600 "${metadata_file}.partial"
