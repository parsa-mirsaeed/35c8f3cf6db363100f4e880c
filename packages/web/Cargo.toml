[package]
name = "web"
version = "0.3.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
ui = { workspace = true }
# ADD this dependency to your api package
api = { path = "../api" }
serde_json = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
web-sys = { version = "0.3.82", features = [
    "console",
    "Window",
    "Document",
    "HtmlInputElement",
    "File",
    "FileList",
    "FileReader",
    "Blob",
] }
wasm-bindgen = "0.2"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
parsidate = "1.7"
gloo-storage = "0.3"
# Tokio and database readiness are server-only for WASM compatibility
tokio = { version = "1.0", features = ["full"], optional = true }
sqlx = { workspace = true, optional = true }
# WASM-compatible timers for sleep functionality
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = { version = "0.5", features = ["http"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
uuid = { version = "1.0", features = ["v4", "js"] }
axum = { version = "0.8", optional = true }
axum-extra = { version = "0.10", optional = true, features = ["cookie"] }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
dioxus-logger = { workspace = true, optional = true }
# Fix for getrandom 0.3+ on WASM
getrandom = { version = "0.2.15", features = ["js"] }

[features]
default = []
web = ["dioxus/web"]
# UPDATE this feature to include "api/server" and enable server-only dependencies
server = [
    "dioxus/server",
    "ui/server",
    "api/server",
    "dep:tokio",
    "dep:sqlx",
    "dep:axum",
    "dep:axum-extra",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tower-http",
    "dep:dioxus-logger",
]
