name: Apply appliance final review fixes

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/fix-appliance-review.yml

permissions:
  contents: write

jobs:
  patch:
    name: Apply scoped appliance security fixes
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact reviewed transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          build = Path("scripts/appliance/build.sh")
          replace_once(
              build,
              '''PRODUCTION_DIR="${ROOT_DIR}/deploy/production"
          SUPABASE_DIR="${PRODUCTION_DIR}/runtime/supabase"
          APP_ENV="${PRODUCTION_DIR}/.env.edutalent"
          SUPABASE_ENV="${SUPABASE_DIR}/.env"
          TLS_DIR="$(mktemp -d)"
          TEMP_DIR="$(mktemp -d)"
          BUNDLE_NAME="edutalent-appliance-${VERSION}-${ARCH}"
          BUNDLE_DIR="${ROOT_DIR}/dist/${BUNDLE_NAME}"
          APP_BUILD_TAG="edutalent-appliance-build/app:${VERSION}-${ARCH}"
          TOOLS_BUILD_TAG="edutalent-appliance-build/tools:${VERSION}-${ARCH}"
          MODEL_LOCK="${ROOT_DIR}/deploy/appliance/model.lock.json"
          MODEL_OUTPUT="${BUNDLE_DIR}/models/local-bge-v1"
          ''',
              '''SOURCE_PRODUCTION_DIR="${ROOT_DIR}/deploy/production"
          TLS_DIR="$(mktemp -d)"
          TEMP_DIR="$(mktemp -d)"
          PRODUCTION_DIR="${TEMP_DIR}/production"
          SUPABASE_DIR="${PRODUCTION_DIR}/runtime/supabase"
          APP_ENV="${PRODUCTION_DIR}/.env.edutalent"
          SUPABASE_ENV="${SUPABASE_DIR}/.env"
          BUNDLE_NAME="edutalent-appliance-${VERSION}-${ARCH}"
          BUNDLE_DIR="${ROOT_DIR}/dist/${BUNDLE_NAME}"
          APP_BUILD_TAG="edutalent-appliance-build/app:${VERSION}-${ARCH}"
          TOOLS_BUILD_TAG="edutalent-appliance-build/tools:${VERSION}-${ARCH}"
          MODEL_LOCK="${ROOT_DIR}/deploy/appliance/model.lock.json"
          MODEL_OUTPUT="${BUNDLE_DIR}/models/local-bge-v1"
          ''',
          )
          replace_once(
              build,
              '''cleanup() {
            rm -rf "${TLS_DIR}" "${TEMP_DIR}"
            rm -f "${APP_ENV}" "${SUPABASE_ENV}" "${SUPABASE_DIR}/docker-compose.yml.edutalent-backup"
          }
          ''',
              '''cleanup() {
            rm -rf "${TLS_DIR}" "${TEMP_DIR}"
          }
          ''',
          )
          replace_once(
              build,
              '''bash "${ROOT_DIR}/edutalent" production-bootstrap
          cp "${PRODUCTION_DIR}/.env.edutalent.example" "${APP_ENV}"
          ''',
              '''mkdir -p "${PRODUCTION_DIR}"
          cp -a "${SOURCE_PRODUCTION_DIR}/." "${PRODUCTION_DIR}/"
          rm -rf "${PRODUCTION_DIR}/runtime"
          rm -f "${APP_ENV}" "${SUPABASE_ENV}" "${SUPABASE_DIR}/docker-compose.yml.edutalent-backup"
          bash "${PRODUCTION_DIR}/bootstrap-supabase.sh"
          cp "${PRODUCTION_DIR}/.env.edutalent.example" "${APP_ENV}"
          ''',
          )
          replace_once(
              build,
              'bash "${ROOT_DIR}/edutalent" production-init\n',
              'bash "${PRODUCTION_DIR}/generate-secrets.sh"\n',
          )

          manifest = Path("scripts/appliance/release_manifest.py")
          replace_once(
              manifest,
              '''FORBIDDEN_NAMES = {".env", "id_rsa", "id_ed25519", "credentials.json"}
          PRIVATE_KEY_MARKERS = (
          ''',
              '''FORBIDDEN_NAMES = {".env", "id_rsa", "id_ed25519", "credentials.json"}
          MUTABLE_INSTALLATION_FILES = {
              "deploy/production/.env.edutalent",
              "deploy/production/runtime/supabase/.env",
          }
          PRIVATE_KEY_MARKERS = (
          ''',
          )
          replace_once(
              manifest,
              '''def is_manifest_input(relative: Path) -> bool:
              value = relative.as_posix()
              return value not in {
                  "SHA256SUMS",
                  "manifests/release-manifest.json",
              } and not value.startswith("signatures/")
          ''',
              '''def is_manifest_input(relative: Path) -> bool:
              value = relative.as_posix()
              return (
                  value not in MUTABLE_INSTALLATION_FILES
                  and value not in {
                      "SHA256SUMS",
                      "manifests/release-manifest.json",
                  }
                  and not value.startswith("signatures/")
              )
          ''',
          )
          replace_once(
              manifest,
              '''        if sha256_file(path) != row["sha256"] or path.stat().st_size != row["size"]:
                      raise RuntimeError(f"release file integrity failure: {relative}")
              sums: dict[str, str] = {}
          ''',
              '''        observed_mode = format(stat.S_IMODE(path.stat().st_mode), "04o")
                  if (
                      sha256_file(path) != row["sha256"]
                      or path.stat().st_size != row["size"]
                      or observed_mode != row["mode"]
                  ):
                      raise RuntimeError(f"release file integrity failure: {relative}")
              for relative in MUTABLE_INSTALLATION_FILES:
                  path = root / relative
                  if not path.exists():
                      continue
                  if path.is_symlink() or not path.is_file():
                      raise RuntimeError(f"invalid mutable installation file: {relative}")
                  if stat.S_IMODE(path.stat().st_mode) != 0o600:
                      raise RuntimeError(
                          f"mutable installation file must be mode 0600: {relative}"
                      )
              sums: dict[str, str] = {}
          ''',
          )

          signing = Path("scripts/appliance/sign_release.sh")
          replace_once(
              signing,
              '''    cat > "${signatures}/policy.json" <<'JSON'
          {
            "certificate_oidc_issuer": "https://token.actions.githubusercontent.com",
            "certificate_identity_regexp": "^https://github.com/parsa-mirsaeed/35c8f3cf6db363100f4e880c/.github/workflows/air-gapped-appliance.yml@refs/(heads/main|tags/v.*)$"
          }
          JSON
          ''',
              '',
          )

          installer = Path("deploy/appliance/edutalent-appliance")
          replace_once(
              installer,
              '''  local checksums_bundle="${ROOT_DIR}/signatures/SHA256SUMS.sigstore.json"
            local policy="${ROOT_DIR}/signatures/policy.json"
          ''',
              '''  local checksums_bundle="${ROOT_DIR}/signatures/SHA256SUMS.sigstore.json"
            local trusted_issuer="https://token.actions.githubusercontent.com"
          ''',
          )
          replace_once(
              installer,
              '''  if [[ -f "${manifest_bundle}" && -f "${checksums_bundle}" && -f "${policy}" ]]; then
              local issuer identity
              issuer="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["certificate_oidc_issuer"])' "${policy}")"
              identity="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["certificate_identity_regexp"])' "${policy}")"
              cosign verify-blob \
                --bundle "${manifest_bundle}" \
                --certificate-oidc-issuer "${issuer}" \
                --certificate-identity-regexp "${identity}" \
                "${MANIFEST}" >/dev/null
              cosign verify-blob \
                --bundle "${checksums_bundle}" \
                --certificate-oidc-issuer "${issuer}" \
                --certificate-identity-regexp "${identity}" \
                "${CHECKSUMS}" >/dev/null
              echo "Verified keyless release manifest and checksum-set signatures."
              return 0
            fi
          ''',
              '''  if [[ -f "${manifest_bundle}" && -f "${checksums_bundle}" ]]; then
              local trusted_identity="${EDUTALENT_TRUSTED_SIGSTORE_IDENTITY:-}"
              [[ -n "${trusted_identity}" ]] || {
                echo "EDUTALENT_TRUSTED_SIGSTORE_IDENTITY must be supplied from an independent trusted release channel." >&2
                return 1
              }
              cosign verify-blob \
                --bundle "${manifest_bundle}" \
                --certificate-oidc-issuer "${trusted_issuer}" \
                --certificate-identity "${trusted_identity}" \
                "${MANIFEST}" >/dev/null
              cosign verify-blob \
                --bundle "${checksums_bundle}" \
                --certificate-oidc-issuer "${trusted_issuer}" \
                --certificate-identity "${trusted_identity}" \
                "${CHECKSUMS}" >/dev/null
              echo "Verified keyless release signatures against the independently supplied workflow identity."
              return 0
            fi
          ''',
          )
          PY

      - name: Run focused syntax and review regression checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/appliance/build.sh scripts/appliance/sign_release.sh deploy/appliance/edutalent-appliance
          python3 -m py_compile scripts/appliance/release_manifest.py
          grep -Fq 'SOURCE_PRODUCTION_DIR=' scripts/appliance/build.sh
          grep -Fq 'PRODUCTION_DIR="${TEMP_DIR}/production"' scripts/appliance/build.sh
          ! grep -Fq 'rm -f "${APP_ENV}" "${SUPABASE_ENV}"' <(sed -n '/cleanup()/,/^}/p' scripts/appliance/build.sh)
          grep -Fq 'MUTABLE_INSTALLATION_FILES' scripts/appliance/release_manifest.py
          grep -Fq 'observed_mode != row["mode"]' scripts/appliance/release_manifest.py
          grep -Fq 'EDUTALENT_TRUSTED_SIGSTORE_IDENTITY' deploy/appliance/edutalent-appliance
          ! grep -Fq 'signatures/policy.json' deploy/appliance/edutalent-appliance
          ! grep -Fq 'policy.json' scripts/appliance/sign_release.sh
          git diff --check

      - name: Commit and push code-only fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/appliance/build.sh \
            scripts/appliance/release_manifest.py \
            scripts/appliance/sign_release.sh \
            deploy/appliance/edutalent-appliance
          git commit -m 'fix(appliance): close final release trust gaps'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
