name: PR-02 Apply Rustfmt

on:
  push:
    branches:
      - agent/pr-02-session-lifecycle-api-cleanup

permissions:
  contents: write

concurrency:
  group: pr-02-apply-rustfmt
  cancel-in-progress: false

jobs:
  apply-rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr-02-session-lifecycle-api-cleanup
          fetch-depth: 0
          show-progress: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply exact scoped formatting
        shell: bash
        run: |
          set -euo pipefail
          files=(
            packages/api/src/middleware/auth_guard.rs
            packages/api/src/server_function_inventory_tests.rs
            packages/api/src/server_functions/notification_functions.rs
            packages/api/src/server_functions/submission_functions.rs
            packages/api/src/session_lifecycle_integration_tests.rs
            packages/api/src/session_security.rs
          )
          rustfmt --edition 2021 --config skip_children=true "${files[@]}"
          git diff --check

          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            allowed=false
            for expected in "${files[@]}"; do
              if [[ "$path" == "$expected" ]]; then
                allowed=true
                break
              fi
            done
            [[ "$allowed" == true ]] || {
              echo "Unexpected rustfmt path: $path" >&2
              exit 1
            }
          done
          [[ ${#changed[@]} -gt 0 ]]

      - name: Commit formatting and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr-02-apply-rustfmt.yml
          git add \
            packages/api/src/middleware/auth_guard.rs \
            packages/api/src/server_function_inventory_tests.rs \
            packages/api/src/server_functions/notification_functions.rs \
            packages/api/src/server_functions/submission_functions.rs \
            packages/api/src/session_lifecycle_integration_tests.rs \
            packages/api/src/session_security.rs \
            .github/workflows/pr-02-apply-rustfmt.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'PR-02: apply canonical rustfmt'
          git push origin HEAD:agent/pr-02-session-lifecycle-api-cleanup
