name: Split Air Release Workflow

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/split-air-release-workflow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Split proof and protected release workflows
        run: |
          set -euo pipefail
          python3 scripts/ci/split_air_release_workflow.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/appliance/validate.sh')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "grep -Fq 'workflow_dispatch:' \"${air_workflow}\" || grep -Fq 'push:' \"${air_workflow}\"",
              "grep -Fxq '  workflow_dispatch:' \"${air_workflow}\" || grep -Fxq '  push:' \"${air_workflow}\"",
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused workflow and appliance regressions
        run: |
          set -euo pipefail
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Stage tested files outside workflow paths
        run: |
          set -euo pipefail
          mkdir -p scripts/ci/air-release-staging
          cp .github/workflows/air-gapped-appliance.yml scripts/ci/air-release-staging/air-gapped-appliance.yml
          cp .github/workflows/air-gapped-release.yml scripts/ci/air-release-staging/air-gapped-release.yml
          cp scripts/appliance/validate.sh scripts/ci/air-release-staging/validate.sh

      - name: Push only non-workflow staging blobs
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/ci/air-release-staging
          git commit -m 'ci: stage tested release workflow split'
          echo "STAGING_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feature/air-gapped-packaging-ghcr
