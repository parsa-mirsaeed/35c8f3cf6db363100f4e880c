          script = replace_function(script, 'restore_drill', 'pitr_start', r'''
          restore_drill() {
            require_definitions
            require_backup_configuration
            require_command docker
            local archive="$1" temp payload dump db_id db_password source_db drill_db container_dump migration_count
            [[ -f "${archive}" ]] || { echo "Backup archive not found: ${archive}" >&2; exit 1; }
            db_id="$(compose ps --quiet db)"
            [[ -n "${db_id}" ]] || { echo "Database container is not running." >&2; exit 1; }
            temp="$(mktemp -d)"
            drill_db=""
            container_dump=""
            cleanup_drill() {
              local status=$?
              if [[ -n "${db_id:-}" && -n "${container_dump:-}" ]]; then
                docker exec "${db_id}" rm -f "${container_dump}" >/dev/null 2>&1 || true
              fi
              if [[ -n "${db_id:-}" && -n "${db_password:-}" && -n "${drill_db:-}" ]]; then
                docker exec -e "PGPASSWORD=${db_password}" "${db_id}" dropdb -h 127.0.0.1 -U postgres --if-exists "${drill_db}" >/dev/null 2>&1 || true
              fi
              rm -rf "${temp}"
              return "${status}"
            }
            trap cleanup_drill RETURN
            decrypt_backup "${archive}" "${temp}"
            payload="$(find "${temp}" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            [[ -n "${payload}" ]] || { echo "Backup payload is missing." >&2; exit 1; }
            verify_decrypted_payload "${payload}"
            dump="${payload}/database/database.dump"
            [[ -f "${dump}" ]] || { echo "Database dump is missing from backup." >&2; exit 1; }
            source_db="$(read_env "${SUPABASE_ENV}" POSTGRES_DB)"; source_db="${source_db:-postgres}"
            db_password="$(read_env "${SUPABASE_ENV}" POSTGRES_PASSWORD)"
            drill_db="edutalent_restore_$(date -u +%Y%m%d%H%M%S)_$RANDOM"
            container_dump="/tmp/edutalent-restore-${RANDOM}.dump"
            docker exec -e "PGPASSWORD=${db_password}" "${db_id}" createdb -h 127.0.0.1 -U postgres "${drill_db}"
            docker cp "${dump}" "${db_id}:${container_dump}"
            docker exec -e "PGPASSWORD=${db_password}" "${db_id}" \
              pg_restore -h 127.0.0.1 -U postgres -d "${drill_db}" --no-owner --no-acl "${container_dump}"
            migration_count="$(docker exec -e "PGPASSWORD=${db_password}" "${db_id}" psql -h 127.0.0.1 -U postgres -d "${drill_db}" -Atc 'SELECT count(*) FROM public.edutalent_migration_files')"
            [[ "${migration_count}" =~ ^[1-9][0-9]*$ ]] || { echo "Restored migration registry is empty." >&2; exit 1; }
            cleanup_drill
            trap - RETURN
            echo "Database restore drill succeeded in temporary database ${drill_db}; source ${source_db} was not modified."
          }
          ''')

          pitr_insert = dedent(r'''
          pitr_verify() {
            require_command docker
            require_envs
            initialize_state
            if ! docker inspect edutalent-pitr-archive >/dev/null 2>&1; then
              pitr_start
            elif [[ "$(docker inspect --format '{{.State.Running}}' edutalent-pitr-archive 2>/dev/null || true)" != true ]]; then
              docker rm --force edutalent-pitr-archive >/dev/null 2>&1 || true
              pitr_start
            fi
            db_id="$(compose ps --quiet db)"
            [[ -n "${db_id}" ]] || { echo "Database container is not running." >&2; exit 1; }
            db_name="$(read_env "${SUPABASE_ENV}" POSTGRES_DB)"; db_name="${db_name:-postgres}"
            db_password="$(read_env "${SUPABASE_ENV}" POSTGRES_PASSWORD)"
            receiver_active=false
            for attempt in $(seq 1 60); do
              if [[ "$(docker inspect --format '{{.State.Running}}' edutalent-pitr-archive 2>/dev/null || true)" != true ]]; then
                echo "WAL receiver exited before its replication slot became active." >&2
                docker logs --tail 100 edutalent-pitr-archive >&2 || true
                exit 1
              fi
              slot_active="$(docker exec -e "PGPASSWORD=${db_password}" "${db_id}" psql -h 127.0.0.1 -U postgres -d "${db_name}" -Atc "SELECT active::text FROM pg_replication_slots WHERE slot_name='edutalent_backup'" 2>/dev/null || true)"
              if [[ "${slot_active}" == true ]]; then
                receiver_active=true
                break
              fi
              sleep 1
            done
            [[ "${receiver_active}" == true ]] || { echo "WAL receiver did not activate its physical replication slot." >&2; exit 1; }
            privilege_state="$(docker exec -e "PGPASSWORD=${db_password}" "${db_id}" psql -h 127.0.0.1 -U supabase_admin -d "${db_name}" -AtF'|' -v ON_ERROR_STOP=1 -c "SELECT (SELECT rolsuper::text FROM pg_roles WHERE rolname='postgres'), has_function_privilege('postgres', 'pg_catalog.pg_switch_wal()', 'EXECUTE')::text, has_function_privilege('supabase_admin', 'pg_catalog.pg_switch_wal()', 'EXECUTE')::text")"
            [[ "${privilege_state}" == 'false|false|true' ]] || { echo "Unexpected WAL privilege boundary: ${privilege_state}" >&2; exit 1; }
            before_inventory="$(find "${WAL_DIR}" -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9A-F]{24}' -printf '%f\n' | sort)"
            docker exec -e "PGPASSWORD=${db_password}" "${db_id}" psql -h 127.0.0.1 -U supabase_admin -d "${db_name}" -v ON_ERROR_STOP=1 -Atc 'SELECT pg_switch_wal();' >/dev/null
            wal_received=false
            for attempt in $(seq 1 60); do
              current_inventory="$(find "${WAL_DIR}" -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9A-F]{24}' -printf '%f\n' | sort)"
              if [[ -n "${current_inventory}" && "${current_inventory}" != "${before_inventory}" ]]; then
                wal_received=true
                break
              fi
              sleep 1
            done
            if [[ "${wal_received}" != true ]]; then
              echo "Active WAL receiver did not persist a new archive file after pg_switch_wal()." >&2
              docker logs --tail 100 edutalent-pitr-archive >&2 || true
              exit 1
            fi
            echo "Continuous WAL reception and forced archive verified."
          }
          ''').strip()
          marker = '\npitr_stop() {'
          position = script.find(marker)
          if position < 0:
