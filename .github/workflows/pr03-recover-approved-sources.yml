name: PR-03 Apply Worker RLS Fixes

on:
  pull_request:
    types:
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - .github/workflows/pr03-recover-approved-sources.yml

permissions:
  contents: write

concurrency:
  group: pr03-apply-worker-rls-fixes
  cancel-in-progress: false

jobs:
  apply:
    name: Apply reviewed worker and validation fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

