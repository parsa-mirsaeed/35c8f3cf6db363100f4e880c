name: Materialize Production Operations

on:
  push:
    branches:
      - feature/production-operations

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-operations
          fetch-depth: 0
          show-progress: false

      - name: Materialize reviewed production operations tree
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/bootstrap_production_operations.py
          rm -rf \
            .bootstrap \
            scripts/ci/bootstrap_production_operations.py \
            .github/workflows/bootstrap-production-operations.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: add production operations'
          git push origin HEAD:feature/production-operations
