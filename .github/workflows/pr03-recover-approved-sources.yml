          expected="$(cat <<'PATHS' | LC_ALL=C sort
          .github/workflows/pr03-recover-approved-sources.yml
          .github/workflows/production-foundation.yml
          migrations/20260805121700_system_job_rls.sql
          packages/api/src/repositories/knowledge_ingestion_job_repository.rs
          packages/api/src/rls_context.rs
          packages/api/src/rls_transaction_inventory_tests.rs
          packages/api/src/services/ai_outage_queue.rs
          packages/api/src/services/knowledge_ingestion_worker.rs
          packages/web/src/main.rs
          scripts/ci/verify_transaction_scoped_rls.sh
          PATHS
          )"
          test "${changed}" = "${expected}"
          git commit -m 'security: scope durable workers through transaction RLS'
          git push origin HEAD:agent/pr-03-transaction-scoped-rls
