name: Apply air-gapped release secret-scan fix

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: write

concurrency:
  group: apply-air-release-secret-scan-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.repository == 'parsa-mirsaeed/35c8f3cf6db363100f4e880c' &&
      github.event.label.name == 'apply-release-followup-fix' &&
      github.event.pull_request.head.ref == 'feature/air-gapped-packaging-ghcr' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Apply reviewed protected-release secret-scan fix
        run: python3 scripts/ci/apply_air_release_secret_scan_fix.py

      - name: Run focused release workflow regressions
        run: |
          set -euo pipefail
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit implementation and regression checks together
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            .github/workflows/air-gapped-release.yml \
            scripts/appliance/validate.sh
          git diff --cached --check
          git status --short
          git commit -m 'fix(release): gate publication on all-history secret scan'
          git push origin HEAD:feature/air-gapped-packaging-ghcr
