name: Fix PR OIDC isolation

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/fix-pr-oidc-isolation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Apply credential-boundary transformation
        run: python3 scripts/ci/apply_oidc_fix.py

      - name: Remove temporary patch machinery
        run: |
          rm .github/workflows/fix-pr-oidc-isolation.yml
          rm scripts/ci/apply_oidc_fix.py

      - name: Run focused security regressions
        run: |
          set -euo pipefail
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit credential boundary correction
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/air-gapped-appliance.yml \
            .github/workflows/mirror-final-proof.yml \
            scripts/appliance/validate.sh \
            .github/workflows/fix-pr-oidc-isolation.yml \
            scripts/ci/apply_oidc_fix.py
          git commit -m 'fix(ci): isolate OIDC from PR appliance proof'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feature/air-gapped-packaging-ghcr
