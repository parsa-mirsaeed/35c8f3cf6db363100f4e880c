name: Apply exact-container backup resume fix

on:
  push:
    branches:
      - feature/production-operations
    paths:
      - .github/workflows/apply-backup-resume-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-operations
          fetch-depth: 0
          show-progress: false

      - name: Patch backup resume lifecycle and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          script_path = Path("deploy/production/edutalent-operations")
          script = script_path.read_text(encoding="utf-8")

          replacements = [
              (
                  '  local -a running_services=() quiesced_services=()\n',
                  '  local -a running_services=() quiesced_services=() quiesced_container_ids=()\n',
              ),
              (
                  '''  cleanup_backup() {
            local status=$?
            if [[ "${services_resumed}" != true && ${#quiesced_services[@]} -gt 0 ]]; then
              if compose start "${quiesced_services[@]}" >/dev/null; then
                services_resumed=true
              else
                echo "Failed to resume services after backup capture." >&2
                status=1
              fi
            fi
            rm -rf "${temp}" "${archive}.partial"
            return "${status}"
          }
''',
                  '''  resume_quiesced_containers() {
            local container_id
            (( ${#quiesced_container_ids[@]} > 0 )) || return 0
            docker start "${quiesced_container_ids[@]}" >/dev/null
            for container_id in "${quiesced_container_ids[@]}"; do
              [[ "$(docker inspect --format '{{.State.Running}}' "${container_id}" 2>/dev/null || true)" == true ]] || {
                echo "Writer-facing container did not resume: ${container_id}" >&2
                return 1
              }
            done
          }
          cleanup_backup() {
            local status=$?
            if [[ "${services_resumed}" != true && ${#quiesced_container_ids[@]} -gt 0 ]]; then
              if resume_quiesced_containers; then
                services_resumed=true
              else
                echo "Failed to resume services after backup capture." >&2
                status=1
              fi
            fi
            rm -rf "${temp}" "${archive}.partial"
            return "${status}"
          }
''',
              ),
              (
                  '''  compose stop --timeout 30 "${quiesced_services[@]}" >/dev/null
          for service in "${quiesced_services[@]}"; do
            id="$(compose ps --all --quiet "${service}" 2>/dev/null || true)"
            if [[ -n "${id}" && "$(docker inspect --format '{{.State.Running}}' "${id}" 2>/dev/null || true)" == true ]]; then
              echo "Writer-facing service did not quiesce: ${service}" >&2
              exit 1
            fi
          done
''',
                  '''  for service in "${quiesced_services[@]}"; do
            id="$(compose ps --quiet "${service}" 2>/dev/null || true)"
            [[ -n "${id}" ]] || {
              echo "Writer-facing service container disappeared before quiescence: ${service}" >&2
              exit 1
            }
            quiesced_container_ids+=("${id}")
          done
          compose stop --timeout 30 "${quiesced_services[@]}" >/dev/null
          for index in "${!quiesced_services[@]}"; do
            service="${quiesced_services[$index]}"
            id="${quiesced_container_ids[$index]}"
            if [[ "$(docker inspect --format '{{.State.Running}}' "${id}" 2>/dev/null || true)" == true ]]; then
              echo "Writer-facing service did not quiesce: ${service}" >&2
              exit 1
            fi
          done
''',
              ),
              (
                  '  compose start "${quiesced_services[@]}" >/dev/null\n  services_resumed=true\n',
                  '  resume_quiesced_containers\n  services_resumed=true\n',
              ),
          ]
          for old, new in replacements:
              count = script.count(old)
              if count != 1:
                  raise SystemExit(f"expected one script match, found {count}: {old[:80]!r}")
              script = script.replace(old, new, 1)
          script_path.write_text(script, encoding="utf-8")

          test_path = Path("deploy/production/operations/test_review_regressions.py")
          tests = test_path.read_text(encoding="utf-8")
          old_test = '''    def test_backup_quiesces_and_resumes_writer_services(self) -> None:
                  backup = self.function("backup_create", "backup_verify")
                  self.assertIn("compose ps --services --filter status=running", backup)
                  self.assertIn("compose stop --timeout 30", backup)
                  self.assertIn('compose start "${quiesced_services[@]}"', backup)
                  self.assertIn("--no-deps --pull never --entrypoint sh app", backup)
                  self.assertIn('\"consistency\": \"write-quiesced\"', backup)
                  quiesce_case = backup.split('case "${service}" in', 1)[1].split('esac', 1)[0]
                  self.assertNotIn("db|", quiesce_case)
                  self.assertNotIn("qdrant", quiesce_case)
'''
          new_test = '''    def test_backup_quiesces_and_resumes_exact_writer_containers(self) -> None:
                  backup = self.function("backup_create", "backup_verify")
                  self.assertIn("compose ps --services --filter status=running", backup)
                  self.assertIn("compose stop --timeout 30", backup)
                  self.assertIn("quiesced_container_ids=()", backup)
                  self.assertIn('id="$(compose ps --quiet "${service}"', backup)
                  self.assertIn('docker start "${quiesced_container_ids[@]}"', backup)
                  self.assertNotIn('compose start "${quiesced_services[@]}"', backup)
                  self.assertIn("--no-deps --pull never --entrypoint sh app", backup)
                  self.assertIn('\"consistency\": \"write-quiesced\"', backup)
                  quiesce_case = backup.split('case "${service}" in', 1)[1].split('esac', 1)[0]
                  self.assertNotIn("db|", quiesce_case)
                  self.assertNotIn("qdrant", quiesce_case)
'''
          count = tests.count(old_test)
          if count != 1:
              raise SystemExit(f"expected one regression-test match, found {count}")
          test_path.write_text(tests.replace(old_test, new_test, 1), encoding="utf-8")

          Path(".github/workflows/apply-backup-resume-fix.yml").unlink()
          PY

          bash -n deploy/production/edutalent-operations
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s deploy/production/operations -p 'test_*.py' -v
          git diff --check
          if find deploy/production/operations -type d -name __pycache__ -o -type f -name '*.pyc' | grep -q .; then
            echo "Python bytecode was generated during patch validation." >&2
            exit 1
          fi

      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/production/edutalent-operations \
            deploy/production/operations/test_review_regressions.py \
            .github/workflows/apply-backup-resume-fix.yml
          git diff --cached --check
          git commit -m "fix(operations): resume exact quiesced containers"
          git push origin HEAD:feature/production-operations
