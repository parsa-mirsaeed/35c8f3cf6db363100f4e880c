name: PR-11 Offline CSP

on:
  pull_request:
    paths:
      - "packages/web/**"
      - "packages/api/src/middleware/legacy_teacher_material_guard.rs"
      - "scripts/ci/verify_browser_asset_origins.py"
      - "docs/security/pr-11-offline-browser-boundary.md"
      - ".github/workflows/pr-11-offline-csp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-11-offline-csp-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  offline-browser-boundary:
    name: Offline browser boundary and asset scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Verify browser origins and secrets
        run: python3 scripts/ci/verify_browser_asset_origins.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-11-offline-csp
          cache-on-failure: true

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Compile web production surface
        run: cargo check -p web --features server --all-targets --locked --message-format=short

      - name: Run CSP/security middleware regression tests
        run: cargo test -p api --features server middleware::legacy_teacher_material_guard::tests --locked

      - name: Run web regression tests
        run: cargo test -p web --features server --locked
