name: Apply Backup Mode Fix

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/production-operations' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-operations
          fetch-depth: 0
          show-progress: false

      - name: Preserve archived modes during encrypted backup extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('deploy/production/edutalent-operations')
          text = path.read_text(encoding='utf-8')
          old = '''  openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \\
    -pass "file:${EDUTALENT_BACKUP_PASSPHRASE_FILE}" \\
    -in "${archive}" | tar -C "${destination}" -xzf -
          '''
          new = '''  openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \\
    -pass "file:${EDUTALENT_BACKUP_PASSPHRASE_FILE}" \\
    -in "${archive}" | tar -C "${destination}" --extract --gzip --file=- --same-permissions
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one decrypt pipeline, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          bash -n deploy/production/edutalent-operations
          grep -Fq -- '--same-permissions' deploy/production/edutalent-operations
          git diff --check

      - name: Commit production backup fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/production/edutalent-operations
          git diff --cached --quiet && { echo 'Backup mode patch produced no change.' >&2; exit 1; }
          git commit -m 'fix: preserve backup payload modes during restore'
          git push origin HEAD:feature/production-operations
