name: Apply air-gapped release secret-scan fix

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: write

concurrency:
  group: apply-air-release-secret-scan-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.repository == 'parsa-mirsaeed/35c8f3cf6db363100f4e880c' &&
      github.event.label.name == 'apply-release-followup-fix' &&
      github.event.pull_request.head.ref == 'feature/air-gapped-packaging-ghcr' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Apply protected-release secret-scan regression checks
        run: python3 scripts/ci/apply_air_release_secret_scan_validate_fix.py

      - name: Run focused release workflow regressions
        run: |
          set -euo pipefail
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Install verified Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${archive}" | sha256sum --check -
          mkdir -p "${install_dir}"
          tar --extract --gzip --file "${archive}" --directory "${install_dir}" gitleaks
          chmod 0755 "${install_dir}/gitleaks"
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Prove redacted all-history secret scan
        shell: bash
        run: |
          set -euo pipefail
          gitleaks detect --source . --redact --no-banner --log-opts="--all" \
            2>&1 | tee gitleaks-all-history.log

      - name: Upload redacted scan diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: air-release-secret-scan-proof
          path: gitleaks-all-history.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit regression checks
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- scripts/appliance/validate.sh
          git diff --cached --check
          git status --short
          git commit -m 'test(release): enforce protected secret-scan gate'
          git push origin HEAD:feature/air-gapped-packaging-ghcr
