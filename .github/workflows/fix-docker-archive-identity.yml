name: Fix Docker archive identity
# Trigger after workflow creation.

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/fix-docker-archive-identity.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Apply archive-layout compatibility and regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest_path = Path("scripts/appliance/release_manifest.py")
          text = manifest_path.read_text(encoding="utf-8")
          start = text.index("def docker_archive_identity(path: Path) -> tuple[str, set[str]]:")
          end = text.index("\n\ndef file_inventory", start)
          new_function = '''def docker_archive_identity(path: Path) -> tuple[str, set[str]]:
              try:
                  with tarfile.open(path, mode="r:gz") as archive:
                      try:
                          manifest_handle = archive.extractfile("manifest.json")
                      except KeyError:
                          manifest_handle = None
                      if manifest_handle is None:
                          raise RuntimeError("Docker archive manifest.json is missing")
                      entries = json.loads(manifest_handle.read())
                      if not isinstance(entries, list) or len(entries) != 1:
                          raise RuntimeError("each appliance archive must contain exactly one image")
                      entry = entries[0]
                      config_name = entry.get("Config", "")
                      if not isinstance(config_name, str):
                          raise RuntimeError("Docker archive image config is invalid")
                      legacy = re.fullmatch(r"([0-9a-f]{64})\\.json", config_name)
                      content_store = re.fullmatch(r"blobs/sha256/([0-9a-f]{64})", config_name)
                      match = legacy or content_store
                      if match is None:
                          raise RuntimeError("Docker archive image config is invalid")
                      declared_digest = match.group(1)
                      try:
                          config_handle = archive.extractfile(config_name)
                      except KeyError:
                          config_handle = None
                      if config_handle is None:
                          raise RuntimeError("Docker archive image config is missing")
                      config = config_handle.read()
                      digest = hashlib.sha256(config).hexdigest()
                      if declared_digest != digest:
                          raise RuntimeError("Docker archive config name does not match its content digest")
                      tags = entry.get("RepoTags") or []
                      if not isinstance(tags, list) or not all(isinstance(tag, str) for tag in tags):
                          raise RuntimeError("Docker archive RepoTags are invalid")
                      return f"sha256:{digest}", set(tags)
              except (tarfile.TarError, json.JSONDecodeError) as error:
                  raise RuntimeError(f"invalid Docker image archive: {path.name}") from error
          '''
          manifest_path.write_text(text[:start] + new_function.rstrip() + text[end:], encoding="utf-8")

          validate_path = Path("scripts/appliance/validate.sh")
          text = validate_path.read_text(encoding="utf-8")
          replacements = (
              ('"Config": f"{digest}.json",', '"Config": f"blobs/sha256/{digest}",'),
              ('for name, data in ((f"{digest}.json", config), ("manifest.json", manifest)):',
               'for name, data in ((f"blobs/sha256/{digest}", config), ("manifest.json", manifest)):'),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"archive fixture changed unexpectedly: {old}")
              text = text.replace(old, new, 1)

          marker = "printf '{}\\n' > \"${fixture}/bundle/sbom/images/fixture.spdx.json\"\n"
          if text.count(marker) != 1:
              raise SystemExit("archive regression insertion point changed unexpectedly")
          regression = r'''python3 - "${ROOT_DIR}/scripts/appliance/release_manifest.py" "${fixture}/docker-archive-layouts" <<'PYARCHIVE'
          import hashlib
          import importlib.util
          import io
          import json
          import sys
          import tarfile
          from pathlib import Path

          source = Path(sys.argv[1])
          root = Path(sys.argv[2])
          root.mkdir(parents=True, exist_ok=True)
          spec = importlib.util.spec_from_file_location("appliance_release_archive", source)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          config = json.dumps(
              {
                  "architecture": "amd64",
                  "config": {},
                  "os": "linux",
                  "rootfs": {"diff_ids": [], "type": "layers"},
              },
              sort_keys=True,
              separators=(",", ":"),
          ).encode()
          digest = hashlib.sha256(config).hexdigest()
          tag = "edutalent-offline/archive-layout:v1-amd64-aaaaaaaaaaaaaaaa"

          def write_archive(path: Path, config_name: str, payload: bytes = config) -> None:
              manifest = json.dumps(
                  [{"Config": config_name, "Layers": [], "RepoTags": [tag]}],
                  separators=(",", ":"),
              ).encode()
              with tarfile.open(path, "w:gz") as archive:
                  for name, data in ((config_name, payload), ("manifest.json", manifest)):
                      info = tarfile.TarInfo(name)
                      info.mode = 0o644
                      info.mtime = 0
                      info.size = len(data)
                      archive.addfile(info, io.BytesIO(data))

          for label, config_name in (
              ("legacy", f"{digest}.json"),
              ("containerd", f"blobs/sha256/{digest}"),
          ):
              archive_path = root / f"{label}.tar.gz"
              write_archive(archive_path, config_name)
              image_id, tags = module.docker_archive_identity(archive_path)
              assert image_id == f"sha256:{digest}", (label, image_id)
              assert tags == {tag}, (label, tags)

          mismatch = root / "digest-mismatch.tar.gz"
          write_archive(mismatch, "blobs/sha256/" + "0" * 64)
          try:
              module.docker_archive_identity(mismatch)
          except RuntimeError as error:
              assert "content digest" in str(error)
          else:
              raise AssertionError("Docker archive config digest mismatch was accepted")

          unsupported = root / "unsupported-config-path.tar.gz"
          write_archive(unsupported, f"../{digest}.json")
          try:
              module.docker_archive_identity(unsupported)
          except RuntimeError as error:
              assert "config is invalid" in str(error)
          else:
              raise AssertionError("unsafe Docker archive config path was accepted")
          PYARCHIVE
          '''
          text = text.replace(marker, regression + marker, 1)
          validate_path.write_text(text, encoding="utf-8")
          PY

      - name: Validate focused and complete appliance definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/appliance/release_manifest.py
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit source-only correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/appliance/release_manifest.py scripts/appliance/validate.sh
          git commit -m 'fix(appliance): accept content-addressed Docker archives'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
