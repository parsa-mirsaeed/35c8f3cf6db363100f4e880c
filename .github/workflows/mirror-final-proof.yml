name: Mirror Final Proof

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review

permissions:
  contents: read
  actions: write

concurrency:
  group: mirror-final-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch-and-verify:
    name: Verify and serialize complete exact-head proof
    if: >-
      contains(github.event.pull_request.labels.*.name, 'full-validation') &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Resolve exact-head pull-request gates
        id: pr-runs
        shell: bash
        run: |
          set -euo pipefail

          find_pr_run() {
            local workflow="$1" attempt run_id
            for attempt in $(seq 1 180); do
              run_id="$(gh run list \
                --repo "$REPOSITORY" \
                --workflow "$workflow" \
                --branch "$HEAD_REF" \
                --event pull_request \
                --limit 50 \
                --json databaseId,headSha \
                --jq "[.[] | select(.headSha == \"$HEAD_SHA\")] | if length == 0 then empty else max_by(.databaseId).databaseId end")"
              if [[ -n "$run_id" ]]; then
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 5
            done
            echo "Unable to resolve pull-request run for $workflow at $HEAD_SHA" >&2
            return 1
          }

          ai_run_id="$(find_pr_run 'AI Change Proof')"
          full_run_id="$(find_pr_run 'Full Validation')"
          production_run_id="$(find_pr_run 'Production Foundation')"
          {
            echo "ai_run_id=$ai_run_id"
            echo "full_run_id=$full_run_id"
            echo "production_run_id=$production_run_id"
          } >> "$GITHUB_OUTPUT"
          echo "AI Change Proof run: $ai_run_id"
          echo "Full Validation run: $full_run_id"
          echo "Production Foundation run: $production_run_id"

      - name: Wait for exact-head pull-request gates
        shell: bash
        run: |
          set -euo pipefail
          gh run watch '${{ steps.pr-runs.outputs.ai_run_id }}' \
            --repo "$REPOSITORY" --exit-status
          gh run watch '${{ steps.pr-runs.outputs.full_run_id }}' \
            --repo "$REPOSITORY" --exit-status
          gh run watch '${{ steps.pr-runs.outputs.production_run_id }}' \
            --repo "$REPOSITORY" --exit-status

      - name: Enforce AI, full validation, and production jobs
        shell: bash
        run: |
          set -euo pipefail
          gh run view '${{ steps.pr-runs.outputs.ai_run_id }}' \
            --repo "$REPOSITORY" \
            --json headSha,event,status,conclusion,jobs,url > ai-run.json
          gh run view '${{ steps.pr-runs.outputs.full_run_id }}' \
            --repo "$REPOSITORY" \
            --json headSha,event,status,conclusion,jobs,url > full-validation-run.json
          gh run view '${{ steps.pr-runs.outputs.production_run_id }}' \
            --repo "$REPOSITORY" \
            --json headSha,event,status,conclusion,jobs,url > production-run.json

          python3 - "$HEAD_SHA" ai-run.json full-validation-run.json production-run.json <<'PY'
          import json
          import sys

          expected_sha, ai_path, full_path, production_path = sys.argv[1:]
          ai = json.load(open(ai_path, encoding="utf-8"))
          full = json.load(open(full_path, encoding="utf-8"))
          production = json.load(open(production_path, encoding="utf-8"))

          def require_pr_run(run, name):
              assert run["headSha"] == expected_sha, (name, run["headSha"], expected_sha)
              assert run["event"] == "pull_request", (name, run["event"])
              assert run["status"] == "completed", (name, run["status"])
              assert run["conclusion"] == "success", (name, run["conclusion"])

          require_pr_run(ai, "AI Change Proof")
          require_pr_run(full, "Full Validation")
          require_pr_run(production, "Production Foundation")

          ai_jobs = {job["name"]: job["conclusion"] for job in ai["jobs"]}
          assert ai_jobs.get("AI change gate") == "success", ai_jobs

          full_jobs = {job["name"]: job["conclusion"] for job in full["jobs"]}
          for job_name in (
              "Resolve full-validation mode",
              "Full database validation",
              "Full Rust compile, lint, and tests",
              "Full validation gate",
          ):
              assert full_jobs.get(job_name) == "success", (job_name, full_jobs.get(job_name))

          production_jobs = {job["name"]: job["conclusion"] for job in production["jobs"]}
          for job_name in (
              "Render and verify production topology",
              "Apply migrations and roles on pinned Supabase PostgreSQL 17",
              "Start complete production stack",
          ):
              assert production_jobs.get(job_name) == "success", (
                  job_name,
                  production_jobs.get(job_name),
              )
          PY

      - name: Dispatch exact-head Package after prerequisite gates
        id: package
        shell: bash
        run: |
          set -euo pipefail
          previous="$(gh run list \
            --repo "$REPOSITORY" \
            --workflow 'Package' \
            --branch "$HEAD_REF" \
            --event workflow_dispatch \
            --limit 50 \
            --json databaseId,headSha \
            --jq "[.[] | select(.headSha == \"$HEAD_SHA\") | .databaseId] | if length == 0 then 0 else max end")"
          gh workflow run package.yml --repo "$REPOSITORY" --ref "$HEAD_REF"
          for attempt in $(seq 1 120); do
            run_id="$(gh run list \
              --repo "$REPOSITORY" \
              --workflow 'Package' \
              --branch "$HEAD_REF" \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,headSha \
              --jq "[.[] | select(.headSha == \"$HEAD_SHA\") | .databaseId] | if length == 0 then 0 else max end")"
            if (( run_id > previous )); then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Package run: $run_id"
              exit 0
            fi
            sleep 5
          done
          echo "Unable to resolve newly dispatched Package run at $HEAD_SHA" >&2
          exit 1

      - name: Wait for and inspect complete Package proof
        shell: bash
        run: |
          set -euo pipefail
          gh run watch '${{ steps.package.outputs.run_id }}' \
            --repo "$REPOSITORY" --exit-status
          gh run view '${{ steps.package.outputs.run_id }}' \
            --repo "$REPOSITORY" \
            --json headSha,event,status,conclusion,jobs,url > package-run.json
          python3 - "$HEAD_SHA" package-run.json <<'PY'
          import json
          import sys

          expected_sha, path = sys.argv[1:]
          run = json.load(open(path, encoding="utf-8"))
          assert run["headSha"] == expected_sha, (run["headSha"], expected_sha)
          assert run["event"] == "workflow_dispatch", run["event"]
          assert run["status"] == "completed", run["status"]
          assert run["conclusion"] == "success", run["conclusion"]
          jobs = {job["name"]: job["conclusion"] for job in run["jobs"]}
          for job_name in ("Validate package definitions", "Docker image and release bundle"):
              assert jobs.get(job_name) == "success", (job_name, jobs.get(job_name))
          PY

      - name: Dispatch complete exact-head Air-gapped Appliance proof
        id: appliance
        shell: bash
        run: |
          set -euo pipefail
          previous="$(gh run list \
            --repo "$REPOSITORY" \
            --workflow 'Air-gapped Appliance' \
            --branch "$HEAD_REF" \
            --event workflow_dispatch \
            --limit 50 \
            --json databaseId,headSha \
            --jq "[.[] | select(.headSha == \"$HEAD_SHA\") | .databaseId] | if length == 0 then 0 else max end")"
          gh workflow run air-gapped-appliance.yml \
            --repo "$REPOSITORY" \
            --ref "$HEAD_REF" \
            -f publish=false \
            -f create_archive=false
          for attempt in $(seq 1 120); do
            run_id="$(gh run list \
              --repo "$REPOSITORY" \
              --workflow 'Air-gapped Appliance' \
              --branch "$HEAD_REF" \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,headSha \
              --jq "[.[] | select(.headSha == \"$HEAD_SHA\") | .databaseId] | if length == 0 then 0 else max end")"
            if (( run_id > previous )); then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Air-gapped Appliance run: $run_id"
              exit 0
            fi
            sleep 5
          done
          echo "Unable to resolve newly dispatched Air-gapped Appliance run at $HEAD_SHA" >&2
          exit 1

      - name: Wait for and inspect complete appliance proof
        shell: bash
        run: |
          set -euo pipefail
          gh run watch '${{ steps.appliance.outputs.run_id }}' \
            --repo "$REPOSITORY" --exit-status
          gh run view '${{ steps.appliance.outputs.run_id }}' \
            --repo "$REPOSITORY" \
            --json headSha,event,status,conclusion,jobs,url > appliance-run.json
          python3 - "$HEAD_SHA" appliance-run.json <<'PY'
          import json
          import sys

          expected_sha, path = sys.argv[1:]
          run = json.load(open(path, encoding="utf-8"))
          assert run["headSha"] == expected_sha, (run["headSha"], expected_sha)
          assert run["event"] == "workflow_dispatch", run["event"]
          assert run["status"] == "completed", run["status"]
          assert run["conclusion"] == "success", run["conclusion"]
          jobs = {job["name"]: job["conclusion"] for job in run["jobs"]}
          for job_name in (
              "Validate appliance definitions",
              "Build and verify complete air-gapped appliance",
              "Build custom images natively for arm64",
              "Air-gapped appliance gate",
          ):
              assert jobs.get(job_name) == "success", (job_name, jobs.get(job_name))
          assert jobs.get("Publish native ${{ matrix.arch }} GHCR images") == "skipped", jobs
          assert jobs.get("Assemble, sign, and attest multi-architecture GHCR indexes") == "skipped", jobs
          print("Complete serialized exact-head proof verified.")
          PY

      - name: Upload exact-head mirror evidence
        uses: actions/upload-artifact@v6
        with:
          name: mirror-final-proof
          path: |
            ai-run.json
            full-validation-run.json
            production-run.json
            package-run.json
            appliance-run.json
          if-no-files-found: error
          retention-days: 7
