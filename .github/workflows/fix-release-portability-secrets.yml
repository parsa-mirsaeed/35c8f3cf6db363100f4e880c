name: Fix release portability and key scanning

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/fix-release-portability-secrets.yml

permissions:
  contents: write

jobs:
  patch:
    name: Apply portable checksums and private-key detection
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact release fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          build = Path("scripts/appliance/build.sh")
          replace_once(
              build,
              '''    checksum_file="${ROOT_DIR}/dist/${BUNDLE_NAME}.parts.SHA256SUMS"
              sha256sum "${archive}.part-"* > "${checksum_file}"
          ''',
              '''    checksum_file="${ROOT_DIR}/dist/${BUNDLE_NAME}.parts.SHA256SUMS"
              (
                cd "${ROOT_DIR}/dist"
                sha256sum "${BUNDLE_NAME}.tar.gz.part-"*
              ) > "${checksum_file}"
          ''',
          )
          replace_once(
              build,
              '''    checksum_file="${archive}.SHA256SUMS"
              sha256sum "${archive}" > "${checksum_file}"
          ''',
              '''    checksum_file="${archive}.SHA256SUMS"
              (
                cd "${ROOT_DIR}/dist"
                sha256sum "${BUNDLE_NAME}.tar.gz"
              ) > "${checksum_file}"
          ''',
          )

          manifest = Path("scripts/appliance/release_manifest.py")
          replace_once(
              manifest,
              '''PRIVATE_KEY_MARKERS = (
              b"-----BEGIN " + b"PRIVATE KEY-----",
              b"-----BEGIN RSA " + b"PRIVATE KEY-----",
          )
          ''',
              '''PRIVATE_KEY_MARKERS = (
              b"-----BEGIN " + b"PRIVATE KEY-----",
              b"-----BEGIN RSA " + b"PRIVATE KEY-----",
              b"-----BEGIN EC " + b"PRIVATE KEY-----",
              b"-----BEGIN DSA " + b"PRIVATE KEY-----",
              b"-----BEGIN OPENSSH " + b"PRIVATE KEY-----",
              b"-----BEGIN ENCRYPTED " + b"PRIVATE KEY-----",
              b"-----BEGIN PGP " + b"PRIVATE KEY BLOCK-----",
          )
          ''',
          )

          validate = Path("scripts/appliance/validate.sh")
          replace_once(
              validate,
              '''cp "${ROOT_DIR}/deploy/appliance/edutalent-appliance" \
              "${fixture}/bundle/edutalent-appliance"
          chmod 0755 "${fixture}/bundle/edutalent-appliance"
          python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" generate \
          ''',
              '''cp "${ROOT_DIR}/deploy/appliance/edutalent-appliance" \
              "${fixture}/bundle/edutalent-appliance"
          chmod 0755 "${fixture}/bundle/edutalent-appliance"
          for marker in \
            "-----BEGIN PRIVATE KEY-----" \
            "-----BEGIN RSA PRIVATE KEY-----" \
            "-----BEGIN EC PRIVATE KEY-----" \
            "-----BEGIN DSA PRIVATE KEY-----" \
            "-----BEGIN OPENSSH PRIVATE KEY-----" \
            "-----BEGIN ENCRYPTED PRIVATE KEY-----" \
            "-----BEGIN PGP PRIVATE KEY BLOCK-----"; do
            printf '%s\\nfixture\\n' "${marker}" > "${fixture}/bundle/leaked-credential.txt"
            if python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" generate \
              --bundle "${fixture}/bundle" \
              --version fixture \
              --git-sha 0123456789abcdef0123456789abcdef01234567 \
              --platform linux/amd64 \
              --signing-mode keyless \
              --images "${fixture}/bundle/manifests/images.json" \
              --model-lock "${fixture}/model.lock.json" >/dev/null 2>&1; then
              echo "private-key marker was accepted: ${marker}" >&2
              exit 1
            fi
            rm -f "${fixture}/bundle/leaked-credential.txt"
          done
          python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" generate \
          ''',
          )
          replace_once(
              validate,
              '''test "${package_line}" -lt "${appliance_line}"
          if grep -Fq 'setup-qemu-action' "${air_workflow}"; then
          ''',
              '''test "${package_line}" -lt "${appliance_line}"
          grep -Fq 'sha256sum "${BUNDLE_NAME}.tar.gz.part-"*' "${ROOT_DIR}/scripts/appliance/build.sh"
          grep -Fq 'sha256sum "${BUNDLE_NAME}.tar.gz"' "${ROOT_DIR}/scripts/appliance/build.sh"
          portable_checksums="${fixture}/portable-checksums"
          mkdir -p "${portable_checksums}/source" "${portable_checksums}/moved"
          printf 'portable archive\\n' > "${portable_checksums}/source/release.tar.gz"
          (cd "${portable_checksums}/source" && sha256sum release.tar.gz > release.tar.gz.SHA256SUMS)
          cp "${portable_checksums}/source/release.tar.gz" \
            "${portable_checksums}/source/release.tar.gz.SHA256SUMS" \
            "${portable_checksums}/moved/"
          (cd "${portable_checksums}/moved" && sha256sum --check release.tar.gz.SHA256SUMS)
          test "$(awk '{print $2}' "${portable_checksums}/moved/release.tar.gz.SHA256SUMS")" = 'release.tar.gz'
          if grep -Fq 'setup-qemu-action' "${air_workflow}"; then
          ''',
          )
          PY

      - name: Run focused release regression suite
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/appliance/build.sh scripts/appliance/validate.sh
          python3 -m py_compile scripts/appliance/release_manifest.py
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit source-only release fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/appliance/build.sh scripts/appliance/release_manifest.py scripts/appliance/validate.sh
          git commit -m 'fix(appliance): make checksums portable and reject key headers'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
