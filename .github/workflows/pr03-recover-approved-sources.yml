          -- PR-03: tightly bound the durable knowledge worker to transaction-scoped RLS.
          -- Global queue discovery is available only through two SECURITY DEFINER
          -- functions that verify the explicit no-school scheduler context. Every
          -- operation after claim is constrained by the claimed asset's school.

          CREATE OR REPLACE FUNCTION public.claim_next_embedding_job()
          RETURNS TABLE (
              job_id UUID,
              asset_id UUID,
              requested_by UUID,
              school_id UUID,
              attempts INTEGER
          )
          LANGUAGE plpgsql
          SECURITY DEFINER
          SET search_path = pg_catalog, public
          AS $$
          BEGIN
              IF public.get_role() <> 'system_job'
                 OR NOT public.get_elevated_operation()
                 OR public.get_school_id() IS NOT NULL
                 OR public.get_user_id() IS NULL THEN
                  RAISE EXCEPTION 'bounded system queue context required'
                      USING ERRCODE = '42501';
              END IF;

              RETURN QUERY
              WITH candidate AS (
                  SELECT job.id, asset.school_id
                  FROM public.ingestion_jobs AS job
                  JOIN public.knowledge_assets AS asset ON asset.id = job.asset_id
                  JOIN public.users AS requester
                    ON requester.id = job.requested_by
                   AND requester.is_active
                  WHERE job.stage = 'embed'
                    AND job.status = 'queued'
                    AND job.available_at <= NOW()
                    AND asset.status = 'embedding_pending'
                  ORDER BY job.available_at, job.created_at
                  FOR UPDATE OF job SKIP LOCKED
                  LIMIT 1
              )
              UPDATE public.ingestion_jobs AS job
              SET status = 'running',
                  attempts = job.attempts + 1,
                  started_at = COALESCE(job.started_at, NOW()),
                  locked_at = NOW(),
                  heartbeat_at = NOW(),
                  error_message = NULL
              FROM candidate
              WHERE job.id = candidate.id
              RETURNING job.id, job.asset_id, job.requested_by,
                        candidate.school_id, job.attempts;
          END
          $$;

