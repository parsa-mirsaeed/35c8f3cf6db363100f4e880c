# One-shot PR-03 classifier correction; self-deletes after guarded commit.
name: PR-03 Fix AI Classifier

on:
  pull_request:
    types:
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - .github/workflows/pr03-fix-ai-classifier.yml

permissions:
  contents: write

concurrency:
  group: pr03-fix-ai-classifier
  cancel-in-progress: false

jobs:
  fix:
    name: Enforce full-PR impact classification
    if: github.head_ref == 'agent/pr-03-transaction-scoped-rls'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Patch classifier deterministically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          source = path.read_text()
          old = '''          comparison=repository
          if [[ "$EVENT_NAME" == "pull_request" && "$EVENT_ACTION" == "synchronize" && -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > changed-files.txt
            comparison=commit
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed-files.txt
            comparison=pull-request
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD > changed-files.txt
            comparison=commit
          else
            git ls-files > changed-files.txt
          fi

          sort -u changed-files.txt -o changed-files.txt

          # A validation-rule change can alter which proof is required for every
          # file in the pull request. Escalate it to the complete PR impact set.
          if [[ "$EVENT_NAME" == "pull_request" ]] && grep -Eq '^\\.github/workflows/(ci|full-validation|package|production-foundation|air-gapped-appliance|mirror-final-proof)\\.yml$' changed-files.txt; then
            git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed-files.txt
            sort -u changed-files.txt -o changed-files.txt
            comparison=pull-request-validation
          fi
'''
          new = '''          comparison=repository
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Classify the complete candidate on every PR update. A final docs or
            # script-only commit must not hide earlier Rust/database changes.
            git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed-files.txt
            comparison=pull-request
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD > changed-files.txt
            comparison=commit
          else
            git ls-files > changed-files.txt
          fi

          sort -u changed-files.txt -o changed-files.txt
'''
          if source.count(old) != 1:
              raise SystemExit('expected classifier block was not found exactly once')
          source = source.replace(old, new)
          old_scope = r'scripts/ci/(apply_migrations|verify_knowledge_schema|verify_knowledge_security)\.sh'
          new_scope = r'scripts/ci/(apply_migrations|verify_knowledge_schema|verify_knowledge_security|verify_transaction_scoped_rls)\.sh'
          if source.count(old_scope) != 1:
              raise SystemExit('expected database scope expression was not found exactly once')
          path.write_text(source.replace(old_scope, new_scope))
          PY
          rm -f .github/workflows/pr03-fix-ai-classifier.yml

      - name: Commit guarded classifier correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          changed="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/ci.yml' \
            '.github/workflows/pr03-fix-ai-classifier.yml' | LC_ALL=C sort)"
          test "${changed}" = "${expected}"
          git commit -m 'ci: classify complete pull request impact'
          git push origin HEAD:agent/pr-03-transaction-scoped-rls
