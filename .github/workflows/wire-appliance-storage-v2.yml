name: Wire appliance mutable storage v2

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/wire-appliance-storage-v2.yml

permissions:
  contents: write

jobs:
  patch:
    name: Apply and test external appliance state
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact source transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build = Path("scripts/appliance/build.sh")
          text = build.read_text(encoding="utf-8")
          start_marker = 'python3 - "${TEMP_DIR}/service-images.tsv" "${BUNDLE_DIR}/manifests/images.json" "${BUNDLE_DIR}/manifests/compose.locked.yaml" <<\'PY\'\n'
          end_marker = '\nPY\n\npython3 - "${BUNDLE_DIR}/provenance/release-builder.json"'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("unable to isolate inline locked Compose generator")
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len("\nPY")
          replacement = '''python3 "${ROOT_DIR}/scripts/appliance/locked_compose.py" \\
            --service-images "${TEMP_DIR}/service-images.tsv" \\
            --images "${BUNDLE_DIR}/manifests/images.json" \\
            --output "${BUNDLE_DIR}/manifests/compose.locked.yaml"'''
          build.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          manifest = Path("scripts/appliance/release_manifest.py")
          text = manifest.read_text(encoding="utf-8")
          old = '''def relative_files(root: Path) -> list[Path]:
              files: list[Path] = []
              for path in sorted(root.rglob("*")):
                  relative = path.relative_to(root)
                  if path.is_symlink():
                      raise RuntimeError(f"bundle contains a symlink: {relative}")
                  if path.is_file():
                      files.append(path)
              return files
          '''
          new = '''def relative_files(root: Path) -> list[Path]:
              files: list[Path] = []
              for path in sorted(root.rglob("*")):
                  relative = path.relative_to(root)
                  if path.is_symlink():
                      raise RuntimeError(f"bundle contains a symlink: {relative}")
                  if path.is_dir():
                      continue
                  if not path.is_file():
                      raise RuntimeError(f"bundle contains a non-regular entry: {relative}")
                  files.append(path)
              return files
          '''
          if text.count(old) != 1:
              raise SystemExit("relative_files implementation changed unexpectedly")
          manifest.write_text(text.replace(old, new, 1), encoding="utf-8")

          installer = Path("deploy/appliance/edutalent-appliance")
          text = installer.read_text(encoding="utf-8")
          replacements = (
              (
                  'MODEL_DIR="${ROOT_DIR}/models/local-bge-v1"\nLOCKED_COMPOSE=',
                  'MODEL_DIR="${ROOT_DIR}/models/local-bge-v1"\nFUNCTIONS_DIR="${PRODUCTION_DIR}/runtime/supabase/volumes/functions"\nLOCKED_COMPOSE=',
              ),
              (
                  '  export EDUTALENT_APPLIANCE_MODEL_DIR="${MODEL_DIR}"\n  exec bash "${PRODUCTION_DIR}/edutalent-production"',
                  '  export EDUTALENT_APPLIANCE_MODEL_DIR="${MODEL_DIR}"\n  export EDUTALENT_APPLIANCE_FUNCTIONS_DIR="${FUNCTIONS_DIR}"\n  exec bash "${PRODUCTION_DIR}/edutalent-production"',
              ),
              (
                  '    export EDUTALENT_APPLIANCE_MODEL_DIR="${MODEL_DIR}"\n    bash "${PRODUCTION_DIR}/edutalent-production" database-check',
                  '    export EDUTALENT_APPLIANCE_MODEL_DIR="${MODEL_DIR}"\n    export EDUTALENT_APPLIANCE_FUNCTIONS_DIR="${FUNCTIONS_DIR}"\n    bash "${PRODUCTION_DIR}/edutalent-production" database-check',
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"installer source changed unexpectedly: {old!r}")
              text = text.replace(old, new, 1)
          installer.write_text(text, encoding="utf-8")

          validate = Path("scripts/appliance/validate.sh")
          text = validate.read_text(encoding="utf-8")
          replacements = (
              (
                  '  "${ROOT_DIR}/scripts/appliance/stage_production.py"\n',
                  '  "${ROOT_DIR}/scripts/appliance/stage_production.py" \\\n  "${ROOT_DIR}/scripts/appliance/locked_compose.py"\n',
              ),
              (
                  'grep -Fq \'pull_policy: never\' "${ROOT_DIR}/scripts/appliance/build.sh"\n',
                  'grep -Fq \'pull_policy: never\' "${ROOT_DIR}/scripts/appliance/locked_compose.py"\n',
              ),
              (
                  'grep -Fq \'if service == "embedding"\' "${ROOT_DIR}/scripts/appliance/build.sh"\n',
                  'grep -Fq \'locked_compose.py\' "${ROOT_DIR}/scripts/appliance/build.sh"\n',
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"validator source changed unexpectedly: {old!r}")
              text = text.replace(old, new, 1)

          marker = 'grep -Fq \'syft\' "${ROOT_DIR}/scripts/appliance/build.sh"\n'
          insertion = '''grep -Fq 'EDUTALENT_APPLIANCE_FUNCTIONS_DIR' "${ROOT_DIR}/deploy/appliance/edutalent-appliance"
          grep -Fq 'edutalent-appliance-db-data' "${ROOT_DIR}/scripts/appliance/locked_compose.py"
          grep -Fq 'edutalent-appliance-storage-data' "${ROOT_DIR}/scripts/appliance/locked_compose.py"
          grep -Fq 'edutalent-appliance-studio-snippets' "${ROOT_DIR}/scripts/appliance/locked_compose.py"
          '''
          if text.count(marker) != 1:
              raise SystemExit("validator static insertion marker changed")
          text = text.replace(marker, marker + insertion, 1)

          fixture_marker = 'cp "${ROOT_DIR}/deploy/production/edutalent-production" "${fixture}/edutalent-production"\n'
          fixture_insert = '''mkdir -p "${fixture}/locked-compose"
          cat > "${fixture}/locked-compose/services.tsv" <<'TSV'
          app\tregistry.invalid/runtime:v1
          db\tregistry.invalid/postgres:v1
          embedding\tregistry.invalid/tei:v1
          functions\tregistry.invalid/functions:v1
          imgproxy\tregistry.invalid/imgproxy:v1
          storage\tregistry.invalid/storage:v1
          studio\tregistry.invalid/studio:v1
          TSV
          python3 - "${fixture}/locked-compose/images.json" <<'PYLOCK'
          import json
          import sys
          from pathlib import Path
          sources = (
              "registry.invalid/runtime:v1", "registry.invalid/postgres:v1",
              "registry.invalid/tei:v1", "registry.invalid/functions:v1",
              "registry.invalid/imgproxy:v1", "registry.invalid/storage:v1",
              "registry.invalid/studio:v1",
          )
          rows = [
              {"source_ref": source, "local_tag": f"edutalent-offline/component-{index}:fixture"}
              for index, source in enumerate(sources)
          ]
          Path(sys.argv[1]).write_text(json.dumps({"images": rows}), encoding="utf-8")
          PYLOCK
          python3 "${ROOT_DIR}/scripts/appliance/locked_compose.py" \\
            --service-images "${fixture}/locked-compose/services.tsv" \\
            --images "${fixture}/locked-compose/images.json" \\
            --output "${fixture}/locked-compose/compose.yaml"
          for expected in \\
            'pull_policy: never' \\
            'edutalent-appliance-db-data' \\
            'edutalent-appliance-storage-data' \\
            'edutalent-appliance-studio-snippets' \\
            'EDUTALENT_APPLIANCE_FUNCTIONS_DIR' \\
            'read_only: true'; do
            grep -Fq "${expected}" "${fixture}/locked-compose/compose.yaml"
          done

          '''
          if text.count(fixture_marker) != 1:
              raise SystemExit("validator fixture marker changed")
          text = text.replace(fixture_marker, fixture_insert + fixture_marker, 1)

          final_marker = "printf 'untracked\\n' > \"${fixture}/bundle/untracked.txt\"\n"
          fifo_test = '''mkfifo "${fixture}/bundle/unsigned-pipe"
          if python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
            --bundle "${fixture}/bundle" >/dev/null 2>&1; then
            echo "unsigned FIFO was accepted" >&2
            exit 1
          fi
          rm -f "${fixture}/bundle/unsigned-pipe"

          '''
          if text.count(final_marker) != 1:
              raise SystemExit("validator FIFO marker changed")
          validate.write_text(text.replace(final_marker, fifo_test + final_marker, 1), encoding="utf-8")
          PY

      - name: Prove helper and special-entry behavior directly
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/appliance/build.sh deploy/appliance/edutalent-appliance scripts/appliance/validate.sh
          python3 -m py_compile scripts/appliance/locked_compose.py scripts/appliance/release_manifest.py
          fixture="$(mktemp -d)"
          trap 'rm -rf "${fixture}"' EXIT
          printf 'db\tregistry.invalid/postgres:v1\nstorage\tregistry.invalid/storage:v1\n' > "${fixture}/services.tsv"
          cat > "${fixture}/images.json" <<'JSON'
          {"images":[
            {"source_ref":"registry.invalid/postgres:v1","local_tag":"offline/postgres:fixture"},
            {"source_ref":"registry.invalid/storage:v1","local_tag":"offline/storage:fixture"}
          ]}
          JSON
          python3 scripts/appliance/locked_compose.py \
            --service-images "${fixture}/services.tsv" \
            --images "${fixture}/images.json" \
            --output "${fixture}/compose.yaml"
          grep -Fq 'edutalent-appliance-db-data' "${fixture}/compose.yaml"
          grep -Fq 'edutalent-appliance-storage-data' "${fixture}/compose.yaml"
          mkdir "${fixture}/entries"
          mkfifo "${fixture}/entries/pipe"
          if python3 - "${fixture}/entries" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path
          source = Path('scripts/appliance/release_manifest.py')
          spec = importlib.util.spec_from_file_location('release_manifest', source)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          try:
              module.relative_files(Path(sys.argv[1]))
          except RuntimeError:
              raise SystemExit(1)
          PY
          then
            echo 'FIFO was accepted by release inventory.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit source-only changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/appliance/build.sh \
            scripts/appliance/release_manifest.py \
            scripts/appliance/validate.sh \
            deploy/appliance/edutalent-appliance
          git commit -m 'fix(appliance): externalize mutable state and reject special entries'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
