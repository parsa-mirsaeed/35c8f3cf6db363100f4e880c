name: PR-01 one-shot regression assertion fix

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/agent-pr01-test-fix.yml

permissions:
  contents: write

concurrency:
  group: agent-pr01-test-fix
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/pr-01-assignment-authorization'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Tighten legacy-repository assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/api/src/server_functions/assignment_functions.rs")
          source = path.read_text()
          replacements = {
              '"AssignmentRepository::new"': '"let assignment_repo = AssignmentRepository::new"',
              '"CustomAssignmentRepository::new"': '"let custom_repo = CustomAssignmentRepository::new"',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"expected {old} exactly once")
              source = source.replace(old, new)
          path.write_text(source)
          PY
          rustfmt --edition 2021 --config skip_children=true \
            packages/api/src/server_functions/assignment_functions.rs
          git rm .github/workflows/agent-pr01-test-fix.yml
          git diff --check

      - name: Commit exact test correction
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/api/src/server_functions/assignment_functions.rs
          git commit -m 'test: match legacy assignment repository calls exactly'
          git push origin HEAD:${HEAD_BRANCH}

# Deterministic individual-token replacement.
