name: Mirror Final Proof

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: write

concurrency:
  group: mirror-final-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolate-final-review-fixes:
    name: Isolate final review source changes
    if: contains(github.event.pull_request.labels.*.name, 'full-validation')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore pre-format tree
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=3c4e4a1ae77da95f9ca9c71d400c349c92f0c6e5 --staged --worktree .
          git restore --source=HEAD --staged --worktree .github/workflows
          git status --short | sed -n '1,30p'

      - name: Reapply reviewed source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_final_review_fixes.py
          git status --short | sed -n '1,30p'

      - name: Format touched Rust files
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          rustfmt --edition 2021 \
            packages/api/src/ai_gateway_runtime.rs \
            packages/api/src/services/embedding_profile.rs \
            packages/api/src/services/knowledge_vector_store_service.rs \
            packages/api/src/services/vector_store_service.rs

      - name: Validate corrected tree
        shell: bash
        run: |
          set -euo pipefail
          bash -n edutalent
          python3 -m py_compile deploy/production/validate-rendered-compose.py
          git diff --check
          ! git grep -n 'edutalent_local_bge_v1' -- \
            ':(exclude).github/workflows' \
            ':(exclude)scripts/apply_final_review_fixes.py'
          grep -Fq '.chunk()' packages/api/src/ai_gateway_runtime.rs
          grep -Fq 'chunked_provider_body_stops_at_the_configured_limit' packages/api/src/ai_gateway_runtime.rs

      - name: Stage isolated correction
        shell: bash
        run: |
          set -euo pipefail
          find deploy/production -type d -name __pycache__ -prune -exec rm -rf {} +
          git add -A
          git status --short | sed -n '1,100p'

      - name: Create isolated correction commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(ai): isolate final review changes'

      - name: Push isolated correction
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:"$HEAD_REF"
