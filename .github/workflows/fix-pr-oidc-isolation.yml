name: Fix PR OIDC isolation

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/fix-pr-oidc-isolation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Apply credential-boundary transformation
        run: python3 scripts/ci/apply_oidc_fix.py

      - name: Run focused security regressions
        run: |
          set -euo pipefail
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Stage transformed files outside workflow paths
        run: |
          set -euo pipefail
          mkdir -p scripts/ci/oidc-fix-staging
          cp .github/workflows/air-gapped-appliance.yml scripts/ci/oidc-fix-staging/air-gapped-appliance.yml
          cp .github/workflows/mirror-final-proof.yml scripts/ci/oidc-fix-staging/mirror-final-proof.yml
          cp scripts/appliance/validate.sh scripts/ci/oidc-fix-staging/validate.sh

      - name: Push only non-workflow staging blobs
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/ci/oidc-fix-staging
          git commit -m 'ci: stage tested OIDC isolation blobs'
          echo "STAGING_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feature/air-gapped-packaging-ghcr
