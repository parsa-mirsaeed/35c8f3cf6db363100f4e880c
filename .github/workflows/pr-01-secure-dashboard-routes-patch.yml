name: PR-01 Secure Dashboard Routes Patch Retry

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: write

jobs:
  restore-narrow-patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/pr-01-assignment-authorization'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore patch with narrow formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          path=.github/workflows/pr-01-secure-dashboard-routes-patch.yml
          git show "${EXPECTED_HEAD}^:${path}" > "${path}"
          python3 <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/pr-01-secure-dashboard-routes-patch.yml")
          source = path.read_text(encoding="utf-8")
          old = """          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
"""
          new = """          rustfmt --edition 2021 \\
            packages/api/src/server_functions/dashboard_functions.rs \\
            packages/api/src/repositories/authorized_assignment_repository_tests.rs
          git diff --check
"""
          if source.count(old) != 1:
              raise SystemExit(f"expected one formatting block, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          grep -Fq 'rustfmt --edition 2021' "${path}"
          ! grep -Fq 'cargo fmt --all' "${path}"
          git diff --check

      - name: Commit retry workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr-01-secure-dashboard-routes-patch.yml
          git commit -m "ci: retry dashboard route patch narrowly"
          test "$(git rev-parse HEAD^)" = "${EXPECTED_HEAD}"
          git push origin "HEAD:${HEAD_BRANCH}"
