name: Mirror Final Proof

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: write
  actions: write

concurrency:
  group: mirror-final-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch-and-verify:
    name: Dispatch and verify complete public-runner proof
    if: contains(github.event.pull_request.labels.*.name, 'full-validation')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Isolate and apply unresolved final-review fixes
        id: final_fix
        shell: bash
        run: |
          set -euo pipefail

          # The preceding bot commit used workspace-wide formatting. Restore its
          # parent, then reapply only the reviewed source changes.
          git checkout 3c4e4a1ae77da95f9ca9c71d400c349c92f0c6e5 -- .
          python3 scripts/apply_final_review_fixes.py
          rustup component add rustfmt
          rustfmt --edition 2021 \
            packages/api/src/ai_gateway_runtime.rs \
            packages/api/src/services/embedding_profile.rs \
            packages/api/src/services/knowledge_vector_store_service.rs \
            packages/api/src/services/vector_store_service.rs
          bash -n edutalent
          python3 -m py_compile deploy/production/validate-rendered-compose.py
          git diff --check
          ! git grep -n 'edutalent_local_bge_v1' -- \
            ':(exclude).github/workflows' \
            ':(exclude)scripts/apply_final_review_fixes.py'
          grep -Fq '.chunk()' packages/api/src/ai_gateway_runtime.rs
          grep -Fq 'chunked_provider_body_stops_at_the_configured_limit' packages/api/src/ai_gateway_runtime.rs

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- . ':(exclude).github/workflows'
          git commit -m 'fix(ai): isolate final review changes'
          git push origin HEAD:"$HEAD_REF"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Dispatch exact-head Package and Production Foundation
        if: steps.final_fix.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run package.yml --repo "$REPOSITORY" --ref "$HEAD_REF"
          gh workflow run production-foundation.yml --repo "$REPOSITORY" --ref "$HEAD_REF"

      - name: Resolve dispatched run IDs
        if: steps.final_fix.outputs.changed != 'true'
        id: runs
        shell: bash
        run: |
          set -euo pipefail

          find_run() {
            local workflow="$1" attempt run_id
            for attempt in $(seq 1 60); do
              run_id="$(gh run list \
                --repo "$REPOSITORY" \
                --workflow "$workflow" \
                --branch "$HEAD_REF" \
                --event workflow_dispatch \
                --limit 30 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" \
                | head -n 1)"
              if [[ -n "$run_id" ]]; then
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 5
            done
            echo "Unable to resolve workflow_dispatch run for $workflow at $HEAD_SHA" >&2
            return 1
          }

          package_run_id="$(find_run 'Package')"
          production_run_id="$(find_run 'Production Foundation')"
          echo "package_run_id=$package_run_id" >> "$GITHUB_OUTPUT"
          echo "production_run_id=$production_run_id" >> "$GITHUB_OUTPUT"
          echo "Package run: $package_run_id"
          echo "Production Foundation run: $production_run_id"

      - name: Wait for complete workflows
        if: steps.final_fix.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh run watch '${{ steps.runs.outputs.package_run_id }}' \
            --repo "$REPOSITORY" --exit-status
          gh run watch '${{ steps.runs.outputs.production_run_id }}' \
            --repo "$REPOSITORY" --exit-status

      - name: Enforce exact head and required jobs
        if: steps.final_fix.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail

          gh run view '${{ steps.runs.outputs.package_run_id }}' \
            --repo "$REPOSITORY" \
            --json headSha,event,status,conclusion,jobs,url > package-run.json
          gh run view '${{ steps.runs.outputs.production_run_id }}' \
            --repo "$REPOSITORY" \
            --json headSha,event,status,conclusion,jobs,url > production-run.json

          python3 - "$HEAD_SHA" package-run.json production-run.json <<'PY'
          import json
          import sys

          expected_sha, package_path, production_path = sys.argv[1:]
          package = json.load(open(package_path, encoding="utf-8"))
          production = json.load(open(production_path, encoding="utf-8"))

          def require_run(run, name):
              assert run["headSha"] == expected_sha, (name, run["headSha"], expected_sha)
              assert run["event"] == "workflow_dispatch", (name, run["event"])
              assert run["status"] == "completed", (name, run["status"])
              assert run["conclusion"] == "success", (name, run["conclusion"])

          require_run(package, "Package")
          require_run(production, "Production Foundation")

          package_jobs = {job["name"]: job["conclusion"] for job in package["jobs"]}
          for job_name in (
              "Validate package definitions",
              "Docker image and release bundle",
          ):
              assert package_jobs.get(job_name) == "success", (job_name, package_jobs.get(job_name))

          production_jobs = {job["name"]: job["conclusion"] for job in production["jobs"]}
          for job_name in (
              "Render and verify production topology",
              "Apply migrations and roles on pinned Supabase PostgreSQL 17",
              "Start complete production stack",
          ):
              assert production_jobs.get(job_name) == "success", (
                  job_name,
                  production_jobs.get(job_name),
              )

          print("Complete exact-head Package and Production Foundation proof verified.")
          PY

      - name: Upload dispatched-run evidence
        if: steps.final_fix.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mirror-final-proof
          path: |
            package-run.json
            production-run.json
          if-no-files-found: error
          retention-days: 14
