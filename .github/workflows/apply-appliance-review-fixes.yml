name: Apply appliance review fixes

on:
  push:
    branches:
      - feature/air-gapped-packaging-ghcr
    paths:
      - .github/workflows/apply-appliance-review-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0

      - name: Apply fail-closed appliance review corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          stage = Path("scripts/appliance/stage_production.py")
          stage.write_text(
              '''#!/usr/bin/env python3
          """Stage production definitions without copying live installation state."""

          from __future__ import annotations

          import argparse
          import shutil
          from pathlib import Path


          def reject_symlinks(source: Path) -> None:
              for path in source.rglob("*"):
                  if path.is_symlink():
                      raise RuntimeError(f"production source contains a symlink: {path.relative_to(source)}")


          def stage_production(source: Path, destination: Path) -> None:
              source = source.resolve()
              destination = destination.resolve()
              if not source.is_dir():
                  raise RuntimeError("production source does not exist")
              if destination.exists():
                  raise RuntimeError("production staging destination already exists")
              reject_symlinks(source)

              def ignore(directory: str, names: list[str]) -> set[str]:
                  relative = Path(directory).resolve().relative_to(source)
                  ignored: set[str] = set()
                  if relative == Path(".") and ".env.edutalent" in names:
                      ignored.add(".env.edutalent")
                  if relative == Path("runtime") and "supabase" in names:
                      ignored.add("supabase")
                  return ignored

              shutil.copytree(source, destination, ignore=ignore, copy_function=shutil.copy2)


          def parse_args() -> argparse.Namespace:
              parser = argparse.ArgumentParser()
              parser.add_argument("--source", required=True, type=Path)
              parser.add_argument("--destination", required=True, type=Path)
              return parser.parse_args()


          def main() -> int:
              args = parse_args()
              stage_production(args.source, args.destination)
              return 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except (OSError, RuntimeError, ValueError) as error:
                  print(f"production staging error: {error}", file=__import__("sys").stderr)
                  raise SystemExit(1)
          ''',
              encoding="utf-8",
          )
          stage.chmod(0o755)

          replace_once(
              "scripts/appliance/build.sh",
              '''PRODUCTION_DIR="${ROOT_DIR}/deploy/production"
          SUPABASE_DIR="${PRODUCTION_DIR}/runtime/supabase"
          APP_ENV="${PRODUCTION_DIR}/.env.edutalent"
          SUPABASE_ENV="${SUPABASE_DIR}/.env"
          TLS_DIR="$(mktemp -d)"
          TEMP_DIR="$(mktemp -d)"
          ''',
              '''SOURCE_PRODUCTION_DIR="${ROOT_DIR}/deploy/production"
          TLS_DIR="$(mktemp -d)"
          TEMP_DIR="$(mktemp -d)"
          PRODUCTION_DIR="${TEMP_DIR}/production"
          SUPABASE_DIR="${PRODUCTION_DIR}/runtime/supabase"
          APP_ENV="${PRODUCTION_DIR}/.env.edutalent"
          SUPABASE_ENV="${SUPABASE_DIR}/.env"
          ''',
          )
          replace_once(
              "scripts/appliance/build.sh",
              '''cleanup() {
            rm -rf "${TLS_DIR}" "${TEMP_DIR}"
            rm -f "${APP_ENV}" "${SUPABASE_ENV}" "${SUPABASE_DIR}/docker-compose.yml.edutalent-backup"
          }
          ''',
              '''cleanup() {
            rm -rf "${TLS_DIR}" "${TEMP_DIR}"
          }
          ''',
          )
          replace_once(
              "scripts/appliance/build.sh",
              '''bash "${ROOT_DIR}/edutalent" production-bootstrap
          cp "${PRODUCTION_DIR}/.env.edutalent.example" "${APP_ENV}"
          ''',
              '''python3 "${ROOT_DIR}/scripts/appliance/stage_production.py" \
            --source "${SOURCE_PRODUCTION_DIR}" \
            --destination "${PRODUCTION_DIR}"
          bash "${PRODUCTION_DIR}/edutalent-production" bootstrap
          cp "${PRODUCTION_DIR}/.env.edutalent.example" "${APP_ENV}"
          ''',
          )
          replace_once(
              "scripts/appliance/build.sh",
              '''bash "${ROOT_DIR}/edutalent" production-init
          ''',
              '''bash "${PRODUCTION_DIR}/edutalent-production" init
          ''',
          )
          replace_once(
              "scripts/appliance/build.sh",
              '''  --platform "${PLATFORM}" \
            --images "${BUNDLE_DIR}/manifests/images.json" \
            --model-lock "${MODEL_LOCK}"
          ''',
              '''  --platform "${PLATFORM}" \
            --signing-mode "${SIGNING_MODE}" \
            --images "${BUNDLE_DIR}/manifests/images.json" \
            --model-lock "${MODEL_LOCK}"
          ''',
          )

          replace_once(
              "scripts/appliance/release_manifest.py",
              '''TEXT_LIMIT = 4 * 1024 * 1024
          ''',
              '''TEXT_LIMIT = 4 * 1024 * 1024
          MUTABLE_INSTALLATION_FILES = frozenset(
              {
                  "deploy/production/.env.edutalent",
                  "deploy/production/runtime/supabase/.env",
              }
          )
          ''',
          )
          replace_once(
              "scripts/appliance/release_manifest.py",
              '''def is_manifest_input(relative: Path) -> bool:
              value = relative.as_posix()
              return value not in {
                  "SHA256SUMS",
                  "manifests/release-manifest.json",
              } and not value.startswith("signatures/")
          ''',
              '''def is_manifest_input(relative: Path) -> bool:
              value = relative.as_posix()
              return value not in {
                  "SHA256SUMS",
                  "manifests/release-manifest.json",
              } and not value.startswith("signatures/")


          def is_mutable_installation_file(relative: Path) -> bool:
              return relative.as_posix() in MUTABLE_INSTALLATION_FILES
          ''',
          )
          replace_once(
              "scripts/appliance/release_manifest.py",
              '''            "platform": args.platform,
                      "created_by": "scripts/appliance/build.sh",
          ''',
              '''            "platform": args.platform,
                      "signing_mode": args.signing_mode,
                      "created_by": "scripts/appliance/build.sh",
          ''',
          )
          replace_once(
              "scripts/appliance/release_manifest.py",
              '''    if release.get("platform") not in {"linux/amd64", "linux/arm64"}:
                  raise RuntimeError("release manifest platform is invalid")
          ''',
              '''    if release.get("platform") not in {"linux/amd64", "linux/arm64"}:
                  raise RuntimeError("release manifest platform is invalid")
              if release.get("signing_mode") not in {"ephemeral", "keyless"}:
                  raise RuntimeError("release manifest signing mode is invalid")
          ''',
          )
          replace_once(
              "scripts/appliance/release_manifest.py",
              '''        if is_manifest_input(path.relative_to(root))
          ''',
              '''        if is_manifest_input(path.relative_to(root))
                  and not is_mutable_installation_file(path.relative_to(root))
          ''',
          )
          replace_once(
              "scripts/appliance/release_manifest.py",
              '''        if sha256_file(path) != row["sha256"] or path.stat().st_size != row["size"]:
                      raise RuntimeError(f"release file integrity failure: {relative}")
          ''',
              '''        actual_mode = format(stat.S_IMODE(path.stat().st_mode), "04o")
                  if (
                      sha256_file(path) != row["sha256"]
                      or path.stat().st_size != row["size"]
                      or actual_mode != row.get("mode")
                  ):
                      raise RuntimeError(f"release file integrity failure: {relative}")
          ''',
          )
          replace_once(
              "scripts/appliance/release_manifest.py",
              '''    generate_parser.add_argument("--platform", required=True)
              generate_parser.add_argument("--images", required=True, type=Path)
          ''',
              '''    generate_parser.add_argument("--platform", required=True)
              generate_parser.add_argument(
                  "--signing-mode", required=True, choices=("ephemeral", "keyless")
              )
              generate_parser.add_argument("--images", required=True, type=Path)
          ''',
          )

          replace_once(
              "deploy/appliance/edutalent-appliance",
              '''verify_signatures() {
            local public_key="${ROOT_DIR}/signatures/verification.pub"
            local manifest_signature="${ROOT_DIR}/signatures/release-manifest.sig"
            local checksums_signature="${ROOT_DIR}/signatures/SHA256SUMS.sig"
            local manifest_bundle="${ROOT_DIR}/signatures/release-manifest.sigstore.json"
            local checksums_bundle="${ROOT_DIR}/signatures/SHA256SUMS.sigstore.json"
            local policy="${ROOT_DIR}/signatures/policy.json"

            require_command cosign
            if [[ -f "${public_key}" && -f "${manifest_signature}" && -f "${checksums_signature}" ]]; then
              cosign verify-blob \
                --key "${public_key}" \
                --signature "${manifest_signature}" \
                "${MANIFEST}" >/dev/null
              cosign verify-blob \
                --key "${public_key}" \
                --signature "${checksums_signature}" \
                "${CHECKSUMS}" >/dev/null
              echo "Verified release manifest and checksum set with the packaged public key."
              return 0
            fi

            if [[ -f "${manifest_bundle}" && -f "${checksums_bundle}" && -f "${policy}" ]]; then
              local issuer identity
              issuer="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["certificate_oidc_issuer"])' "${policy}")"
              identity="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["certificate_identity_regexp"])' "${policy}")"
              cosign verify-blob \
                --bundle "${manifest_bundle}" \
                --certificate-oidc-issuer "${issuer}" \
                --certificate-identity-regexp "${identity}" \
                "${MANIFEST}" >/dev/null
              cosign verify-blob \
                --bundle "${checksums_bundle}" \
                --certificate-oidc-issuer "${issuer}" \
                --certificate-identity-regexp "${identity}" \
                "${CHECKSUMS}" >/dev/null
              echo "Verified keyless release manifest and checksum-set signatures."
              return 0
            fi

            echo "Complete release signature material is missing." >&2
            return 1
          }
          ''',
              '''verify_signatures() {
            local public_key="${ROOT_DIR}/signatures/verification.pub"
            local manifest_signature="${ROOT_DIR}/signatures/release-manifest.sig"
            local checksums_signature="${ROOT_DIR}/signatures/SHA256SUMS.sig"
            local manifest_bundle="${ROOT_DIR}/signatures/release-manifest.sigstore.json"
            local checksums_bundle="${ROOT_DIR}/signatures/SHA256SUMS.sigstore.json"
            local signing_mode
            signing_mode="$(manifest_value release.signing_mode)"

            require_command cosign
            case "${signing_mode}" in
              ephemeral)
                [[ -f "${public_key}" && -f "${manifest_signature}" && -f "${checksums_signature}" ]] || {
                  echo "Complete ephemeral release signature material is missing." >&2
                  return 1
                }
                cosign verify-blob \
                  --key "${public_key}" \
                  --signature "${manifest_signature}" \
                  "${MANIFEST}" >/dev/null
                cosign verify-blob \
                  --key "${public_key}" \
                  --signature "${checksums_signature}" \
                  "${CHECKSUMS}" >/dev/null
                echo "Verified ephemeral validation signatures with the packaged public key."
                ;;
              keyless)
                [[ -f "${manifest_bundle}" && -f "${checksums_bundle}" ]] || {
                  echo "Complete keyless release signature material is missing." >&2
                  return 1
                }
                local issuer="${EDUTALENT_APPLIANCE_TRUSTED_OIDC_ISSUER:-}"
                local identity="${EDUTALENT_APPLIANCE_TRUSTED_IDENTITY_REGEXP:-}"
                [[ -n "${issuer}" && -n "${identity}" ]] || {
                  echo "Keyless verification requires independently supplied EDUTALENT_APPLIANCE_TRUSTED_OIDC_ISSUER and EDUTALENT_APPLIANCE_TRUSTED_IDENTITY_REGEXP." >&2
                  return 1
                }
                cosign verify-blob \
                  --bundle "${manifest_bundle}" \
                  --certificate-oidc-issuer "${issuer}" \
                  --certificate-identity-regexp "${identity}" \
                  "${MANIFEST}" >/dev/null
                cosign verify-blob \
                  --bundle "${checksums_bundle}" \
                  --certificate-oidc-issuer "${issuer}" \
                  --certificate-identity-regexp "${identity}" \
                  "${CHECKSUMS}" >/dev/null
                echo "Verified keyless release signatures against the independently supplied trust policy."
                ;;
              *)
                echo "Unsupported signed release mode: ${signing_mode}" >&2
                return 1
                ;;
            esac
          }
          ''',
          )

          replace_once(
              "scripts/appliance/sign_release.sh",
              '''    cat > "${signatures}/policy.json" <<'JSON'
          {
            "certificate_oidc_issuer": "https://token.actions.githubusercontent.com",
            "certificate_identity_regexp": "^https://github.com/parsa-mirsaeed/35c8f3cf6db363100f4e880c/.github/workflows/air-gapped-appliance.yml@refs/(heads/main|tags/v.*)$"
          }
          JSON
          ''',
              '''    # The accepted OIDC issuer and workflow identity are deliberately not
              # packaged. Verifiers must obtain that trust policy independently.
          ''',
          )

          replace_once(
              "edutalent",
              '''            scripts/appliance/patch_production_command.py \
                      scripts/appliance/release_manifest.py
          ''',
              '''            scripts/appliance/patch_production_command.py \
                      scripts/appliance/release_manifest.py \
                      scripts/appliance/stage_production.py
          ''',
          )

          replace_once(
              ".github/workflows/air-gapped-appliance.yml",
              '''    outputs:
                version: ${{ steps.version.outputs.version }}
                bundle_dir: ${{ steps.version.outputs.bundle_dir }}
              steps:
          ''',
              '''    outputs:
                version: ${{ steps.version.outputs.version }}
                bundle_dir: ${{ steps.version.outputs.bundle_dir }}
              env:
                EDUTALENT_APPLIANCE_TRUSTED_OIDC_ISSUER: https://token.actions.githubusercontent.com
                EDUTALENT_APPLIANCE_TRUSTED_IDENTITY_REGEXP: ^https://github.com/${{ github.repository }}/.github/workflows/air-gapped-appliance.yml@refs/(heads/main|tags/v.*)$
              steps:
          ''',
          )

          replace_once(
              "deploy/appliance/README.md",
              '''Tagged protected releases use keyless Sigstore signing and publish custom
          multi-architecture images to GHCR. Pull-request validation uses an ephemeral key
          only to prove the sign/verify mechanism; that key is not a production trust root.
          ''',
              '''Tagged protected releases use keyless Sigstore signing and publish custom
          multi-architecture images to GHCR. Pull-request validation uses an ephemeral key
          only to prove the sign/verify mechanism; that key is not a production trust root.
          The signed manifest binds the accepted signing mode so a keyless release cannot be
          downgraded by adding an attacker-controlled public key.

          Keyless verification never accepts issuer or workflow identity from the bundle.
          Obtain the approved values independently from the authoritative release policy and
          export them before verifying a tagged release:

          ```bash
          export EDUTALENT_APPLIANCE_TRUSTED_OIDC_ISSUER=https://token.actions.githubusercontent.com
          export EDUTALENT_APPLIANCE_TRUSTED_IDENTITY_REGEXP='^https://github.com/<owner>/<repository>/.github/workflows/air-gapped-appliance.yml@refs/tags/v.*$'
          ./edutalent-appliance verify
          ```

          Treat the verifier command and expected policy as trust bootstrap material: obtain
          them through an independently authenticated channel rather than learning either
          value from the appliance being checked.
          ''',
          )
          replace_once(
              "deploy/appliance/README.md",
              '''The first `init` creates `deploy/production/.env.edutalent`. Set the three domains,
          restricted administrative CIDRs, and absolute operator-supplied TLS certificate
          and key paths. Run `init` again to generate fresh installation-specific secrets
          inside the packaged, network-disabled tools container.
          ''',
              '''The first `init` creates `deploy/production/.env.edutalent`. Set the three domains,
          restricted administrative CIDRs, and absolute operator-supplied TLS certificate
          and key paths. Run `init` again to generate fresh installation-specific secrets
          inside the packaged, network-disabled tools container. Integrity verification
          permits only that file and `deploy/production/runtime/supabase/.env` as mutable
          installation state; every other appliance file remains exactly manifest-bound.
          ''',
          )

          Path(".github/workflows/apply-appliance-review-fixes.yml").unlink()
          PY

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/appliance/validate.sh")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '  "${ROOT_DIR}/scripts/appliance/release_manifest.py"\n',
              '  "${ROOT_DIR}/scripts/appliance/release_manifest.py" \\\n  "${ROOT_DIR}/scripts/appliance/stage_production.py"\n',
              1,
          )
          old = '''grep -Fq 'Verify final PR gates then dispatch appliance proof' "${mirror_workflow}"
          grep -Fq "github.event.pull_request.draft == false" "${mirror_workflow}"
          grep -Fq -- "--event pull_request" "${mirror_workflow}"
          grep -Fq "gh workflow run package.yml" "${mirror_workflow}"
          grep -Fq "gh workflow run production-foundation.yml" "${mirror_workflow}"
          grep -Fq "gh workflow run air-gapped-appliance.yml" "${mirror_workflow}"
          package_line="$(grep -n "gh workflow run package.yml" "${mirror_workflow}" | cut -d: -f1)"
          production_line="$(grep -n "gh workflow run production-foundation.yml" "${mirror_workflow}" | cut -d: -f1)"
          appliance_line="$(grep -n "gh workflow run air-gapped-appliance.yml" "${mirror_workflow}" | cut -d: -f1)"
          test "${package_line}" -lt "${production_line}"
          test "${production_line}" -lt "${appliance_line}"
          '''
          new = '''grep -Fq 'Verify and serialize complete exact-head proof' "${mirror_workflow}"
          grep -Fq "github.event.pull_request.draft == false" "${mirror_workflow}"
          grep -Fq -- "--event pull_request" "${mirror_workflow}"
          grep -Fq "gh workflow run package.yml" "${mirror_workflow}"
          grep -Fq "gh workflow run air-gapped-appliance.yml" "${mirror_workflow}"
          package_line="$(grep -n "gh workflow run package.yml" "${mirror_workflow}" | cut -d: -f1)"
          appliance_line="$(grep -n "gh workflow run air-gapped-appliance.yml" "${mirror_workflow}" | cut -d: -f1)"
          test "${package_line}" -lt "${appliance_line}"
          '''
          if text.count(old) != 1:
              raise SystemExit("validate.sh mirror assertion block changed unexpectedly")
          text = text.replace(old, new)
          marker = '''fixture="$(mktemp -d)"
          trap 'rm -rf "${fixture}"' EXIT
          '''
          stage_test = '''fixture="$(mktemp -d)"
          trap 'rm -rf "${fixture}"' EXIT

          mkdir -p "${fixture}/production-source/runtime/supabase"
          printf 'definition\n' > "${fixture}/production-source/compose.production.yaml"
          printf 'operator-secret\n' > "${fixture}/production-source/.env.edutalent"
          printf 'supabase-secret\n' > "${fixture}/production-source/runtime/supabase/.env"
          python3 "${ROOT_DIR}/scripts/appliance/stage_production.py" \\
            --source "${fixture}/production-source" \\
            --destination "${fixture}/production-stage"
          cmp "${fixture}/production-source/compose.production.yaml" \\
            "${fixture}/production-stage/compose.production.yaml"
          grep -Fxq 'operator-secret' "${fixture}/production-source/.env.edutalent"
          grep -Fxq 'supabase-secret' "${fixture}/production-source/runtime/supabase/.env"
          test ! -e "${fixture}/production-stage/.env.edutalent"
          test ! -e "${fixture}/production-stage/runtime/supabase"
          '''
          if text.count(marker) != 1:
              raise SystemExit("validate.sh fixture marker changed unexpectedly")
          text = text.replace(marker, stage_test)
          text = text.replace(
              '''  "${fixture}/bundle/sbom/images" \\
  "${fixture}/bundle/scripts/appliance"
          ''',
              '''  "${fixture}/bundle/sbom/images" \\
  "${fixture}/bundle/scripts/appliance" \\
  "${fixture}/bundle/signatures"
          ''',
              1,
          )
          text = text.replace(
              '''cp "${ROOT_DIR}/scripts/appliance/release_manifest.py" \\
  "${fixture}/bundle/scripts/appliance/release_manifest.py"
          ''',
              '''cp "${ROOT_DIR}/scripts/appliance/release_manifest.py" \\
  "${fixture}/bundle/scripts/appliance/release_manifest.py"
          cp "${ROOT_DIR}/deploy/appliance/edutalent-appliance" \\
  "${fixture}/bundle/edutalent-appliance"
          chmod 0755 "${fixture}/bundle/edutalent-appliance"
          ''',
              1,
          )
          text = text.replace(
              '''  --platform linux/amd64 \\
  --images "${fixture}/bundle/manifests/images.json" \\
          ''',
              '''  --platform linux/amd64 \\
  --signing-mode keyless \\
  --images "${fixture}/bundle/manifests/images.json" \\
          ''',
              1,
          )
          old_tail = '''python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
  --bundle "${fixture}/bundle"
          printf 'untracked\n' > "${fixture}/bundle/untracked.txt"
          if python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
  --bundle "${fixture}/bundle" >/dev/null 2>&1; then
            echo "untracked appliance payload was accepted" >&2
            exit 1
          fi
          rm -f "${fixture}/bundle/untracked.txt"
          printf 'tampered\n' >> "${fixture}/bundle/images/fixture.tar.gz"
          if python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
  --bundle "${fixture}/bundle" >/dev/null 2>&1; then
            echo "tampered appliance fixture was accepted" >&2
            exit 1
          fi
          '''
          new_tail = '''python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
  --bundle "${fixture}/bundle"

          touch \\
  "${fixture}/bundle/signatures/release-manifest.sigstore.json" \\
  "${fixture}/bundle/signatures/SHA256SUMS.sigstore.json"
          cat > "${fixture}/bundle/signatures/policy.json" <<'JSON'
          {"certificate_oidc_issuer":"https://attacker.invalid","certificate_identity_regexp":".*"}
          JSON
          mkdir -p "${fixture}/fake-bin"
          cat > "${fixture}/fake-bin/cosign" <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >> "${COSIGN_LOG:?}"
          SH
          chmod 0755 "${fixture}/fake-bin/cosign"
          if PATH="${fixture}/fake-bin:${PATH}" COSIGN_LOG="${fixture}/cosign.log" \\
            bash "${fixture}/bundle/edutalent-appliance" verify >/dev/null 2>&1; then
            echo "keyless appliance accepted a bundle-controlled trust policy" >&2
            exit 1
          fi
          PATH="${fixture}/fake-bin:${PATH}" \\
            COSIGN_LOG="${fixture}/cosign.log" \\
            EDUTALENT_APPLIANCE_TRUSTED_OIDC_ISSUER="https://issuer.example" \\
            EDUTALENT_APPLIANCE_TRUSTED_IDENTITY_REGEXP='^https://identity.example/workflow$' \\
            bash "${fixture}/bundle/edutalent-appliance" verify >/dev/null
          grep -Fq -- '--certificate-oidc-issuer https://issuer.example' "${fixture}/cosign.log"
          grep -Fq -- '--certificate-identity-regexp ^https://identity.example/workflow$' "${fixture}/cosign.log"
          if grep -Fq 'attacker.invalid' "${fixture}/cosign.log"; then
            echo "bundle-controlled trust policy reached cosign" >&2
            exit 1
          fi

          mkdir -p "${fixture}/bundle/deploy/production/runtime/supabase"
          printf 'operator config\n' > "${fixture}/bundle/deploy/production/.env.edutalent"
          printf 'generated secrets\n' > "${fixture}/bundle/deploy/production/runtime/supabase/.env"
          chmod 0600 \\
            "${fixture}/bundle/deploy/production/.env.edutalent" \\
            "${fixture}/bundle/deploy/production/runtime/supabase/.env"
          python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
            --bundle "${fixture}/bundle"

          printf 'untracked\n' > "${fixture}/bundle/untracked.txt"
          if python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
  --bundle "${fixture}/bundle" >/dev/null 2>&1; then
            echo "untracked appliance payload was accepted" >&2
            exit 1
          fi
          rm -f "${fixture}/bundle/untracked.txt"

          chmod 0644 "${fixture}/bundle/edutalent-appliance"
          if python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
  --bundle "${fixture}/bundle" >/dev/null 2>&1; then
            echo "appliance mode tampering was accepted" >&2
            exit 1
          fi
          chmod 0755 "${fixture}/bundle/edutalent-appliance"

          printf 'tampered\n' >> "${fixture}/bundle/images/fixture.tar.gz"
          if python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify \\
  --bundle "${fixture}/bundle" >/dev/null 2>&1; then
            echo "tampered appliance fixture was accepted" >&2
            exit 1
          fi
          '''
          if text.count(old_tail) != 1:
              raise SystemExit("validate.sh tail changed unexpectedly")
          path.write_text(text.replace(old_tail, new_tail), encoding="utf-8")
          PY

          bash -n scripts/appliance/build.sh
          bash -n scripts/appliance/sign_release.sh
          bash -n deploy/appliance/edutalent-appliance
          python3 -m py_compile \
            scripts/appliance/release_manifest.py \
            scripts/appliance/stage_production.py
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit scoped review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/air-gapped-appliance.yml \
            .github/workflows/apply-appliance-review-fixes.yml \
            deploy/appliance/README.md \
            deploy/appliance/edutalent-appliance \
            edutalent \
            scripts/appliance/build.sh \
            scripts/appliance/release_manifest.py \
            scripts/appliance/sign_release.sh \
            scripts/appliance/stage_production.py \
            scripts/appliance/validate.sh
          git commit -m 'fix(appliance): harden trust and installation integrity'
          git push origin HEAD:feature/air-gapped-packaging-ghcr
