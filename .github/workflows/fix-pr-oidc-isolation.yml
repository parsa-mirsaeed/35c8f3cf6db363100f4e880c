name: Fix PR OIDC isolation

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/fix-pr-oidc-isolation.yml

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Apply credential-boundary transformation
        run: python3 scripts/ci/apply_oidc_fix.py

      - name: Run focused security regressions
        run: |
          set -euo pipefail
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Stage transformed source files
        run: |
          mkdir -p transformed/.github/workflows transformed/scripts/appliance
          cp .github/workflows/air-gapped-appliance.yml transformed/.github/workflows/
          cp .github/workflows/mirror-final-proof.yml transformed/.github/workflows/
          cp scripts/appliance/validate.sh transformed/scripts/appliance/

      - uses: actions/upload-artifact@v6
        with:
          name: oidc-isolation-transformed-files
          path: transformed/**
          if-no-files-found: error
          retention-days: 1
