name: Align final-proof regression

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/align-final-proof-regression.yml

permissions:
  contents: write

jobs:
  patch:
    name: Require Production then Package then Air
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Align exact workflow-order assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/appliance/validate.sh')
          text = path.read_text(encoding='utf-8')
          old = '''grep -Fq "gh workflow run package.yml" "${mirror_workflow}"
          grep -Fq "gh workflow run air-gapped-appliance.yml" "${mirror_workflow}"
          if grep -Fq "gh workflow run production-foundation.yml" "${mirror_workflow}"; then
            echo "Production Foundation must be an exact-head prerequisite, not a duplicate dispatch." >&2
            exit 1
          fi
          package_line="$(grep -n "gh workflow run package.yml" "${mirror_workflow}" | cut -d: -f1)"
          appliance_line="$(grep -n "gh workflow run air-gapped-appliance.yml" "${mirror_workflow}" | cut -d: -f1)"
          test "${package_line}" -lt "${appliance_line}"
          '''
          new = '''grep -Fq "gh workflow run production-foundation.yml" "${mirror_workflow}"
          grep -Fq "gh workflow run package.yml" "${mirror_workflow}"
          grep -Fq "gh workflow run air-gapped-appliance.yml" "${mirror_workflow}"
          production_line="$(grep -n "gh workflow run production-foundation.yml" "${mirror_workflow}" | cut -d: -f1)"
          package_line="$(grep -n "gh workflow run package.yml" "${mirror_workflow}" | cut -d: -f1)"
          appliance_line="$(grep -n "gh workflow run air-gapped-appliance.yml" "${mirror_workflow}" | cut -d: -f1)"
          test "${production_line}" -lt "${package_line}"
          test "${package_line}" -lt "${appliance_line}"
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one obsolete orchestration block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit source-only regression change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/appliance/validate.sh
          git commit -m 'test(appliance): require serialized production package air proof'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
