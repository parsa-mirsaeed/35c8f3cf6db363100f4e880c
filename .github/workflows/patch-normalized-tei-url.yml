name: Apply normalized TEI URL fix

on:
  push:
    branches:
      - feature/controlled-external-ai
    paths:
      - .github/workflows/patch-normalized-tei-url.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/controlled-external-ai
          fetch-depth: 0

      - name: Apply exact source and regression-test patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/api/src/ai_gateway_runtime.rs")
          source = path.read_text(encoding="utf-8")
          old = '''fn exact_local_tei_url(value: &str) -> Result<Url, StartupError> {
              let requested = normalized_url(value)?;
              if requested.as_str() != LOCAL_TEI_BASE_URL
                  || requested.scheme() != "http"
                  || requested.host_str() != Some("embedding")
                  || requested.port_or_known_default() != Some(80)
              {
                  return Err(StartupError::InvalidConfig(format!(
                      "Offline embedding URL must be exactly {LOCAL_TEI_BASE_URL}"
                  )));
              }
              Ok(requested)
          }
          '''
          new = '''fn exact_local_tei_url(value: &str) -> Result<Url, StartupError> {
              let requested = normalized_url(value)?;
              if requested.scheme() != "http"
                  || requested.host_str() != Some("embedding")
                  || requested.port_or_known_default() != Some(80)
                  || requested.path() != "/v1/"
              {
                  return Err(StartupError::InvalidConfig(format!(
                      "Offline embedding URL must be exactly {LOCAL_TEI_BASE_URL}"
                  )));
              }
              Ok(requested)
          }
          '''
          if source.count(old) != 1:
              raise SystemExit("expected exact local TEI validation block once")
          source = source.replace(old, new, 1)

          marker = '''    #[test]
              fn profiles_cannot_mix_connected_and_offline_vectors() {
          '''
          regression = '''    #[test]
              fn local_tei_origin_accepts_normalized_default_port_only() {
                  let explicit = exact_local_tei_url(LOCAL_TEI_BASE_URL)
                      .expect("explicit default port must be accepted");
                  assert_eq!(explicit.scheme(), "http");
                  assert_eq!(explicit.host_str(), Some("embedding"));
                  assert_eq!(explicit.port_or_known_default(), Some(80));
                  assert_eq!(explicit.path(), "/v1/");
                  assert!(exact_local_tei_url("http://embedding/v1/").is_ok());
                  for rejected in [
                      "http://embedding/v2/",
                      "http://other:80/v1/",
                      "https://embedding/v1/",
                      "http://user@embedding:80/v1/",
                  ] {
                      assert!(exact_local_tei_url(rejected).is_err(), "accepted {rejected}");
                  }
              }

          '''
          if source.count(marker) != 1:
              raise SystemExit("expected profile test marker once")
          source = source.replace(marker, regression + marker, 1)
          path.write_text(source, encoding="utf-8")
          PY
          cargo fmt -- packages/api/src/ai_gateway_runtime.rs
          git diff --check

      - name: Commit the exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/api/src/ai_gateway_runtime.rs
          git commit -m "fix(ai): accept normalized local TEI origin"
          git push origin HEAD:feature/controlled-external-ai
