name: Finalize appliance hardening

on:
  push:
    branches:
      - feature/air-gapped-packaging-ghcr
    paths:
      - .github/workflows/fix-remediation-quoting.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0

      - name: Apply and verify final hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          air = Path('.github/workflows/air-gapped-appliance.yml')
          text = air.read_text(encoding='utf-8')
          old_permissions = """permissions:
            contents: read
            packages: write
            id-token: write
            attestations: write
          """
          new_permissions = """permissions:
            contents: read
          """
          if text.count(old_permissions) != 1:
              raise SystemExit('unexpected workflow-wide permission block')
          text = text.replace(old_permissions, new_permissions, 1)

          insertions = {
              '  build-offline:\n': """  build-offline:
            permissions:
              contents: read
              id-token: write
          """,
              '  publish-platforms:\n': """  publish-platforms:
            permissions:
              contents: read
              packages: write
          """,
              '  publish-indexes:\n': """  publish-indexes:
            permissions:
              contents: read
              packages: write
              id-token: write
              attestations: write
          """,
          }
          for marker, replacement in insertions.items():
              if text.count(marker) != 1:
                  raise SystemExit(f'unexpected job marker: {marker.strip()}')
              text = text.replace(marker, replacement, 1)
          air.write_text(text, encoding='utf-8')

          validate = Path('scripts/appliance/validate.sh')
          text = validate.read_text(encoding='utf-8')
          marker = 'grep -Fq \'Build custom images natively for arm64\' "${air_workflow}"\n'
          check = marker + """python3 - "${air_workflow}" <<'PYWORKFLOW'
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          jobs_index = lines.index("jobs:")
          top = lines[:jobs_index]
          for forbidden in ("  packages: write", "  id-token: write", "  attestations: write"):
              assert forbidden not in top, forbidden
          expected = {
              "build-offline": ("contents: read", "id-token: write"),
              "publish-platforms": ("contents: read", "packages: write"),
              "publish-indexes": (
                  "contents: read",
                  "packages: write",
                  "id-token: write",
                  "attestations: write",
              ),
          }
          for job, permissions in expected.items():
              index = lines.index(f"  {job}:")
              block = lines[index + 1:index + 2 + len(permissions)]
              assert block[0] == "    permissions:", (job, block)
              assert tuple(line.strip() for line in block[1:]) == permissions, (job, block)
          PYWORKFLOW
          """
          if text.count(marker) != 1:
              raise SystemExit('workflow validation marker changed unexpectedly')
          validate.write_text(text.replace(marker, check, 1), encoding='utf-8')
          PY

          git show 50889c5f02ead1e04772b74216cfd941cb584a42:.github/workflows/full-validation.yml \
            > .github/workflows/full-validation.yml
          rm -f \
            .github/workflows/fix-remediation-quoting.yml \
            .github/workflows/wire-appliance-storage.yml \
            .github/workflows/wire-appliance-storage-v2.yml

          bash -n scripts/appliance/build.sh scripts/appliance/validate.sh deploy/appliance/edutalent-appliance
          python3 -m py_compile \
            scripts/appliance/locked_compose.py \
            scripts/appliance/release_manifest.py
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit final source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/air-gapped-appliance.yml \
            .github/workflows/full-validation.yml \
            .github/workflows/fix-remediation-quoting.yml \
            .github/workflows/wire-appliance-storage.yml \
            .github/workflows/wire-appliance-storage-v2.yml \
            scripts/appliance/validate.sh
          git commit -m 'fix(appliance): finalize release isolation hardening'
          git push origin HEAD:feature/air-gapped-packaging-ghcr
