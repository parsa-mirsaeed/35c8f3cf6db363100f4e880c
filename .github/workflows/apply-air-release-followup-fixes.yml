name: Apply release trust follow-up fixes

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: write

concurrency:
  group: apply-air-release-followup-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.repository == 'parsa-mirsaeed/35c8f3cf6db363100f4e880c' &&
      github.event.label.name == 'apply-release-followup-fix' &&
      github.event.pull_request.head.ref == 'feature/air-gapped-packaging-ghcr' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Apply reviewed follow-up fixes
        run: python3 scripts/ci/apply_air_release_followup_fixes.py

      - name: Run focused appliance and documentation regressions
        run: |
          set -euo pipefail
          bash -n scripts/appliance/offline_smoke.sh scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit only product and regression changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            deploy/appliance/README.md \
            scripts/appliance/offline_smoke.sh \
            scripts/appliance/validate.sh
          git diff --cached --check
          git status --short
          git commit -m 'fix(release): align smoke and transfer trust'
          git push origin HEAD:feature/air-gapped-packaging-ghcr
