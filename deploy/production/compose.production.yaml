name: edutalent-production

x-edutalent-environment: &edutalent-environment
  DATABASE_URL: postgresql://${DATABASE_APP_USER:?DATABASE_APP_USER is required}:${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD is required}@db:5432/${POSTGRES_DB:-postgres}
  DATABASE_APP_USER: ${DATABASE_APP_USER:?DATABASE_APP_USER is required}
  DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-15}
  DATABASE_MIN_CONNECTIONS: ${DATABASE_MIN_CONNECTIONS:-1}
  DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-30}
  PORT: ${EDUTALENT_INTERNAL_PORT:-8080}
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: ${EDUTALENT_INTERNAL_PORT:-8080}
  SERVER_WORKERS: ${SERVER_WORKERS:-2}
  RUST_LOG: ${RUST_LOG:-info}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
  SUPABASE_URL: http://kong:8000
  SUPABASE_PUBLIC_URL: https://${SUPABASE_DOMAIN:?SUPABASE_DOMAIN is required}
  SUPABASE_JWT_ISSUER: https://${SUPABASE_DOMAIN:?SUPABASE_DOMAIN is required}/auth/v1
  SUPABASE_PROJECT_REF: self-hosted
  SUPABASE_AUDIENCE: ${SUPABASE_AUDIENCE:-authenticated}
  SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
  SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY is required}
  QDRANT_URL: http://qdrant:6334
  QDRANT_API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-edutalent_materials_local_v1}
  QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-384}
  AI_GATEWAY_URL: http://ai-gateway:8090
  AI_GATEWAY_INTERNAL_TOKEN: ${AI_GATEWAY_INTERNAL_TOKEN:?AI_GATEWAY_INTERNAL_TOKEN is required}
  AI_GATEWAY_REQUEST_TIMEOUT_SECONDS: ${AI_GATEWAY_REQUEST_TIMEOUT_SECONDS:-60}
  EMBEDDING_PROFILE: ${EMBEDDING_PROFILE:-local-bge-v1}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
  EMBEDDING_VECTOR_SIZE: ${EMBEDDING_VECTOR_SIZE:-384}
  LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
  AI_MAX_PROMPT_CHARS: ${AI_MAX_PROMPT_CHARS:-80000}
  KNOWLEDGE_JOB_POLL_MS: ${KNOWLEDGE_JOB_POLL_MS:-1000}
  KNOWLEDGE_JOB_HEARTBEAT_SECONDS: ${KNOWLEDGE_JOB_HEARTBEAT_SECONDS:-15}
  KNOWLEDGE_JOB_STALE_SECONDS: ${KNOWLEDGE_JOB_STALE_SECONDS:-120}
  KNOWLEDGE_JOB_MAX_ATTEMPTS: ${KNOWLEDGE_JOB_MAX_ATTEMPTS:-5}
  KNOWLEDGE_CHUNK_SIZE: ${KNOWLEDGE_CHUNK_SIZE:-1200}
  KNOWLEDGE_CHUNK_OVERLAP: ${KNOWLEDGE_CHUNK_OVERLAP:-200}

x-security-baseline: &security-baseline
  init: true
  security_opt:
    - no-new-privileges:true

services:
  gateway-tls:
    <<: *security-baseline
    image: caddy:2.11.4-alpine
    user: "0:0"
    restart: "no"
    environment:
      GATEWAY_UID: ${GATEWAY_UID:-1000}
      GATEWAY_GID: ${GATEWAY_GID:-1000}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown -R "$${GATEWAY_UID}:$${GATEWAY_GID}" /data /config
        chmod 0700 /data /config
        cp -f /source/fullchain.pem /prepared/fullchain.pem
        cp -f /source/privkey.pem /prepared/privkey.pem
        cp -f /usr/bin/caddy /prepared/caddy
        chown "$${GATEWAY_UID}:$${GATEWAY_GID}" /prepared/fullchain.pem /prepared/privkey.pem
        chown "$${GATEWAY_UID}:$${GATEWAY_GID}" /prepared/caddy
        chmod 0644 /prepared/fullchain.pem
        chmod 0600 /prepared/privkey.pem
        chmod 0755 /prepared/caddy
    volumes:
      - ${TLS_CERT_FILE:?TLS_CERT_FILE is required}:/source/fullchain.pem:ro
      - ${TLS_KEY_FILE:?TLS_KEY_FILE is required}:/source/privkey.pem:ro
      - gateway-tls:/prepared
      - caddy-data:/data
      - caddy-config:/config
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    read_only: true
    tmpfs: [/tmp]

  gateway:
    <<: *security-baseline
    image: caddy:2.11.4-alpine
    user: "${GATEWAY_UID:-1000}:${GATEWAY_GID:-1000}"
    entrypoint: ["/etc/caddy/tls/caddy"]
    command: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      SUPABASE_DOMAIN: ${SUPABASE_DOMAIN:?SUPABASE_DOMAIN is required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
      ADMIN_ALLOWED_CIDRS: ${ADMIN_ALLOWED_CIDRS:-127.0.0.1/32 ::1/128}
      EDUTALENT_INTERNAL_PORT: ${EDUTALENT_INTERNAL_PORT:-8080}
    ports:
      - target: 8080
        host_ip: 0.0.0.0
        published: "80"
        protocol: tcp
      - target: 8443
        host_ip: 0.0.0.0
        published: "443"
        protocol: tcp
    volumes:
      - gateway-tls:/etc/caddy/tls:ro
      - ${EDUTALENT_PRODUCTION_DIR:?EDUTALENT_PRODUCTION_DIR is required}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway-tls:
        condition: service_completed_successfully
      app:
        condition: service_healthy
      kong:
        condition: service_healthy
    networks: [ingress, edge, supabase_api, admin]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp, /run]
    deploy:
      resources:
        limits:
          cpus: "${GATEWAY_CPU_LIMIT:-0.50}"
          memory: "${GATEWAY_MEMORY_LIMIT:-256M}"

  migrate:
    <<: *security-baseline
    image: ${EDUTALENT_IMAGE:-edutalent}:${EDUTALENT_TAG:-local}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-postgres}
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    cap_drop: [ALL]

  database-access:
    <<: *security-baseline
    image: ${EDUTALENT_IMAGE:-edutalent}:${EDUTALENT_TAG:-local}
    restart: "no"
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-postgres}
      DATABASE_APP_USER: ${DATABASE_APP_USER:?DATABASE_APP_USER is required}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD is required}
    command: ["configure-database-role"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data]
    cap_drop: [ALL]

  app:
    <<: *security-baseline
    image: ${EDUTALENT_IMAGE:-edutalent}:${EDUTALENT_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *edutalent-environment
      RUN_MIGRATIONS: "false"
    command: ["server"]
    expose: ["${EDUTALENT_INTERNAL_PORT:-8080}"]
    depends_on:
      database-access:
        condition: service_completed_successfully
      kong:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks: [supabase_api, data, ai_internal]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-1.50}"
          memory: "${APP_MEMORY_LIMIT:-2G}"

  ai-gateway:
    <<: *security-baseline
    image: ${EDUTALENT_IMAGE:-edutalent}:${EDUTALENT_TAG:-local}
    user: "65532:65532"
    restart: unless-stopped
    environment:
      PORT: "8090"
      RUST_LOG: ${RUST_LOG:-info}
      AI_GATEWAY_LISTEN_ADDR: 0.0.0.0:8090
      AI_GATEWAY_MODE: ${AI_GATEWAY_MODE:-offline}
      AI_GATEWAY_INTERNAL_TOKEN: ${AI_GATEWAY_INTERNAL_TOKEN:?AI_GATEWAY_INTERNAL_TOKEN is required}
      EMBEDDING_PROFILE: ${EMBEDDING_PROFILE:-local-bge-v1}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-http://embedding:80/v1/}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_LLM_BASE_URL: https://api.deepseek.com/v1/
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-5}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-45}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_RETRY_BASE_DELAY_MS: ${AI_RETRY_BASE_DELAY_MS:-250}
      AI_CIRCUIT_FAILURE_THRESHOLD: ${AI_CIRCUIT_FAILURE_THRESHOLD:-3}
      AI_CIRCUIT_OPEN_SECONDS: ${AI_CIRCUIT_OPEN_SECONDS:-30}
      AI_EMBEDDING_CONCURRENCY: ${AI_EMBEDDING_CONCURRENCY:-4}
      AI_LLM_CONCURRENCY: ${AI_LLM_CONCURRENCY:-2}
      AI_EMBEDDING_QUOTA_REQUESTS_PER_HOUR: ${AI_EMBEDDING_QUOTA_REQUESTS_PER_HOUR:-2000}
      AI_EMBEDDING_QUOTA_CHARS_PER_HOUR: ${AI_EMBEDDING_QUOTA_CHARS_PER_HOUR:-5000000}
      AI_LLM_QUOTA_REQUESTS_PER_HOUR: ${AI_LLM_QUOTA_REQUESTS_PER_HOUR:-500}
      AI_LLM_QUOTA_CHARS_PER_HOUR: ${AI_LLM_QUOTA_CHARS_PER_HOUR:-2000000}
      AI_MAX_BODY_BYTES: ${AI_MAX_BODY_BYTES:-262144}
      AI_MAX_PROVIDER_RESPONSE_BYTES: ${AI_MAX_PROVIDER_RESPONSE_BYTES:-16777216}
      AI_MAX_EMBEDDING_INPUTS: ${AI_MAX_EMBEDDING_INPUTS:-64}
      AI_MAX_EMBEDDING_CHARS: ${AI_MAX_EMBEDDING_CHARS:-120000}
      AI_MAX_CHAT_MESSAGES: ${AI_MAX_CHAT_MESSAGES:-24}
      AI_MAX_PROMPT_CHARS: ${AI_MAX_PROMPT_CHARS:-80000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
    command: ["ai-gateway"]
    expose: ["8090"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    networks: [ai_internal, ai_egress]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits:
          cpus: "${AI_GATEWAY_CPU_LIMIT:-1.00}"
          memory: "${AI_GATEWAY_MEMORY_LIMIT:-1G}"

  qdrant:
    <<: *security-baseline
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.18.2}
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      QDRANT__SERVICE__ENABLE_TLS: "false"
    volumes:
      - qdrant-data:/qdrant/storage
    expose: ["6333", "6334"]
    networks: [data]
    deploy:
      resources:
        limits:
          cpus: "${QDRANT_CPU_LIMIT:-1.50}"
          memory: "${QDRANT_MEMORY_LIMIT:-2G}"

  embedding:
    <<: *security-baseline
    profiles: ["local-embedding"]
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    restart: unless-stopped
    command:
      - --model-id
      - ${LOCAL_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      - --served-model-name
      - ${LOCAL_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
    volumes:
      - embedding-data:/data
    expose: ["80"]
    networks: [ai_internal]
    deploy:
      resources:
        limits:
          cpus: "${EMBEDDING_CPU_LIMIT:-1.50}"
          memory: "${EMBEDDING_MEMORY_LIMIT:-4G}"

  kong:
    ports: !reset []
    networks: !override [supabase_api, admin]
    security_opt: [no-new-privileges:true]

  supavisor:
    ports: !reset []
    networks: !override [data]
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    security_opt: [no-new-privileges:true]

  studio:
    networks: !override [admin, supabase_api, data]
    security_opt: [no-new-privileges:true]

  auth:
    networks: !override [supabase_api, data]
    security_opt: [no-new-privileges:true]

  rest:
    networks: !override [supabase_api, data]
    security_opt: [no-new-privileges:true]

  realtime:
    networks: !override [supabase_api, data]
    security_opt: [no-new-privileges:true]

  storage:
    networks: !override [supabase_api, data]
    security_opt: [no-new-privileges:true]

  imgproxy:
    networks: !override [supabase_api, data]
    security_opt: [no-new-privileges:true]

  meta:
    networks: !override [admin, data]
    security_opt: [no-new-privileges:true]

  functions:
    profiles: ["edge-functions"]
    networks: !override [supabase_api, data]
    security_opt: [no-new-privileges:true]

  db:
    networks: !override [data]
    security_opt: [no-new-privileges:true]

networks:
  ingress:
    name: edutalent-ingress
    driver: bridge
    internal: false
  ai_egress:
    name: edutalent-ai-egress
    driver: bridge
    internal: false
  edge:
    name: edutalent-edge
    internal: true
  supabase_api:
    name: edutalent-supabase-api
    internal: true
  data:
    name: edutalent-data
    internal: true
  admin:
    name: edutalent-admin
    internal: true
  ai_internal:
    name: edutalent-ai-internal
    internal: true

volumes:
  qdrant-data:
  embedding-data:
  gateway-tls:
  caddy-data:
  caddy-config:
