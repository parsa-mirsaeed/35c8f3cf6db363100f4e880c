name: Mirror Final Proof

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review

permissions:
  contents: read
  actions: write

concurrency:
  group: mirror-final-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch-and-verify:
    name: Verify final PR gates then dispatch appliance proof
    if: >-
      contains(github.event.pull_request.labels.*.name, 'full-validation') &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Resolve exact-head pull-request Package and Production runs
        id: pr-runs
        shell: bash
        run: |
          set -euo pipefail

          find_pr_run() {
            local workflow="$1" attempt run_id
            for attempt in $(seq 1 120); do
              run_id="$(gh run list \
                --repo "$REPOSITORY" \
                --workflow "$workflow" \
                --branch "$HEAD_REF" \
                --event pull_request \
                --limit 50 \
                --json databaseId,headSha \
                --jq "[.[] | select(.headSha == \"$HEAD_SHA\")] | if length == 0 then empty else max_by(.databaseId).databaseId end")"
              if [[ -n "$run_id" ]]; then
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 5
            done
            echo "Unable to resolve pull-request run for $workflow at $HEAD_SHA" >&2
            return 1
          }

          package_run_id="$(find_pr_run 'Package')"
          production_run_id="$(find_pr_run 'Production Foundation')"
          echo "package_run_id=$package_run_id" >> "$GITHUB_OUTPUT"
          echo "production_run_id=$production_run_id" >> "$GITHUB_OUTPUT"
          echo "Package run: $package_run_id"
          echo "Production Foundation run: $production_run_id"

      - name: Wait for exact-head Package and Production proof
        shell: bash
        run: |
          set -euo pipefail
          gh run watch '${{ steps.pr-runs.outputs.package_run_id }}' \
            --repo "$REPOSITORY" --exit-status
          gh run watch '${{ steps.pr-runs.outputs.production_run_id }}' \
            --repo "$REPOSITORY" --exit-status

      - name: Inspect Package and Production required jobs
        shell: bash
        run: |
          set -euo pipefail
          gh run view '${{ steps.pr-runs.outputs.package_run_id }}' \
            --repo "$REPOSITORY" \
            --json headSha,event,status,conclusion,jobs,url > package-run.json
          gh run view '${{ steps.pr-runs.outputs.production_run_id }}' \
            --repo "$REPOSITORY" \
            --json headSha,event,status,conclusion,jobs,url > production-run.json

          python3 - "$HEAD_SHA" package-run.json production-run.json <<'PY'
          import json
          import sys

          expected_sha, package_path, production_path = sys.argv[1:]
          package = json.load(open(package_path, encoding="utf-8"))
          production = json.load(open(production_path, encoding="utf-8"))

          def require_run(run, name):
              assert run["headSha"] == expected_sha, (name, run["headSha"], expected_sha)
              assert run["event"] == "pull_request", (name, run["event"])
              assert run["status"] == "completed", (name, run["status"])
              assert run["conclusion"] == "success", (name, run["conclusion"])

          require_run(package, "Package")
          require_run(production, "Production Foundation")

          package_jobs = {job["name"]: job["conclusion"] for job in package["jobs"]}
          for job_name in (
              "Validate package definitions",
              "Docker image and release bundle",
          ):
              assert package_jobs.get(job_name) == "success", (job_name, package_jobs.get(job_name))

          production_jobs = {job["name"]: job["conclusion"] for job in production["jobs"]}
          for job_name in (
              "Render and verify production topology",
              "Apply migrations and roles on pinned Supabase PostgreSQL 17",
              "Start complete production stack",
          ):
              assert production_jobs.get(job_name) == "success", (
                  job_name,
                  production_jobs.get(job_name),
              )
          PY

      - name: Dispatch complete exact-head Air-gapped Appliance proof
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run air-gapped-appliance.yml \
            --repo "$REPOSITORY" \
            --ref "$HEAD_REF" \
            -f publish=false \
            -f create_archive=false

      - name: Resolve dispatched appliance run
        id: appliance
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            run_id="$(gh run list \
              --repo "$REPOSITORY" \
              --workflow 'Air-gapped Appliance' \
              --branch "$HEAD_REF" \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,headSha \
              --jq "[.[] | select(.headSha == \"$HEAD_SHA\")] | if length == 0 then empty else max_by(.databaseId).databaseId end")"
            if [[ -n "$run_id" ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Air-gapped Appliance run: $run_id"
              exit 0
            fi
            sleep 5
          done
          echo "Unable to resolve Air-gapped Appliance run at $HEAD_SHA" >&2
          exit 1

      - name: Wait for complete appliance proof
        shell: bash
        run: |
          set -euo pipefail
          gh run watch '${{ steps.appliance.outputs.run_id }}' \
            --repo "$REPOSITORY" --exit-status

      - name: Enforce exact-head appliance jobs
        shell: bash
        run: |
          set -euo pipefail
          gh run view '${{ steps.appliance.outputs.run_id }}' \
            --repo "$REPOSITORY" \
            --json headSha,event,status,conclusion,jobs,url > appliance-run.json

          python3 - "$HEAD_SHA" appliance-run.json <<'PY'
          import json
          import sys

          expected_sha, appliance_path = sys.argv[1:]
          appliance = json.load(open(appliance_path, encoding="utf-8"))
          assert appliance["headSha"] == expected_sha, (appliance["headSha"], expected_sha)
          assert appliance["event"] == "workflow_dispatch", appliance["event"]
          assert appliance["status"] == "completed", appliance["status"]
          assert appliance["conclusion"] == "success", appliance["conclusion"]

          jobs = {job["name"]: job["conclusion"] for job in appliance["jobs"]}
          for job_name in (
              "Validate appliance definitions",
              "Build and verify complete air-gapped appliance",
              "Build custom images natively for arm64",
              "Air-gapped appliance gate",
          ):
              assert jobs.get(job_name) == "success", (job_name, jobs.get(job_name))
          for job_name in (
              "Publish native amd64 GHCR images",
              "Publish native arm64 GHCR images",
              "Assemble, sign, and attest multi-architecture GHCR indexes",
          ):
              assert jobs.get(job_name) == "skipped", (job_name, jobs.get(job_name))
          print("Exact-head Package, Production Foundation, and native Air-gapped Appliance proof verified.")
          PY

      - name: Upload exact-head mirror evidence
        uses: actions/upload-artifact@v6
        with:
          name: mirror-final-proof
          path: |
            package-run.json
            production-run.json
            appliance-run.json
          if-no-files-found: error
          retention-days: 7