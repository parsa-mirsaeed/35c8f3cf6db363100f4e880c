name: Run appliance state hardening

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/run-appliance-state-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute reviewed transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_lines = Path(".github/workflows/apply-appliance-state-hardening.yml").read_text(encoding="utf-8").splitlines()
          step = workflow_lines.index("      - name: Apply external-state and scanner corrections")
          run_line = workflow_lines.index("        run: |", step)
          next_step = next(
              index for index in range(run_line + 1, len(workflow_lines))
              if workflow_lines[index].startswith("      - name:")
          )
          script_lines = workflow_lines[run_line + 1:next_step]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script_lines) + "\n"

          replacements = (
              (
                  '''if text.count(old_production) != 1:
              raise SystemExit("appliance production function changed unexpectedly")
          text = text.replace(old_production, new_production, 1)
          ''',
                  '''production_start = text.index("production() {")
          init_start = text.index("init_secrets() {", production_start)
          text = text[:production_start] + new_production.rstrip("\\n") + "\\n\\n" + text[init_start:]
          ''',
                  "production guard",
              ),
              (
                  '''if text.count(old_init) != 1:
              raise SystemExit("appliance init function changed unexpectedly")
          text = text.replace(old_init, new_init, 1)
          ''',
                  '''init_start = text.index("init_secrets() {", production_start)
          install_start = text.index("install_bundle() {", init_start)
          text = text[:init_start] + new_init.rstrip("\\n") + "\\n\\n" + text[install_start:]
          ''',
                  "init guard",
              ),
              (
                  '''if text.count(old_install) != 1:
              raise SystemExit("appliance install copy changed unexpectedly")
          text = text.replace(old_install, new_install, 1)
          ''',
                  '''copy_start = text.index('  (cd "${ROOT_DIR}" && tar ', install_start)
          chmod_start = text.index('  chmod 0755 "${destination}/edutalent-appliance"', copy_start)
          text = text[:copy_start] + new_install.rstrip("\\n") + "\\n" + text[chmod_start:]
          ''',
                  "install guard",
              ),
              (
                  '''if text.count(old_checks) != 1:
              raise SystemExit("appliance checks block changed unexpectedly")
          launcher.write_text(text.replace(old_checks, new_checks, 1), encoding="utf-8")
          ''',
                  '''checks_start = text.index("  checks)")
          help_start = text.index("  help|-h|--help)", checks_start)
          text = text[:checks_start] + new_checks.rstrip("\\n") + "\\n" + text[help_start:]
          launcher.write_text(text, encoding="utf-8")
          ''',
                  "checks guard",
              ),
          )
          for old, new, label in replacements:
              if script.count(old) != 1:
                  raise SystemExit(f"unable to replace {label}")
              script = script.replace(old, new, 1)

          Path("/tmp/apply-state-hardening.sh").write_text(script, encoding="utf-8")
          PY
          bash /tmp/apply-state-hardening.sh

      - name: Validate complete appliance definitions
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            deploy/appliance/edutalent-appliance \
            deploy/production/edutalent-production \
            deploy/production/generate-secrets.sh \
            scripts/appliance/offline_smoke.sh \
            scripts/appliance/validate.sh
          python3 -m py_compile scripts/appliance/release_manifest.py
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit source-only corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            deploy/appliance/edutalent-appliance \
            deploy/production/edutalent-production \
            deploy/production/generate-secrets.sh \
            scripts/appliance/offline_smoke.sh \
            scripts/appliance/release_manifest.py \
            scripts/appliance/validate.sh
          git commit -m 'fix(appliance): externalize runtime state and scan all payloads'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
