name: Mirror Final Proof

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: mirror-final-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch-and-verify:
    name: Verify and serialize complete exact-head proof
    permissions:
      contents: read
      actions: write
    if: >-
      contains(github.event.pull_request.labels.*.name, 'full-validation') &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Prepare resilient Actions API helpers
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/actions-run-utils.sh" <<'BASH'
          retry_gh() {
            local max_attempts="${GH_API_RETRY_ATTEMPTS:-10}"
            local base_delay="${GH_API_RETRY_BASE_SECONDS:-3}"
            local max_delay="${GH_API_RETRY_MAX_SECONDS:-30}"
            local attempt delay rc error_text
            local stdout_file stderr_file
            stdout_file="$(mktemp)"
            stderr_file="$(mktemp)"

            for attempt in $(seq 1 "$max_attempts"); do
              : > "$stdout_file"
              : > "$stderr_file"
              if "$@" >"$stdout_file" 2>"$stderr_file"; then
                cat "$stdout_file"
                rm -f "$stdout_file" "$stderr_file"
                return 0
              else
                rc=$?
              fi
              error_text="$(cat "$stderr_file")"
              if ! grep -Eqi \
                'HTTP (408|409|425|429|5[0-9]{2})|Server Error|Bad Gateway|Service Unavailable|Gateway Timeout|rate limit|timed out|timeout|connection reset|connection refused|TLS handshake|unexpected EOF|EOF' \
                "$stderr_file"; then
                cat "$stdout_file"
                printf '%s\n' "$error_text" >&2
                rm -f "$stdout_file" "$stderr_file"
                return "$rc"
              fi
              if (( attempt == max_attempts )); then
                echo "GitHub API command failed after ${attempt} attempts: $*" >&2
                printf '%s\n' "$error_text" >&2
                rm -f "$stdout_file" "$stderr_file"
                return "$rc"
              fi
              delay=$(( base_delay * attempt ))
              if (( delay > max_delay )); then
                delay="$max_delay"
              fi
              echo "Transient GitHub API failure (${attempt}/${max_attempts}); retrying in ${delay}s: ${error_text}" >&2
              sleep "$delay"
            done
          }

          find_pr_run_id() {
            local workflow="$1"
            retry_gh gh run list \
              --repo "$REPOSITORY" \
              --workflow "$workflow" \
              --branch "$HEAD_REF" \
              --event pull_request \
              --limit 50 \
              --json databaseId,headSha \
              --jq "[.[] | select(.headSha == \"$HEAD_SHA\")] | if length == 0 then empty else max_by(.databaseId).databaseId end"
          }

          find_dispatch_run_id() {
            local workflow="$1"
            retry_gh gh run list \
              --repo "$REPOSITORY" \
              --workflow "$workflow" \
              --branch "$HEAD_REF" \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,headSha \
              --jq "[.[] | select(.headSha == \"$HEAD_SHA\")] | if length == 0 then empty else max_by(.databaseId).databaseId end"
          }

          wait_for_run() {
            local run_id="$1"
            local timeout_seconds="${2:-21000}"
            local poll_seconds="${3:-15}"
            local started_at now status conclusion run_file
            started_at="$(date +%s)"
            run_file="$(mktemp)"

            while true; do
              retry_gh gh api \
                --method GET \
                "/repos/${REPOSITORY}/actions/runs/${run_id}" > "$run_file"
              status="$(jq -r '.status' "$run_file")"
              conclusion="$(jq -r '.conclusion // ""' "$run_file")"
              echo "Run ${run_id}: status=${status}${conclusion:+ conclusion=${conclusion}}"

              if [[ "$status" == "completed" ]]; then
                rm -f "$run_file"
                if [[ "$conclusion" == "success" ]]; then
                  return 0
                fi
                echo "Run ${run_id} completed with conclusion '${conclusion}'." >&2
                return 1
              fi

              now="$(date +%s)"
              if (( now - started_at >= timeout_seconds )); then
                rm -f "$run_file"
                echo "Timed out waiting for run ${run_id} after ${timeout_seconds}s." >&2
                return 1
              fi
              sleep "$poll_seconds"
            done
          }

          write_run_evidence() {
            local run_id="$1"
            local output_path="$2"
            local run_file jobs_file
            run_file="$(mktemp)"
            jobs_file="$(mktemp)"

            retry_gh gh api \
              --method GET \
              "/repos/${REPOSITORY}/actions/runs/${run_id}" > "$run_file"
            retry_gh gh api \
              --method GET \
              "/repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > "$jobs_file"

            jq -n \
              --slurpfile run "$run_file" \
              --slurpfile jobs "$jobs_file" \
              '($run[0]) as $r
               | ($jobs[0]) as $j
               | {
                   id: $r.id,
                   headSha: $r.head_sha,
                   event: $r.event,
                   status: $r.status,
                   conclusion: $r.conclusion,
                   url: $r.html_url,
                   jobs: [
                     $j.jobs[]
                     | {
                         name: .name,
                         status: .status,
                         conclusion: .conclusion
                       }
                   ]
                 }' > "$output_path"

            rm -f "$run_file" "$jobs_file"
          }
          BASH

          bash -n "${RUNNER_TEMP}/actions-run-utils.sh"

          # Regression check: a transient 502 must be retried instead of failing the proof.
          source "${RUNNER_TEMP}/actions-run-utils.sh"
          retry_counter="${RUNNER_TEMP}/retry-counter"
          printf '0\n' > "$retry_counter"
          flaky_command() {
            local count
            count="$(cat "$retry_counter")"
            count=$((count + 1))
            printf '%s\n' "$count" > "$retry_counter"
            if (( count < 3 )); then
              echo "failed to get jobs: HTTP 502: Server Error" >&2
              return 1
            fi
            printf 'recovered\n'
          }
          GH_API_RETRY_ATTEMPTS=3 \
          GH_API_RETRY_BASE_SECONDS=0 \
          GH_API_RETRY_MAX_SECONDS=0 \
            retry_gh flaky_command | grep -Fx 'recovered'
          [[ "$(cat "$retry_counter")" == "3" ]]

      - name: Resolve exact-head pull-request gates
        id: pr-runs
        shell: bash
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/actions-run-utils.sh"

          find_pr_run() {
            local workflow="$1" attempt run_id
            for attempt in $(seq 1 180); do
              run_id="$(find_pr_run_id "$workflow")"
              if [[ -n "$run_id" ]]; then
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 5
            done
            echo "Unable to resolve pull-request run for $workflow at $HEAD_SHA" >&2
            return 1
          }

          ai_run_id="$(find_pr_run 'AI Change Proof')"
          full_run_id="$(find_pr_run 'Full Validation')"
          {
            echo "ai_run_id=$ai_run_id"
            echo "full_run_id=$full_run_id"
          } >> "$GITHUB_OUTPUT"
          echo "AI Change Proof run: $ai_run_id"
          echo "Full Validation run: $full_run_id"

      - name: Wait for exact-head pull-request gates
        shell: bash
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/actions-run-utils.sh"
          wait_for_run '${{ steps.pr-runs.outputs.ai_run_id }}'
          wait_for_run '${{ steps.pr-runs.outputs.full_run_id }}'

      - name: Enforce AI and full-validation jobs
        shell: bash
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/actions-run-utils.sh"
          write_run_evidence '${{ steps.pr-runs.outputs.ai_run_id }}' ai-run.json
          write_run_evidence '${{ steps.pr-runs.outputs.full_run_id }}' full-validation-run.json

          python3 - "$HEAD_SHA" ai-run.json full-validation-run.json <<'PY'
          import json
          import sys

          expected_sha, ai_path, full_path = sys.argv[1:]
          ai = json.load(open(ai_path, encoding="utf-8"))
          full = json.load(open(full_path, encoding="utf-8"))

          def require_pr_run(run, name):
              assert run["headSha"] == expected_sha, (name, run["headSha"], expected_sha)
              assert run["event"] == "pull_request", (name, run["event"])
              assert run["status"] == "completed", (name, run["status"])
              assert run["conclusion"] == "success", (name, run["conclusion"])

          require_pr_run(ai, "AI Change Proof")
          require_pr_run(full, "Full Validation")

          ai_jobs = {job["name"]: job["conclusion"] for job in ai["jobs"]}
          assert ai_jobs.get("AI change gate") == "success", ai_jobs

          full_jobs = {job["name"]: job["conclusion"] for job in full["jobs"]}
          for job_name in (
              "Resolve full-validation mode",
              "Full database validation",
              "Full Rust compile, lint, and tests",
              "Full validation gate",
          ):
              assert full_jobs.get(job_name) == "success", (job_name, full_jobs.get(job_name))
          PY

      - name: Reuse or dispatch complete exact-head Production Foundation
        id: production
        shell: bash
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/actions-run-utils.sh"

          classify_production_run() {
            local path="$1"
            python3 - "$HEAD_SHA" "$path" <<'PY'
          import json
          import sys

          expected_sha, path = sys.argv[1:]
          run = json.load(open(path, encoding="utf-8"))
          assert run["headSha"] == expected_sha, (run["headSha"], expected_sha)
          assert run["status"] == "completed", run["status"]
          assert run["conclusion"] == "success", run["conclusion"]
          jobs = {job["name"]: job["conclusion"] for job in run["jobs"]}
          required = (
              "Render and verify production topology",
              "Apply migrations and roles on pinned Supabase PostgreSQL 17",
              "Start complete production stack",
          )
          if all(jobs.get(name) == "success" for name in required):
              raise SystemExit(0)
          if (
              jobs.get(required[0]) == "success"
              and jobs.get(required[1]) == "skipped"
              and jobs.get(required[2]) == "skipped"
          ):
              raise SystemExit(10)
          raise AssertionError({name: jobs.get(name) for name in required})
          PY
          }

          pr_run_id="$(find_pr_run_id 'Production Foundation')"
          if [[ -n "$pr_run_id" ]]; then
            wait_for_run "$pr_run_id"
            write_run_evidence "$pr_run_id" production-pr-run.json

            set +e
            classify_production_run production-pr-run.json
            pr_status=$?
            set -e

            if [[ "$pr_status" -eq 0 ]]; then
              {
                echo "run_id=$pr_run_id"
                echo "expected_event=pull_request"
                echo "source=pull-request"
              } >> "$GITHUB_OUTPUT"
              echo "Reusing complete Production Foundation PR run: $pr_run_id"
              exit 0
            fi
            if [[ "$pr_status" -ne 10 ]]; then
              echo "Exact-head Production Foundation PR run failed required-job enforcement." >&2
              exit "$pr_status"
            fi
            echo "Exact-head PR run was focused-only; checking for a reusable complete dispatch."
          else
            echo "No exact-head Production Foundation PR run exists; checking dispatch history."
          fi

          dispatch_run_id="$(find_dispatch_run_id 'Production Foundation')"
          if [[ -n "$dispatch_run_id" ]]; then
            echo "Found exact-head Production Foundation dispatch: $dispatch_run_id"
            set +e
            wait_for_run "$dispatch_run_id"
            dispatch_wait_status=$?
            set -e
            if [[ "$dispatch_wait_status" -eq 0 ]]; then
              write_run_evidence "$dispatch_run_id" production-dispatch-run.json
              set +e
              classify_production_run production-dispatch-run.json
              dispatch_status=$?
              set -e
              if [[ "$dispatch_status" -eq 0 ]]; then
                {
                  echo "run_id=$dispatch_run_id"
                  echo "expected_event=workflow_dispatch"
                  echo "source=existing-workflow-dispatch"
                } >> "$GITHUB_OUTPUT"
                echo "Reusing complete Production Foundation dispatch: $dispatch_run_id"
                exit 0
              fi
              echo "Existing exact-head dispatch was not a complete Production Foundation proof." >&2
            else
              echo "Existing exact-head dispatch failed; creating a new proof." >&2
            fi
          fi

          previous="${dispatch_run_id:-0}"
          gh workflow run production-foundation.yml \
            --repo "$REPOSITORY" \
            --ref "$HEAD_REF"
          for attempt in $(seq 1 120); do
            run_id="$(find_dispatch_run_id 'Production Foundation')"
            if [[ -n "$run_id" ]] && (( run_id > previous )); then
              {
                echo "run_id=$run_id"
                echo "expected_event=workflow_dispatch"
                echo "source=new-workflow-dispatch"
              } >> "$GITHUB_OUTPUT"
              echo "Production Foundation dispatch: $run_id"
              exit 0
            fi
            sleep 5
          done
          echo "Unable to resolve newly dispatched Production Foundation run at $HEAD_SHA" >&2
          exit 1

      - name: Wait for and inspect complete Production Foundation proof
        shell: bash
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/actions-run-utils.sh"
          wait_for_run '${{ steps.production.outputs.run_id }}'
          write_run_evidence '${{ steps.production.outputs.run_id }}' production-run.json
          python3 - \
            "$HEAD_SHA" \
            '${{ steps.production.outputs.expected_event }}' \
            production-run.json <<'PY'
          import json
          import sys

          expected_sha, expected_event, path = sys.argv[1:]
          run = json.load(open(path, encoding="utf-8"))
          assert run["headSha"] == expected_sha, (run["headSha"], expected_sha)
          assert run["event"] == expected_event, (run["event"], expected_event)
          assert run["status"] == "completed", run["status"]
          assert run["conclusion"] == "success", run["conclusion"]
          jobs = {job["name"]: job["conclusion"] for job in run["jobs"]}
          for job_name in (
              "Render and verify production topology",
              "Apply migrations and roles on pinned Supabase PostgreSQL 17",
              "Start complete production stack",
          ):
              assert jobs.get(job_name) == "success", (job_name, jobs.get(job_name))
          PY
          echo "Production proof source: ${{ steps.production.outputs.source }}"

      - name: Reuse or dispatch exact-head Package after Production Foundation
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/actions-run-utils.sh"

          validate_package_run() {
            local path="$1"
            python3 - "$HEAD_SHA" "$path" <<'PY'
          import json
          import sys

          expected_sha, path = sys.argv[1:]
          run = json.load(open(path, encoding="utf-8"))
          assert run["headSha"] == expected_sha, (run["headSha"], expected_sha)
          assert run["event"] == "workflow_dispatch", run["event"]
          assert run["status"] == "completed", run["status"]
          assert run["conclusion"] == "success", run["conclusion"]
          jobs = {job["name"]: job["conclusion"] for job in run["jobs"]}
          for job_name in ("Validate package definitions", "Docker image and release bundle"):
              assert jobs.get(job_name) == "success", (job_name, jobs.get(job_name))
          PY
          }

          dispatch_run_id="$(find_dispatch_run_id 'Package')"
          if [[ -n "$dispatch_run_id" ]]; then
            echo "Found exact-head Package dispatch: $dispatch_run_id"
            set +e
            wait_for_run "$dispatch_run_id"
            dispatch_wait_status=$?
            set -e
            if [[ "$dispatch_wait_status" -eq 0 ]]; then
              write_run_evidence "$dispatch_run_id" package-existing-run.json
              set +e
              validate_package_run package-existing-run.json
              dispatch_status=$?
              set -e
              if [[ "$dispatch_status" -eq 0 ]]; then
                {
                  echo "run_id=$dispatch_run_id"
                  echo "source=existing-workflow-dispatch"
                } >> "$GITHUB_OUTPUT"
                echo "Reusing complete Package dispatch: $dispatch_run_id"
                exit 0
              fi
              echo "Existing exact-head Package dispatch was not a complete package proof." >&2
            else
              echo "Existing exact-head Package dispatch failed; creating a new proof." >&2
            fi
          fi

          previous="${dispatch_run_id:-0}"
          gh workflow run package.yml \
            --repo "$REPOSITORY" \
            --ref "$HEAD_REF"
          for attempt in $(seq 1 120); do
            run_id="$(find_dispatch_run_id 'Package')"
            if [[ -n "$run_id" ]] && (( run_id > previous )); then
              {
                echo "run_id=$run_id"
                echo "source=new-workflow-dispatch"
              } >> "$GITHUB_OUTPUT"
              echo "Package run: $run_id"
              exit 0
            fi
            sleep 5
          done
          echo "Unable to resolve newly dispatched Package run at $HEAD_SHA" >&2
          exit 1

      - name: Wait for and inspect complete Package proof
        shell: bash
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/actions-run-utils.sh"
          wait_for_run '${{ steps.package.outputs.run_id }}'
          write_run_evidence '${{ steps.package.outputs.run_id }}' package-run.json
          python3 - "$HEAD_SHA" package-run.json <<'PY'
          import json
          import sys

          expected_sha, path = sys.argv[1:]
          run = json.load(open(path, encoding="utf-8"))
          assert run["headSha"] == expected_sha, (run["headSha"], expected_sha)
          assert run["event"] == "workflow_dispatch", run["event"]
          assert run["status"] == "completed", run["status"]
          assert run["conclusion"] == "success", run["conclusion"]
          jobs = {job["name"]: job["conclusion"] for job in run["jobs"]}
          for job_name in ("Validate package definitions", "Docker image and release bundle"):
              assert jobs.get(job_name) == "success", (job_name, jobs.get(job_name))
          PY
          echo "Package proof source: ${{ steps.package.outputs.source }}"

      - name: Upload pre-appliance exact-head evidence
        uses: actions/upload-artifact@v6
        with:
          name: mirror-pre-appliance-evidence
          path: |
            ai-run.json
            full-validation-run.json
            production-pr-run.json
            production-dispatch-run.json
            production-run.json
            package-existing-run.json
            package-run.json
          if-no-files-found: error
          retention-days: 7

  complete-appliance:
    name: Complete exact-head Air-gapped Appliance proof
    needs: dispatch-and-verify
    permissions:
      contents: read
    uses: ./.github/workflows/air-gapped-appliance.yml
    with:
      complete: true
      create_archive: false

  final-proof:
    name: Finalize exact-head mirror evidence
    needs:
      - dispatch-and-verify
      - complete-appliance
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download serialized pre-appliance evidence
        uses: actions/download-artifact@v6
        with:
          name: mirror-pre-appliance-evidence
          path: mirror-evidence

      - name: Download complete appliance gate evidence
        uses: actions/download-artifact@v6
        with:
          name: air-gapped-appliance-gate
          path: mirror-evidence

      - name: Enforce exact-head appliance evidence
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - "$HEAD_SHA" mirror-evidence/air-gapped-appliance-gate.json <<'PY'
          import json
          import sys

          expected_sha, path = sys.argv[1:]
          evidence = json.load(open(path, encoding="utf-8"))
          assert evidence["head_sha"] == expected_sha, (evidence["head_sha"], expected_sha)
          assert evidence["validation"] == "success", evidence
          assert evidence["offline_appliance"] == "success", evidence
          assert evidence["native_arm64"] == "success", evidence
          assert evidence["ghcr_platforms"] == "skipped", evidence
          assert evidence["ghcr_indexes"] == "skipped", evidence
          print("Complete serialized exact-head proof verified.")
          PY

      - name: Upload exact-head mirror evidence
        uses: actions/upload-artifact@v6
        with:
          name: mirror-final-proof
          path: mirror-evidence/**
          if-no-files-found: error
          retention-days: 7
