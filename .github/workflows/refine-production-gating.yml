name: Refine production proof gating

on:
  push:
    branches:
      - feature/air-gapped-packaging-ghcr
    paths:
      - .github/workflows/refine-production-gating.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0

      - name: Defer exactly two complete production jobs to dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/production-foundation.yml')
          text = path.read_text(encoding='utf-8')
          old = (
              "if: $" +
              "{{ github.event_name != 'pull_request' || "
              "contains(github.event.pull_request.labels.*.name, 'full-validation') }}"
          )
          new = "if: github.event_name != 'pull_request'"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two production final-job conditions, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/refine-production-gating.yml
          grep -c "if: github.event_name != 'pull_request'" .github/workflows/production-foundation.yml | grep -Fxq '2'
          ! grep -Fq "contains(github.event.pull_request.labels.*.name, 'full-validation')" .github/workflows/production-foundation.yml
          git diff --check

      - name: Commit scoped scheduling change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/production-foundation.yml .github/workflows/refine-production-gating.yml
          git commit -m 'ci(production): defer complete stack proof to orchestrator'
          git push origin HEAD:feature/air-gapped-packaging-ghcr
