name: Enforce ephemeral signature opt-in

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/enforce-ephemeral-opt-in.yml

permissions:
  contents: write

jobs:
  patch:
    name: Require explicit ephemeral verification opt-in
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact trust-mode transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          installer = Path("deploy/appliance/edutalent-appliance")
          replace_once(
              installer,
              '''    ephemeral)
                [[ -f "${public_key}" && -f "${manifest_signature}" && -f "${checksums_signature}" ]] || {
          ''',
              '''    ephemeral)
                [[ "${EDUTALENT_APPLIANCE_ALLOW_EPHEMERAL_SIGNATURES:-false}" == "true" ]] || {
                  echo "Ephemeral signatures are CI validation artifacts; set EDUTALENT_APPLIANCE_ALLOW_EPHEMERAL_SIGNATURES=true only for an explicitly trusted validation build." >&2
                  return 1
                }
                [[ -f "${public_key}" && -f "${manifest_signature}" && -f "${checksums_signature}" ]] || {
          ''',
          )

          build = Path("scripts/appliance/build.sh")
          replace_once(
              build,
              '''if [[ "${SIGNING_MODE}" == "keyless" && "${GITHUB_ACTIONS:-false}" == "true" ]]; then
            : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required for CI keyless verification}"
            : "${GITHUB_REF:?GITHUB_REF is required for CI keyless verification}"
            export EDUTALENT_APPLIANCE_TRUSTED_OIDC_ISSUER="https://token.actions.githubusercontent.com"
            export EDUTALENT_APPLIANCE_TRUSTED_IDENTITY_REGEXP="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/air-gapped-appliance\\.yml@${GITHUB_REF}$"
          fi
          ''',
              '''case "${SIGNING_MODE}" in
            ephemeral)
              export EDUTALENT_APPLIANCE_ALLOW_EPHEMERAL_SIGNATURES=true
              ;;
            keyless)
              if [[ "${GITHUB_ACTIONS:-false}" == "true" ]]; then
                : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required for CI keyless verification}"
                : "${GITHUB_REF:?GITHUB_REF is required for CI keyless verification}"
                export EDUTALENT_APPLIANCE_TRUSTED_OIDC_ISSUER="https://token.actions.githubusercontent.com"
                export EDUTALENT_APPLIANCE_TRUSTED_IDENTITY_REGEXP="^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/air-gapped-appliance\\.yml@${GITHUB_REF}$"
              fi
              ;;
          esac
          ''',
          )
          PY

      - name: Validate scoped trust-mode change
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/appliance/edutalent-appliance scripts/appliance/build.sh scripts/appliance/offline_smoke.sh
          grep -Fq 'EDUTALENT_APPLIANCE_ALLOW_EPHEMERAL_SIGNATURES:-false' deploy/appliance/edutalent-appliance
          grep -Fq 'export EDUTALENT_APPLIANCE_ALLOW_EPHEMERAL_SIGNATURES=true' scripts/appliance/build.sh
          grep -Fq 'export EDUTALENT_APPLIANCE_ALLOW_EPHEMERAL_SIGNATURES=true' scripts/appliance/offline_smoke.sh
          git diff --check

      - name: Commit code-only trust change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/appliance/edutalent-appliance scripts/appliance/build.sh
          git commit -m 'fix(appliance): require explicit ephemeral trust opt-in'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
