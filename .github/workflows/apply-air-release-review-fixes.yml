name: Apply protected release review correction

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: write

concurrency:
  group: apply-air-release-review-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.repository == 'parsa-mirsaeed/35c8f3cf6db363100f4e880c' &&
      github.event.label.name == 'apply-release-fix' &&
      github.event.pull_request.head.ref == 'feature/air-gapped-packaging-ghcr' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Stage the protected release identity correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patch_path = Path("scripts/ci/apply_air_release_review_fixes.py")
          patch_lines = patch_path.read_text(encoding="utf-8").splitlines()
          patch_start = patch_lines.index('build = ROOT / "scripts/appliance/build.sh"')
          patch_end = patch_lines.index('release = ROOT / ".github/workflows/air-gapped-release.yml"')
          patch_path.write_text(
              "\n".join(patch_lines[:patch_start] + patch_lines[patch_end:]) + "\n",
              encoding="utf-8",
          )

          build_path = Path("scripts/appliance/build.sh")
          build_lines = build_path.read_text(encoding="utf-8").splitlines()
          identity_index = next(
              index
              for index, line in enumerate(build_lines)
              if "EDUTALENT_APPLIANCE_TRUSTED_IDENTITY_REGEXP=" in line
          )
          issuer_index = identity_index - 1
          if "EDUTALENT_APPLIANCE_TRUSTED_OIDC_ISSUER=" not in build_lines[issuer_index]:
              raise RuntimeError("Unexpected keyless verification identity block")
          replacement = [
              '      expected_workflow_ref="${GITHUB_REPOSITORY}/.github/workflows/air-gapped-release.yml@${GITHUB_REF}"',
              '      [[ "${GITHUB_WORKFLOW_REF:-}" == "${expected_workflow_ref}" ]] || {',
              '        echo "Keyless appliance signing is restricted to ${expected_workflow_ref}." >&2',
              '        exit 1',
              '      }',
              '      trusted_identity="https://github.com/${expected_workflow_ref}"',
              '      export EDUTALENT_APPLIANCE_TRUSTED_OIDC_ISSUER="https://token.actions.githubusercontent.com"',
              '      export EDUTALENT_APPLIANCE_TRUSTED_IDENTITY_REGEXP="$(python3 -c \'import re, sys; print("^" + re.escape(sys.argv[1]) + "$")\' "${trusted_identity}")"',
          ]
          build_path.write_text(
              "\n".join(build_lines[:issuer_index] + replacement + build_lines[identity_index + 1:]) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Apply reviewed release hardening
        run: python3 scripts/ci/apply_air_release_review_fixes.py

      - name: Run focused appliance and workflow regressions
        run: |
          set -euo pipefail
          bash -n scripts/appliance/build.sh scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit only the reviewed correction
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-air-release-review-fixes.yml \
            scripts/ci/apply_air_release_review_fixes.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            .github/workflows/air-gapped-release.yml \
            .github/workflows/package.yml \
            scripts/appliance/build.sh \
            scripts/appliance/validate.sh
          git add -u -- \
            .github/workflows/apply-air-release-review-fixes.yml \
            scripts/ci/apply_air_release_review_fixes.py
          git diff --cached --check
          git status --short
          git commit -m 'fix(release): harden protected keyless workflow'
          git push origin HEAD:feature/air-gapped-packaging-ghcr
