name: Fix Supabase runtime permissions

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/fix-supabase-runtime-permissions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Normalize immutable Supabase runtime permissions
        shell: bash
        run: |
          set -euo pipefail
          cat > deploy/production/normalize-supabase-runtime-permissions.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          runtime_dir="${1:-}"
          [[ -n "${runtime_dir}" && -d "${runtime_dir}" ]] || {
            echo "Usage: normalize-supabase-runtime-permissions.sh <runtime-directory>" >&2
            exit 2
          }

          if find "${runtime_dir}" -type l -print -quit | grep -q .; then
            echo "Supabase runtime contains a symlink; refusing permission normalization." >&2
            exit 1
          fi
          if find "${runtime_dir}" ! -type d ! -type f -print -quit | grep -q .; then
            echo "Supabase runtime contains a non-regular entry; refusing permission normalization." >&2
            exit 1
          fi

          # The pinned runtime contains immutable public definitions only. Secrets are
          # generated later and retain mode 0600. Restore read/search access that a
          # strict caller umask may remove while preserving upstream executable bits.
          chmod -R a+rX,go-w "${runtime_dir}"

          unreadable_file="$(find "${runtime_dir}" -type f ! -perm -004 -print -quit)"
          unsearchable_directory="$(find "${runtime_dir}" -type d ! -perm -005 -print -quit)"
          [[ -z "${unreadable_file}" ]] || {
            echo "Supabase runtime file is not container-readable: ${unreadable_file}" >&2
            exit 1
          }
          [[ -z "${unsearchable_directory}" ]] || {
            echo "Supabase runtime directory is not container-searchable: ${unsearchable_directory}" >&2
            exit 1
          }
          SH
          chmod 0755 deploy/production/normalize-supabase-runtime-permissions.sh

          python3 - <<'PY'
          from pathlib import Path

          bootstrap_path = Path("deploy/production/bootstrap-supabase.sh")
          bootstrap = bootstrap_path.read_text(encoding="utf-8")
          bootstrap = bootstrap.replace(
              'RUNTIME_DIR="${SCRIPT_DIR}/runtime/supabase"\nUPSTREAM_URL=',
              'RUNTIME_DIR="${SCRIPT_DIR}/runtime/supabase"\nPERMISSIONS_HELPER="${SCRIPT_DIR}/normalize-supabase-runtime-permissions.sh"\nUPSTREAM_URL=',
              1,
          )
          bootstrap = bootstrap.replace(
              'for command in git awk mktemp python3; do',
              'for command in git awk mktemp python3 find chmod grep; do',
              1,
          )
          bootstrap = bootstrap.replace(
              '      configure_ci_database_volume\n      echo "Official Supabase runtime is already prepared at ${RUNTIME_DIR}"',
              '      bash "${PERMISSIONS_HELPER}" "${RUNTIME_DIR}"\n      configure_ci_database_volume\n      echo "Official Supabase runtime is already prepared at ${RUNTIME_DIR}"',
              1,
          )
          bootstrap = bootstrap.replace(
              'printf \'%s\\n\' "${commit}" > "${RUNTIME_DIR}/UPSTREAM_COMMIT"\nconfigure_ci_database_volume\nchmod -R go-w "${RUNTIME_DIR}"',
              'printf \'%s\\n\' "${commit}" > "${RUNTIME_DIR}/UPSTREAM_COMMIT"\nbash "${PERMISSIONS_HELPER}" "${RUNTIME_DIR}"\nconfigure_ci_database_volume',
              1,
          )
          required = (
              'PERMISSIONS_HELPER="${SCRIPT_DIR}/normalize-supabase-runtime-permissions.sh"',
              'bash "${PERMISSIONS_HELPER}" "${RUNTIME_DIR}"',
          )
          if any(item not in bootstrap for item in required) or 'chmod -R go-w "${RUNTIME_DIR}"' in bootstrap:
              raise SystemExit("failed to patch bootstrap permission normalization")
          bootstrap_path.write_text(bootstrap, encoding="utf-8")

          build_path = Path("scripts/appliance/build.sh")
          build = build_path.read_text(encoding="utf-8")
          anchor = 'bash "${PRODUCTION_DIR}/edutalent-production" bootstrap\ncp "${PRODUCTION_DIR}/.env.edutalent.example" "${APP_ENV}"'
          replacement = '''bash "${PRODUCTION_DIR}/edutalent-production" bootstrap
          unreadable_runtime_file="$(find "${SUPABASE_DIR}" -type f ! -perm -004 -print -quit)"
          unsearchable_runtime_directory="$(find "${SUPABASE_DIR}" -type d ! -perm -005 -print -quit)"
          [[ -z "${unreadable_runtime_file}" ]] || {
            echo "Pinned Supabase runtime file is not container-readable: ${unreadable_runtime_file}" >&2
            exit 1
          }
          [[ -z "${unsearchable_runtime_directory}" ]] || {
            echo "Pinned Supabase runtime directory is not container-searchable: ${unsearchable_runtime_directory}" >&2
            exit 1
          }
          cp "${PRODUCTION_DIR}/.env.edutalent.example" "${APP_ENV}"'''
          if build.count(anchor) != 1:
              raise SystemExit("expected build bootstrap anchor exactly once")
          build_path.write_text(build.replace(anchor, replacement), encoding="utf-8")

          validate_path = Path("scripts/appliance/validate.sh")
          validate = validate_path.read_text(encoding="utf-8")
          syntax_anchor = '  "${ROOT_DIR}/scripts/appliance/offline_smoke.sh" \\\n  "${ROOT_DIR}/deploy/appliance/edutalent-appliance"; do'
          syntax_replacement = '  "${ROOT_DIR}/scripts/appliance/offline_smoke.sh" \\\n  "${ROOT_DIR}/deploy/production/bootstrap-supabase.sh" \\\n  "${ROOT_DIR}/deploy/production/normalize-supabase-runtime-permissions.sh" \\\n  "${ROOT_DIR}/deploy/appliance/edutalent-appliance"; do'
          if validate.count(syntax_anchor) != 1:
              raise SystemExit("expected validate syntax anchor exactly once")
          validate = validate.replace(syntax_anchor, syntax_replacement)

          fixture_anchor = 'fixture="$(mktemp -d)"\ntrap \'rm -rf "${fixture}"\' EXIT\n'
          regression = '''fixture="$(mktemp -d)"
          trap 'rm -rf "${fixture}"' EXIT

          permissions_fixture="${fixture}/strict-umask-runtime"
          (
            umask 077
            mkdir -p "${permissions_fixture}/volumes/db"
            printf 'SELECT 1;\\n' > "${permissions_fixture}/volumes/db/webhooks.sql"
            printf '#!/bin/sh\\nexit 0\\n' > "${permissions_fixture}/run.sh"
            chmod u+x "${permissions_fixture}/run.sh"
          )
          test "$(stat -c %a "${permissions_fixture}")" = "700"
          test "$(stat -c %a "${permissions_fixture}/volumes/db/webhooks.sql")" = "600"
          bash "${ROOT_DIR}/deploy/production/normalize-supabase-runtime-permissions.sh" \\
            "${permissions_fixture}"
          test "$(stat -c %a "${permissions_fixture}")" = "755"
          test "$(stat -c %a "${permissions_fixture}/volumes/db")" = "755"
          test "$(stat -c %a "${permissions_fixture}/volumes/db/webhooks.sql")" = "644"
          test "$(stat -c %a "${permissions_fixture}/run.sh")" = "755"

          symlink_fixture="${fixture}/symlink-runtime"
          mkdir -p "${symlink_fixture}"
          printf 'outside\\n' > "${fixture}/outside.txt"
          chmod 0600 "${fixture}/outside.txt"
          ln -s "${fixture}/outside.txt" "${symlink_fixture}/escape"
          if bash "${ROOT_DIR}/deploy/production/normalize-supabase-runtime-permissions.sh" \\
            "${symlink_fixture}" >/dev/null 2>&1; then
            echo "Runtime permission normalization accepted a symlink." >&2
            exit 1
          fi
          test "$(stat -c %a "${fixture}/outside.txt")" = "600"
          '''
          if validate.count(fixture_anchor) != 1:
              raise SystemExit("expected validate fixture anchor exactly once")
          validate_path.write_text(validate.replace(fixture_anchor, regression), encoding="utf-8")
          PY

          rm .github/workflows/fix-supabase-runtime-permissions.yml

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/production/bootstrap-supabase.sh
          bash -n deploy/production/normalize-supabase-runtime-permissions.sh
          bash -n scripts/appliance/build.sh
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit the correction and regression together
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/production/bootstrap-supabase.sh \
            deploy/production/normalize-supabase-runtime-permissions.sh \
            scripts/appliance/build.sh \
            scripts/appliance/validate.sh \
            .github/workflows/fix-supabase-runtime-permissions.yml
          git commit -m 'fix(appliance): restore Supabase runtime readability'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feature/air-gapped-packaging-ghcr
