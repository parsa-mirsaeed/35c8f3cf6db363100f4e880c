name: edutalent

x-app-image: &app-image ${EDUTALENT_IMAGE:-edutalent}:${EDUTALENT_TAG:-local}
x-app-environment: &app-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-edutalent}
  DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-15}
  DATABASE_MIN_CONNECTIONS: ${DATABASE_MIN_CONNECTIONS:-1}
  DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-30}
  PORT: "8080"
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: "8080"
  SERVER_WORKERS: ${SERVER_WORKERS:-2}
  RUST_LOG: ${RUST_LOG:-info}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-pretty}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
  SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
  SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF:?SUPABASE_PROJECT_REF is required}
  SUPABASE_AUDIENCE: ${SUPABASE_AUDIENCE:-authenticated}
  SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
  SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY is required}
  QDRANT_URL: http://qdrant:6334
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-edutalent_local_bge_v1}
  QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-384}
  AI_GATEWAY_URL: http://ai-gateway:8090
  AI_GATEWAY_INTERNAL_TOKEN: ${AI_GATEWAY_INTERNAL_TOKEN:?AI_GATEWAY_INTERNAL_TOKEN is required}
  AI_GATEWAY_DEFAULT_SCHOOL_ID: ${AI_GATEWAY_DEFAULT_SCHOOL_ID:?AI_GATEWAY_DEFAULT_SCHOOL_ID is required}
  AI_GATEWAY_REQUEST_TIMEOUT_SECONDS: ${AI_GATEWAY_REQUEST_TIMEOUT_SECONDS:-60}
  EMBEDDING_PROFILE: ${EMBEDDING_PROFILE:-local-bge-v1}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
  EMBEDDING_VECTOR_SIZE: ${EMBEDDING_VECTOR_SIZE:-384}
  LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
  AI_MAX_PROMPT_CHARS: ${AI_MAX_PROMPT_CHARS:-80000}
  KNOWLEDGE_JOB_POLL_MS: ${KNOWLEDGE_JOB_POLL_MS:-1000}
  KNOWLEDGE_JOB_HEARTBEAT_SECONDS: ${KNOWLEDGE_JOB_HEARTBEAT_SECONDS:-15}
  KNOWLEDGE_JOB_STALE_SECONDS: ${KNOWLEDGE_JOB_STALE_SECONDS:-120}
  KNOWLEDGE_JOB_MAX_ATTEMPTS: ${KNOWLEDGE_JOB_MAX_ATTEMPTS:-5}
  KNOWLEDGE_CHUNK_SIZE: ${KNOWLEDGE_CHUNK_SIZE:-1200}
  KNOWLEDGE_CHUNK_OVERLAP: ${KNOWLEDGE_CHUNK_OVERLAP:-200}

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-edutalent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-edutalent}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  embedding:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    command:
      - --model-id
      - ${LOCAL_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      - --served-model-name
      - ${LOCAL_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
    ports:
      - "${EMBEDDING_PORT:-8081}:80"
    volumes:
      - embedding-data:/data
    restart: unless-stopped

  ai-gateway:
    image: *app-image
    environment:
      PORT: "8090"
      RUST_LOG: ${RUST_LOG:-info}
      AI_GATEWAY_LISTEN_ADDR: 0.0.0.0:8090
      AI_GATEWAY_MODE: ${AI_GATEWAY_MODE:-offline}
      AI_GATEWAY_INTERNAL_TOKEN: ${AI_GATEWAY_INTERNAL_TOKEN:?AI_GATEWAY_INTERNAL_TOKEN is required}
      EMBEDDING_PROFILE: ${EMBEDDING_PROFILE:-local-bge-v1}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-http://embedding:80/v1/}
      AI_ALLOWED_EMBEDDING_BASE_URLS: ${AI_ALLOWED_EMBEDDING_BASE_URLS:-https://api.openai.com/v1/}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-https://api.deepseek.com/v1/}
      AI_ALLOWED_LLM_BASE_URLS: ${AI_ALLOWED_LLM_BASE_URLS:-https://api.deepseek.com/v1/}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-5}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-45}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_RETRY_BASE_DELAY_MS: ${AI_RETRY_BASE_DELAY_MS:-250}
      AI_CIRCUIT_FAILURE_THRESHOLD: ${AI_CIRCUIT_FAILURE_THRESHOLD:-3}
      AI_CIRCUIT_OPEN_SECONDS: ${AI_CIRCUIT_OPEN_SECONDS:-30}
      AI_EMBEDDING_CONCURRENCY: ${AI_EMBEDDING_CONCURRENCY:-4}
      AI_LLM_CONCURRENCY: ${AI_LLM_CONCURRENCY:-2}
      AI_EMBEDDING_QUOTA_REQUESTS_PER_HOUR: ${AI_EMBEDDING_QUOTA_REQUESTS_PER_HOUR:-2000}
      AI_LLM_QUOTA_REQUESTS_PER_HOUR: ${AI_LLM_QUOTA_REQUESTS_PER_HOUR:-500}
      AI_MAX_BODY_BYTES: ${AI_MAX_BODY_BYTES:-262144}
      AI_MAX_EMBEDDING_INPUTS: ${AI_MAX_EMBEDDING_INPUTS:-64}
      AI_MAX_EMBEDDING_CHARS: ${AI_MAX_EMBEDDING_CHARS:-120000}
      AI_MAX_PROMPT_CHARS: ${AI_MAX_PROMPT_CHARS:-80000}
    command: ["ai-gateway"]
    depends_on:
      embedding:
        condition: service_started
    restart: unless-stopped

  migrate:
    image: *app-image
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-edutalent}
    command: ["migrate"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  app:
    image: *app-image
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
    command: ["server"]
    ports:
      - "${EDUTALENT_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      ai-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
  embedding-data:
