name: Fix reusable permission ceiling
# Trigger line-safe reusable permission editing.

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/fix-reusable-permission-ceiling.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Permit called release jobs without widening validation jobs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          mirror_path = Path('.github/workflows/mirror-final-proof.yml')
          lines = mirror_path.read_text(encoding='utf-8').splitlines()
          job = lines.index('  complete-appliance:')
          permissions = lines.index('    permissions:', job)
          expected = [
              '      contents: read',
              '      id-token: write',
          ]
          if lines[permissions + 1:permissions + 3] != expected:
              raise SystemExit(f'reusable caller permissions changed unexpectedly: {lines[permissions + 1:permissions + 6]}')
          lines[permissions + 1:permissions + 3] = [
              '      contents: read',
              '      packages: write',
              '      id-token: write',
              '      attestations: write',
          ]
          mirror_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          validate_path = Path('scripts/appliance/validate.sh')
          validate = validate_path.read_text(encoding='utf-8')
          old = '    "complete-appliance": ("contents: read", "id-token: write"),\n'
          new = '''    "complete-appliance": (
              "contents: read",
              "packages: write",
              "id-token: write",
              "attestations: write",
          ),
          '''
          if validate.count(old) != 1:
              raise SystemExit('reusable permission regression changed unexpectedly')
          validate_path.write_text(validate.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate workflows and appliance definitions
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path) }' \
            .github/workflows/air-gapped-appliance.yml \
            .github/workflows/mirror-final-proof.yml
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit clean correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-reusable-permission-ceiling.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/fix-reusable-permission-ceiling.yml \
            .github/workflows/mirror-final-proof.yml \
            scripts/appliance/validate.sh
          git commit -m 'fix(ci): authorize nested release permission ceiling'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
