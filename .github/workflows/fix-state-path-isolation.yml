name: Fix appliance state path isolation

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/fix-state-path-isolation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Canonicalize state before deriving mutable paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          launcher_path = Path("deploy/appliance/edutalent-appliance")
          launcher = launcher_path.read_text(encoding="utf-8")
          anchor = '''MANIFEST="${ROOT_DIR}/manifests/release-manifest.json"
          CHECKSUMS="${ROOT_DIR}/SHA256SUMS"
          PRODUCTION_SOURCE_DIR="${ROOT_DIR}/deploy/production"
          if [[ -n "${EDUTALENT_APPLIANCE_STATE_DIR:-}" ]]; then
            STATE_DIR="${EDUTALENT_APPLIANCE_STATE_DIR}"
          else
            : "${HOME:?HOME is required when EDUTALENT_APPLIANCE_STATE_DIR is unset}"
            STATE_DIR="${XDG_STATE_HOME:-${HOME}/.local/state}/edutalent-appliance"
          fi
          STATE_CONFIG_DIR="${STATE_DIR}/config"
          RUNTIME_PRODUCTION_DIR="${STATE_DIR}/runtime/production"
          APP_ENV="${STATE_CONFIG_DIR}/.env.edutalent"
          SUPABASE_ENV="${STATE_CONFIG_DIR}/supabase.env"
          '''
          replacement = '''canonical_path() {
            command -v python3 >/dev/null 2>&1 || {
              echo "Required command not found: python3" >&2
              exit 1
            }
            python3 - "$1" <<'PYTHON_PATH'
          import sys
          from pathlib import Path
          print(Path(sys.argv[1]).expanduser().resolve(strict=False))
          PYTHON_PATH
          }

          ROOT_DIR="$(canonical_path "${ROOT_DIR}")"
          MANIFEST="${ROOT_DIR}/manifests/release-manifest.json"
          CHECKSUMS="${ROOT_DIR}/SHA256SUMS"
          PRODUCTION_SOURCE_DIR="${ROOT_DIR}/deploy/production"
          if [[ -n "${EDUTALENT_APPLIANCE_STATE_DIR:-}" ]]; then
            STATE_DIR="${EDUTALENT_APPLIANCE_STATE_DIR}"
          else
            : "${HOME:?HOME is required when EDUTALENT_APPLIANCE_STATE_DIR is unset}"
            STATE_DIR="${XDG_STATE_HOME:-${HOME}/.local/state}/edutalent-appliance"
          fi
          STATE_DIR="$(canonical_path "${STATE_DIR}")"
          STATE_CONFIG_DIR="${STATE_DIR}/config"
          RUNTIME_PRODUCTION_DIR="${STATE_DIR}/runtime/production"
          APP_ENV="${STATE_CONFIG_DIR}/.env.edutalent"
          SUPABASE_ENV="${STATE_CONFIG_DIR}/supabase.env"
          '''
          if launcher.count(anchor) != 1:
              raise SystemExit("expected state path initialization anchor exactly once")
          launcher = launcher.replace(anchor, replacement)

          old_validate = '''validate_state_dir() {
              [[ "${STATE_DIR}" == /* ]] || {
                  echo "EDUTALENT_APPLIANCE_STATE_DIR and XDG_STATE_HOME must resolve to an absolute path: ${STATE_DIR}" >&2
                  exit 1
              }
              case "${STATE_DIR}" in
                "${ROOT_DIR}"|"${ROOT_DIR}/"*)
                  echo "Appliance state must remain outside the immutable release: ${STATE_DIR}" >&2
                  exit 1
                  ;;
              esac
          }

          initialize_state_dirs() {
              validate_state_dir
              mkdir -p "${STATE_CONFIG_DIR}" "${STATE_DIR}/runtime"
              chmod 0700 "${STATE_DIR}" "${STATE_CONFIG_DIR}" "${STATE_DIR}/runtime"
          }
          '''
          new_validate = '''validate_state_dir() {
              [[ "${STATE_DIR}" == /* ]] || {
                  echo "EDUTALENT_APPLIANCE_STATE_DIR and XDG_STATE_HOME must resolve to an absolute path: ${STATE_DIR}" >&2
                  exit 1
              }
              case "${STATE_DIR}/" in
                "${ROOT_DIR%/}/"*)
                  echo "Appliance state must remain outside the immutable release: ${STATE_DIR}" >&2
                  exit 1
                  ;;
              esac
          }

          initialize_state_dirs() {
              local resolved_state
              validate_state_dir
              mkdir -p "${STATE_DIR}"
              resolved_state="$(canonical_path "${STATE_DIR}")"
              [[ "${resolved_state}" == "${STATE_DIR}" ]] || {
                  echo "Appliance state path changed during initialization: ${STATE_DIR} -> ${resolved_state}" >&2
                  exit 1
              }
              validate_state_dir
              mkdir -p "${STATE_CONFIG_DIR}" "${STATE_DIR}/runtime"
              chmod 0700 "${STATE_DIR}" "${STATE_CONFIG_DIR}" "${STATE_DIR}/runtime"
          }
          '''
          if launcher.count(old_validate) != 1:
              raise SystemExit("expected state validation anchor exactly once")
          launcher_path.write_text(launcher.replace(old_validate, new_validate), encoding="utf-8")

          validate_path = Path("scripts/appliance/validate.sh")
          validate = validate_path.read_text(encoding="utf-8")
          regression_anchor = '''if HOME="${fixture}/home" EDUTALENT_APPLIANCE_STATE_DIR="${fixture}/upgrades/v1/state" \\
            "${fixture}/upgrades/v1/edutalent-appliance" state-dir >/dev/null 2>&1; then
            echo "Appliance accepted mutable state inside the immutable release." >&2
            exit 1
          fi

          mkdir -p "${fixture}/production-source/runtime/supabase" "${fixture}/production-source/runtime/keep"
          '''
          regression = '''if HOME="${fixture}/home" EDUTALENT_APPLIANCE_STATE_DIR="${fixture}/upgrades/v1/state" \\
            "${fixture}/upgrades/v1/edutalent-appliance" state-dir >/dev/null 2>&1; then
            echo "Appliance accepted mutable state inside the immutable release." >&2
            exit 1
          fi
          if HOME="${fixture}/home" \\
            EDUTALENT_APPLIANCE_STATE_DIR="${fixture}/outside/../upgrades/v1/traversal-state" \\
            "${fixture}/upgrades/v1/edutalent-appliance" state-dir >/dev/null 2>&1; then
            echo "Appliance accepted a traversal-resolved state path inside the release." >&2
            exit 1
          fi
          ln -s "${fixture}/upgrades/v1" "${fixture}/state-link"
          if HOME="${fixture}/home" \\
            EDUTALENT_APPLIANCE_STATE_DIR="${fixture}/state-link/symlink-state" \\
            "${fixture}/upgrades/v1/edutalent-appliance" state-dir >/dev/null 2>&1; then
            echo "Appliance accepted a symlink-resolved state path inside the release." >&2
            exit 1
          fi
          test ! -e "${fixture}/upgrades/v1/traversal-state"
          test ! -e "${fixture}/upgrades/v1/symlink-state"

          mkdir -p "${fixture}/production-source/runtime/supabase" "${fixture}/production-source/runtime/keep"
          '''
          if validate.count(regression_anchor) != 1:
              raise SystemExit("expected state regression anchor exactly once")
          validate_path.write_text(validate.replace(regression_anchor, regression), encoding="utf-8")
          PY
          rm .github/workflows/fix-state-path-isolation.yml

      - name: Run focused appliance regressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/appliance/edutalent-appliance
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit state isolation correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/appliance/edutalent-appliance \
            scripts/appliance/validate.sh \
            .github/workflows/fix-state-path-isolation.yml
          git commit -m 'fix(appliance): canonicalize mutable state path'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feature/air-gapped-packaging-ghcr
