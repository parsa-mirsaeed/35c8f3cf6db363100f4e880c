name: Fix verifier bootstrap and install

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/fix-verifier-bootstrap-install.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Authenticate verifier and reject nested installs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          launcher_path = Path("deploy/appliance/edutalent-appliance")
          launcher = launcher_path.read_text(encoding="utf-8")

          verify_start = launcher.index("verify_signatures() {")
          verify_end = launcher.index("\n\nverify_bundle() {", verify_start)
          verify_functions = r'''detect_signature_mode() {
            local public_key="${ROOT_DIR}/signatures/verification.pub"
            local manifest_signature="${ROOT_DIR}/signatures/release-manifest.sig"
            local checksums_signature="${ROOT_DIR}/signatures/SHA256SUMS.sig"
            local manifest_bundle="${ROOT_DIR}/signatures/release-manifest.sigstore.json"
            local checksums_bundle="${ROOT_DIR}/signatures/SHA256SUMS.sigstore.json"
            local ephemeral_complete=false keyless_complete=false

            if [[ -f "${public_key}" && -f "${manifest_signature}" && -f "${checksums_signature}" ]]; then
              ephemeral_complete=true
            fi
            if [[ -f "${manifest_bundle}" && -f "${checksums_bundle}" ]]; then
              keyless_complete=true
            fi
            if [[ "${ephemeral_complete}" == true && "${keyless_complete}" == false ]]; then
              printf '%s\n' ephemeral
            elif [[ "${keyless_complete}" == true && "${ephemeral_complete}" == false ]]; then
              printf '%s\n' keyless
            else
              echo "Release signature material is incomplete or ambiguous." >&2
              return 1
            fi
          }

          VERIFIED_SIGNING_MODE=""
          verify_signatures() {
            local public_key="${ROOT_DIR}/signatures/verification.pub"
            local manifest_signature="${ROOT_DIR}/signatures/release-manifest.sig"
            local checksums_signature="${ROOT_DIR}/signatures/SHA256SUMS.sig"
            local manifest_bundle="${ROOT_DIR}/signatures/release-manifest.sigstore.json"
            local checksums_bundle="${ROOT_DIR}/signatures/SHA256SUMS.sigstore.json"
            local signing_mode
            signing_mode="$(detect_signature_mode)"

            require_command cosign
            case "${signing_mode}" in
              ephemeral)
                [[ "${EDUTALENT_APPLIANCE_ALLOW_EPHEMERAL_SIGNATURES:-false}" == "true" ]] || {
                  echo "Ephemeral signatures are validation-only and require explicit EDUTALENT_APPLIANCE_ALLOW_EPHEMERAL_SIGNATURES=true." >&2
                  return 1
                }
                cosign verify-blob \
                  --key "${public_key}" \
                  --signature "${manifest_signature}" \
                  "${MANIFEST}" >/dev/null
                cosign verify-blob \
                  --key "${public_key}" \
                  --signature "${checksums_signature}" \
                  "${CHECKSUMS}" >/dev/null
                echo "Verified explicitly enabled ephemeral validation signatures with the packaged public key."
                ;;
              keyless)
                local issuer="${EDUTALENT_APPLIANCE_TRUSTED_OIDC_ISSUER:-}"
                local identity="${EDUTALENT_APPLIANCE_TRUSTED_IDENTITY_REGEXP:-}"
                [[ -n "${issuer}" && -n "${identity}" ]] || {
                  echo "Keyless verification requires independently supplied EDUTALENT_APPLIANCE_TRUSTED_OIDC_ISSUER and EDUTALENT_APPLIANCE_TRUSTED_IDENTITY_REGEXP." >&2
                  return 1
                }
                cosign verify-blob \
                  --bundle "${manifest_bundle}" \
                  --certificate-oidc-issuer "${issuer}" \
                  --certificate-identity-regexp "${identity}" \
                  "${MANIFEST}" >/dev/null
                cosign verify-blob \
                  --bundle "${checksums_bundle}" \
                  --certificate-oidc-issuer "${issuer}" \
                  --certificate-identity-regexp "${identity}" \
                  "${CHECKSUMS}" >/dev/null
                echo "Verified keyless release signatures against the independently supplied trust policy."
                ;;
              *) echo "Unsupported signed release mode: ${signing_mode}" >&2; return 1 ;;
            esac
            VERIFIED_SIGNING_MODE="${signing_mode}"
          }'''
          launcher = launcher[:verify_start] + verify_functions + launcher[verify_end:]

          bundle_start = launcher.index("verify_bundle() {")
          bundle_end = launcher.index("\n\nimage_rows() {", bundle_start)
          bundle_function = r'''verify_bundle() {
            require_command python3
            require_command sha256sum
            [[ -f "${MANIFEST}" && -f "${CHECKSUMS}" ]] || {
              echo "Release manifest or checksum set is missing." >&2
              exit 1
            }
            verify_signatures
            (
              cd "${ROOT_DIR}"
              sha256sum --check --strict SHA256SUMS >/dev/null
            )
            python3 "${ROOT_DIR}/scripts/appliance/release_manifest.py" verify --bundle "${ROOT_DIR}"
            local declared_mode expected actual
            declared_mode="$(manifest_value release.signing_mode)"
            [[ "${declared_mode}" == "${VERIFIED_SIGNING_MODE}" ]] || {
              echo "Release signing mode does not match the authenticated signature material." >&2
              exit 1
            }
            expected="$(manifest_value release.platform)"
            actual="$(host_platform)"
            [[ "${expected}" == "${actual}" ]] || {
              echo "Appliance platform ${expected} does not match host ${actual}." >&2
              exit 1
            }
          }'''
          launcher = launcher[:bundle_start] + bundle_function + launcher[bundle_end:]

          install_start = launcher.index("install_bundle() {")
          install_end = launcher.index("\n}\n\ncommand=", install_start) + 2
          install_function = r'''install_bundle() {
            local destination="${1:-}" root_physical
            [[ -n "${destination}" ]] || { echo "install requires a destination directory" >&2; exit 2; }
            verify_bundle
            require_command tar
            root_physical="$(cd "${ROOT_DIR}" && pwd -P)"
            destination="$(python3 - "${destination}" <<'PY'
          import sys
          from pathlib import Path
          print(Path(sys.argv[1]).expanduser().resolve(strict=False))
          PY
          )"
            case "${destination}/" in
              "${root_physical%/}/"*)
                echo "install destination must be outside the current bundle: ${destination}" >&2
                exit 2
                ;;
            esac
            mkdir -p "${destination}"
            destination="$(cd "${destination}" && pwd -P)"
            case "${destination}/" in
              "${root_physical%/}/"*)
                echo "install destination must be outside the current bundle: ${destination}" >&2
                exit 2
                ;;
            esac
            if find "${destination}" -mindepth 1 -maxdepth 1 -print -quit | grep -q .; then
              echo "install destination must be empty: ${destination}" >&2
              exit 1
            fi
            (cd "${ROOT_DIR}" && tar -cf - .) | (cd "${destination}" && tar -xf -)
            chmod 0755 "${destination}/edutalent-appliance"
            bash "${destination}/edutalent-appliance" verify
            echo "Installed and verified appliance at ${destination}"
          }'''
          launcher = launcher[:install_start] + install_function + launcher[install_end:]
          launcher_path.write_text(launcher, encoding="utf-8")

          validate_path = Path("scripts/appliance/validate.sh")
          validate = validate_path.read_text(encoding="utf-8")
          anchor = '''grep -Fq -- '--key' "${fixture}/cosign.log"

          mkdir -p "${fixture}/bundle/deploy/production/runtime/supabase"
          '''
          regression = '''grep -Fq -- '--key' "${fixture}/cosign.log"

          verifier_backup="${fixture}/release-manifest-verifier.original"
          cp "${fixture}/bundle/scripts/appliance/release_manifest.py" "${verifier_backup}"
          cat > "${fixture}/bundle/scripts/appliance/release_manifest.py" <<PY
          from pathlib import Path
          Path("${fixture}/malicious-verifier-ran").write_text("executed\\n", encoding="utf-8")
          raise SystemExit(0)
          PY
          if PATH="${fixture}/fake-bin:${PATH}" \\
            COSIGN_LOG="${fixture}/cosign.log" \\
            EDUTALENT_APPLIANCE_ALLOW_EPHEMERAL_SIGNATURES=true \\
            bash "${fixture}/bundle/edutalent-appliance" verify >/dev/null 2>&1; then
            echo "Appliance accepted an unauthenticated replacement verifier." >&2
            exit 1
          fi
          test ! -e "${fixture}/malicious-verifier-ran"
          mv "${verifier_backup}" "${fixture}/bundle/scripts/appliance/release_manifest.py"

          if PATH="${fixture}/fake-bin:${PATH}" \\
            COSIGN_LOG="${fixture}/cosign.log" \\
            EDUTALENT_APPLIANCE_ALLOW_EPHEMERAL_SIGNATURES=true \\
            bash "${fixture}/bundle/edutalent-appliance" install \\
              "${fixture}/bundle/installed-child" >/dev/null 2>&1; then
            echo "Appliance accepted an install destination inside its source bundle." >&2
            exit 1
          fi
          test ! -e "${fixture}/bundle/installed-child"

          mkdir -p "${fixture}/bundle/deploy/production/runtime/supabase"
          '''
          if validate.count(anchor) != 1:
              raise SystemExit("expected appliance security regression anchor exactly once")
          validate_path.write_text(validate.replace(anchor, regression), encoding="utf-8")
          PY

      - name: Run verifier bootstrap and full appliance regressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/appliance/edutalent-appliance
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit security corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/appliance/edutalent-appliance scripts/appliance/validate.sh
          git commit -m 'fix(appliance): authenticate verifier before execution'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feature/air-gapped-packaging-ghcr
