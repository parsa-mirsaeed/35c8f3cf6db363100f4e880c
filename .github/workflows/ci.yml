name: AI Change Proof

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-change-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edutalent_ci

jobs:
  classify:
    name: Classify change impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      workspace: ${{ steps.scope.outputs.workspace }}
      api: ${{ steps.scope.outputs.api }}
      web: ${{ steps.scope.outputs.web }}
      database: ${{ steps.scope.outputs.database }}
      packaging: ${{ steps.scope.outputs.packaging }}
      production: ${{ steps.scope.outputs.production }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      comparison: ${{ steps.scope.outputs.comparison }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - id: scope
        name: Detect affected systems
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          comparison=repository
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed-files.txt
            comparison=pull-request
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD > changed-files.txt
            comparison=commit
          else
            git ls-files > changed-files.txt
          fi

          sort -u changed-files.txt -o changed-files.txt

          # A validation-rule change can alter which proof is required for every
          # file in the pull request. Escalate it to the complete PR impact set.
          if [[ "$EVENT_NAME" == "pull_request" ]] && grep -Eq '^\.github/workflows/(ci|full-validation|package|production-foundation|air-gapped-appliance|mirror-final-proof)\.yml$' changed-files.txt; then
            git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed-files.txt
            sort -u changed-files.txt -o changed-files.txt
            comparison=pull-request-validation
          fi

          echo "Comparison mode: $comparison"
          cat changed-files.txt

          rust=false
          workspace=false
          api=false
          web=false
          database=false
          packaging=false
          production=false

          if grep -Eq '^(Cargo\.toml|Cargo\.lock|packages/)' changed-files.txt; then
            rust=true
          fi

          if grep -Eq '^(Cargo\.toml|Cargo\.lock|\.github/workflows/(ci|full-validation)\.yml)$' changed-files.txt; then
            rust=true
            workspace=true
            api=true
            web=true
            database=true
          fi

          if grep -Eq '^packages/api/' changed-files.txt; then
            api=true
          fi

          if grep -Eq '^packages/(web|ui)/' changed-files.txt; then
            web=true
          fi

          if grep -Eq '^packages/(desktop|mobile)/' changed-files.txt; then
            workspace=true
          fi

          if grep -Eq '^(migrations/|packages/api/migration/|scripts/ci/(apply_migrations|verify_knowledge_schema|verify_knowledge_security|verify_transaction_scoped_rls)\.sh)' changed-files.txt; then
            database=true
          fi

          if grep -Eq '^(Dockerfile(\.appliance-tools)?|compose(\.release)?\.yaml|edutalent|Makefile|\.dockerignore|\.env\.example|docker/|deploy/appliance/|scripts/appliance/|scripts/ci/apply_migrations\.sh|\.github/workflows/(package|air-gapped-appliance|mirror-final-proof)\.yml)' changed-files.txt; then
            packaging=true
          fi

          if grep -Eq '^(deploy/(production|appliance)/|scripts/appliance/|docs/(adr|security)/|packages/api/src/services/supabase_auth\.rs|scripts/ci/(apply_migrations|configure_database_role)\.sh|docker/entrypoint\.sh|Dockerfile(\.appliance-tools)?|edutalent|Makefile|\.github/workflows/(production-foundation|air-gapped-appliance|mirror-final-proof)\.yml)' changed-files.txt; then
            production=true
          fi

          docs_only=false
          if [[ "$rust" == false && "$database" == false && "$packaging" == false && "$production" == false ]]; then
            docs_only=true
          fi

          {
            echo "rust=$rust"
            echo "workspace=$workspace"
            echo "api=$api"
            echo "web=$web"
            echo "database=$database"
            echo "packaging=$packaging"
            echo "production=$production"
            echo "docs_only=$docs_only"
            echo "comparison=$comparison"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ai-change-files
          path: changed-files.txt
          if-no-files-found: error
          retention-days: 3

  formatting:
    name: Format changed Rust files
    needs: classify
    if: needs.classify.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/download-artifact@v4
        with:
          name: ai-change-files

      - id: rustfmt
        name: Generate exact rustfmt patch
        shell: bash
        run: |
          set -euo pipefail

          rust_files=()
          while IFS= read -r file; do
            if [[ "$file" == *.rs && -f "$file" ]]; then
              rust_files+=("$file")
            fi
          done < changed-files.txt

          : > rustfmt.patch
          if (( ${#rust_files[@]} == 0 )); then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "No changed Rust source files."
            exit 0
          fi

          rustfmt --edition 2021 --config skip_children=true "${rust_files[@]}"
          git diff -- "${rust_files[@]}" | tee rustfmt.patch

          if [[ -s rustfmt.patch ]]; then
            echo "clean=false" >> "$GITHUB_OUTPUT"
          else
            echo "clean=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload rustfmt diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diagnostics
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 7

      - name: Enforce formatting
        if: steps.rustfmt.outputs.clean != 'true'
        run: |
          echo "Changed Rust files require formatting; inspect rustfmt-diagnostics." >&2
          exit 1

  database:
    name: PostgreSQL migrations and invariants
    needs: classify
    if: needs.classify.outputs.api == 'true' || needs.classify.outputs.web == 'true' || needs.classify.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edutalent_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edutalent_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Verify PostgreSQL client tools
        run: |
          command -v psql
          command -v pg_dump
          command -v pg_restore

      - name: Apply migrations transactionally
        run: |
          set -o pipefail
          bash scripts/ci/apply_migrations.sh 2>&1 | tee migration.log

      - name: Replay migrations to prove idempotence
        run: |
          set -o pipefail
          bash scripts/ci/apply_migrations.sh 2>&1 | tee -a migration.log

      - name: Verify governed knowledge schema and lifecycle
        run: |
          set -o pipefail
          bash scripts/ci/verify_knowledge_schema.sh 2>&1 | tee schema-verification.log

      - name: Verify governed knowledge security
        run: |
          set -o pipefail
          bash scripts/ci/verify_knowledge_security.sh 2>&1 | tee security-verification.log

      - name: Export verified schema
        run: pg_dump --format=custom --no-owner --no-acl --file=edutalent-ci-schema.dump "$DATABASE_URL"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-change-database
          path: |
            migration.log
            schema-verification.log
            security-verification.log
            edutalent-ci-schema.dump
          if-no-files-found: warn
          retention-days: 3

  targeted-rust:
    name: Affected Rust checks and tests
    needs:
      - classify
      - formatting
      - database
    if: >-
      always() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.rust == 'true' &&
      (needs.formatting.result == 'success' || needs.formatting.result == 'skipped') &&
      (needs.database.result == 'success' || needs.database.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edutalent_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edutalent_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ai-change-rust
          cache-on-failure: true
          save-if: ${{ github.event_name == 'workflow_dispatch' }}

      - uses: actions/download-artifact@v4
        if: needs.database.result == 'success'
        with:
          name: ai-change-database

      - name: Restore verified schema
        if: needs.database.result == 'success'
        run: pg_restore --clean --if-exists --no-owner --no-acl --dbname="$DATABASE_URL" edutalent-ci-schema.dump

      - name: Check, lint, and test affected packages
        shell: bash
        env:
          WORKSPACE_CHANGED: ${{ needs.classify.outputs.workspace }}
          API_CHANGED: ${{ needs.classify.outputs.api }}
          WEB_CHANGED: ${{ needs.classify.outputs.web }}
        run: |
          set -euo pipefail

          if [[ "$WORKSPACE_CHANGED" == "true" ]]; then
            cargo check --workspace --all-targets --locked --message-format=short
            cargo check -p api --features server --all-targets --locked --message-format=short
            cargo clippy -p api --features server --lib --tests --locked --message-format=short -- \
              -A warnings -D clippy::correctness -D clippy::suspicious
            cargo test -p api --features server --lib --locked
            cargo check -p web --features server --all-targets --locked --message-format=short
            cargo clippy -p web --features server --all-targets --locked --message-format=short -- \
              -A warnings -D clippy::correctness -D clippy::suspicious
            cargo test -p web --features server --locked
            exit 0
          fi

          if [[ "$API_CHANGED" == "true" ]]; then
            cargo check -p api --features server --all-targets --locked --message-format=short
            cargo clippy -p api --features server --lib --tests --locked --message-format=short -- \
              -A warnings -D clippy::correctness -D clippy::suspicious
            cargo test -p api --features server --lib --locked
            cargo check -p web --features server --all-targets --locked --message-format=short
          fi

          if [[ "$WEB_CHANGED" == "true" ]]; then
            if [[ "$API_CHANGED" != "true" ]]; then
              cargo check -p web --features server --all-targets --locked --message-format=short
            fi
            cargo clippy -p web --features server --all-targets --locked --message-format=short -- \
              -A warnings -D clippy::correctness -D clippy::suspicious
            cargo test -p web --features server --locked
          fi

  gate:
    name: AI change gate
    if: always()
    needs:
      - classify
      - formatting
      - database
      - targeted-rust
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce required outcomes and write evidence
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMPARISON_MODE: ${{ needs.classify.outputs.comparison }}
          RUST_REQUIRED: ${{ needs.classify.outputs.rust }}
          DATABASE_REQUIRED: ${{ needs.classify.outputs.api == 'true' || needs.classify.outputs.web == 'true' || needs.classify.outputs.database == 'true' }}
          PACKAGE_REQUIRED: ${{ needs.classify.outputs.packaging }}
          PRODUCTION_REQUIRED: ${{ needs.classify.outputs.production }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FORMAT_RESULT: ${{ needs.formatting.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          RUST_RESULT: ${{ needs.targeted-rust.result }}
        run: |
          set -euo pipefail

          test "$CLASSIFY_RESULT" = "success"

          require_success() {
            local required="$1"
            local result="$2"
            local name="$3"
            if [[ "$required" == "true" ]]; then
              test "$result" = "success" || {
                echo "$name was required but concluded: $result" >&2
                exit 1
              }
            else
              case "$result" in
                success|skipped) ;;
                *) echo "$name unexpectedly concluded: $result" >&2; exit 1 ;;
              esac
            fi
          }

          require_success "$RUST_REQUIRED" "$FORMAT_RESULT" "formatting"
          require_success "$DATABASE_REQUIRED" "$DATABASE_RESULT" "database"
          require_success "$RUST_REQUIRED" "$RUST_RESULT" "targeted Rust"

          cat > ai-change-evidence.json <<EOF
          {
            "head_sha": "${HEAD_SHA}",
            "comparison_mode": "${COMPARISON_MODE}",
            "required": {
              "rust": ${RUST_REQUIRED},
              "database": ${DATABASE_REQUIRED},
              "package_workflow": ${PACKAGE_REQUIRED},
              "production_workflow": ${PRODUCTION_REQUIRED}
            },
            "results": {
              "classification": "${CLASSIFY_RESULT}",
              "formatting": "${FORMAT_RESULT}",
              "database": "${DATABASE_RESULT}",
              "rust": "${RUST_RESULT}"
            }
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: ai-change-evidence
          path: ai-change-evidence.json
          if-no-files-found: error
          retention-days: 14
