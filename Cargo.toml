[workspace]
resolver = "2"
members = ["packages/ui", "packages/web", "packages/api"]

[workspace.dependencies]
# Dioxus core
dioxus = { version = "0.7.2", features = ["fullstack"] }
dioxus-logger = "0.7.2"

# Database
sqlx = { version = "0.8.0", features = [
    "runtime-tokio-rustls",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
] }

# Serialization
serde = { version = "1.0.190", features = ["derive"] }
serde_json = "1.0.108"

# Authentication & Security
jsonwebtoken = "9.2.0"
supabase_rs = { version = "0.5.0", default-features = false, features = [
    "rustls",
] }
bcrypt = "0.15.0"
base64 = "0.22.0"

# Network types
ipnetwork = "0.21"

# HTTP & Networking
# Keep the 0.11 API used by the application, but use the system TLS backend so
# the unmaintained rustls 0.21/webpki 0.101 branch is not in the runtime graph.
reqwest = { version = "0.11.27", default-features = false, features = [
    "json",
    "stream",
    "native-tls",
] }

# Async helpers
futures = "0.3"
uuid = { version = "1.6.1", features = ["v4", "serde"] }
chrono = { version = "0.4.31", features = ["serde"] }

# Async & Runtime
tokio = { version = "1.35.0", features = ["full"] }
tower = "0.4.13"
tower-http = { version = "0.5.0", features = [
    "cors",
    "trace",
    "compression-full",
] }

# Logging & Tracing
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Validation & Utilities
validator = { version = "0.18.0", features = ["derive"] }
anyhow = "1.0.75"
thiserror = "1.0.50"
once_cell = "1.19.0"

# Environment & Configuration
dotenvy = "0.15.7"
config = "0.14.0"

# Additional server dependencies
axum = "0.8.7"
async-trait = "0.1.74"
rand = "0.8.5"
sha2 = "0.10.8"
regex = "1.10.2"

# workspace
ui = { path = "packages/ui" }
api = { path = "packages/api" }

[profile.dev]
incremental = true
opt-level = 0
debug = 0                    # Speed up linking
split-debuginfo = "unpacked"

[profile.release]
opt-level = "z"         # Optimize for size to help wasm-opt
lto = true
codegen-units = 1
panic = "abort"
debug = false           # No debug info - fixes wasm-opt DWARF errors
split-debuginfo = "off" # Avoid DWARF issues with wasm-opt
