name: Update Security Dependencies

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main

permissions:
  contents: write

jobs:
  update-lock:
    if: github.head_ref == 'feature/production-operations' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-operations
          fetch-depth: 0
          show-progress: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve patched HTTP, QUIC, and TLS dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p reqwest@0.11.27 --precise 0.12.24
          cargo update -p quinn-proto@0.11.13 --precise 0.11.15
          cargo update -p rustls-webpki@0.103.8 --precise 0.103.13
          ! grep -Fq 'version = "0.11.13"' Cargo.lock
          ! grep -Fq 'version = "0.101.7"' Cargo.lock
          ! grep -Fq 'version = "0.103.8"' Cargo.lock
          cargo check -p api --features server --locked --message-format=short
          git diff --check

      - name: Commit resolved lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git diff --cached --quiet && { echo 'No lockfile update produced.' >&2; exit 1; }
          git commit -m 'fix: update vulnerable HTTP and TLS dependencies'
          git push origin HEAD:feature/production-operations
