name: Run appliance state hardening

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/run-appliance-state-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute reviewed transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_lines = Path(".github/workflows/apply-appliance-state-hardening.yml").read_text(encoding="utf-8").splitlines()
          step = workflow_lines.index("      - name: Apply external-state and scanner corrections")
          run_line = workflow_lines.index("        run: |", step)
          next_step = next(
              index for index in range(run_line + 1, len(workflow_lines))
              if workflow_lines[index].startswith("      - name:")
          )
          script_lines = workflow_lines[run_line + 1:next_step]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script_lines) + "\n"

          replacements = (
              (
                  '''if text.count(old_production) != 1:
              raise SystemExit("appliance production function changed unexpectedly")
          text = text.replace(old_production, new_production, 1)
          ''',
                  '''production_start = text.index("production() {")
          init_start = text.index("init_secrets() {", production_start)
          text = text[:production_start] + new_production.rstrip("\\n") + "\\n\\n" + text[init_start:]
          ''',
                  "production guard",
              ),
              (
                  '''if text.count(old_init) != 1:
              raise SystemExit("appliance init function changed unexpectedly")
          text = text.replace(old_init, new_init, 1)
          ''',
                  '''init_start = text.index("init_secrets() {", production_start)
          install_start = text.index("install_bundle() {", init_start)
          text = text[:init_start] + new_init.rstrip("\\n") + "\\n\\n" + text[install_start:]
          ''',
                  "init guard",
              ),
              (
                  '''if text.count(old_install) != 1:
              raise SystemExit("appliance install copy changed unexpectedly")
          text = text.replace(old_install, new_install, 1)
          ''',
                  '''copy_start = text.index('  (cd "${ROOT_DIR}" && tar ', install_start)
          chmod_start = text.index('  chmod 0755 "${destination}/edutalent-appliance"', copy_start)
          text = text[:copy_start] + new_install.rstrip("\\n") + "\\n" + text[chmod_start:]
          ''',
                  "install guard",
              ),
              (
                  '''if text.count(old_checks) != 1:
              raise SystemExit("appliance checks block changed unexpectedly")
          launcher.write_text(text.replace(old_checks, new_checks, 1), encoding="utf-8")
          ''',
                  '''checks_start = text.index("  checks)")
          help_start = text.index("  help|-h|--help)", checks_start)
          text = text[:checks_start] + new_checks.rstrip("\\n") + "\\n" + text[help_start:]
          launcher.write_text(text, encoding="utf-8")
          ''',
                  "checks guard",
              ),
              (
                  '''if text.count(old_smoke_paths) != 1:
              raise SystemExit("offline smoke path block changed unexpectedly")
          text = text.replace(old_smoke_paths, new_smoke_paths, 1)
          ''',
                  '''paths_start = text.index('production_dir="${bundle}/deploy/production"')
          started_start = text.index("started=false", paths_start)
          text = text[:paths_start] + new_smoke_paths.rstrip("\\n") + "\\n" + text[started_start:]
          ''',
                  "smoke paths guard",
              ),
              (
                  '''if text.count(old_cleanup) != 1:
              raise SystemExit("offline smoke cleanup changed unexpectedly")
          text = text.replace(old_cleanup, new_cleanup, 1)
          ''',
                  '''cleanup_start = text.index("cleanup() {")
          cleanup_rm_start = text.index('  rm -rf "${tls_dir}"', cleanup_start)
          cleanup_end = text.index("\\n}", cleanup_rm_start)
          text = text[:cleanup_rm_start] + new_cleanup.rstrip("\\n") + text[cleanup_end:]
          ''',
                  "smoke cleanup guard",
              ),
              (
                  '''if text.count(old_copy) != 1:
              raise SystemExit("offline smoke environment setup changed unexpectedly")
          text = text.replace(old_copy, new_copy, 1)
          ''',
                  '''copy_start = text.index('cp "${production_dir}/.env.edutalent.example"')
          python_start = text.index('python3 - "${app_env}"', copy_start)
          text = text[:copy_start] + new_copy.rstrip("\\n") + "\\n" + text[python_start:]
          ''',
                  "smoke environment guard",
              ),
              (
                  '''if text.count(old_rm) != 1:
              raise SystemExit("offline smoke init block changed unexpectedly")
          smoke.write_text(text.replace(old_rm, new_rm, 1), encoding="utf-8")
          ''',
                  '''init_start = text.index('rm -f "${supabase_env}"')
          started_at = text.index('started_at="$(date --iso-8601=seconds)"', init_start)
          text = text[:init_start] + new_rm.rstrip("\\n") + "\\n\\n" + text[started_at:]
          smoke.write_text(text, encoding="utf-8")
          ''',
                  "smoke init guard",
              ),
              (
                  '''if text.count(old_mutable_fixture) != 1:
              raise SystemExit("mutable environment fixture changed unexpectedly")
          text = text.replace(old_mutable_fixture, new_mutable_fixture, 1)
          ''',
                  '''fixture_start = text.index('mkdir -p "${fixture}/bundle/deploy/production/runtime/supabase"')
          mode_test_start = text.index('chmod 0755 "${fixture}/bundle/sbom/images/fixture.spdx.json"', fixture_start)
          text = text[:fixture_start] + new_mutable_fixture.rstrip("\\n") + "\\n" + text[mode_test_start:]
          ''',
                  "mutable environment fixture guard",
              ),
          )
          for old, new, label in replacements:
              if script.count(old) != 1:
                  raise SystemExit(f"unable to replace {label}")
              script = script.replace(old, new, 1)

          escaped_fixture_literals = (
              (
                  r'candidate.write_text("TOKEN=fixture\n", encoding="utf-8")',
                  r'candidate.write_text("TOKEN=fixture\\n", encoding="utf-8")',
              ),
              (
                  r'example.write_text("TOKEN=\n", encoding="utf-8")',
                  r'example.write_text("TOKEN=\\n", encoding="utf-8")',
              ),
              (
                  r'b"-----BEGIN OPENSSH PRIVATE KEY-----\n")',
                  r'b"-----BEGIN OPENSSH PRIVATE KEY-----\\n")',
              ),
              (
                  r'b"postgresql://user:password@db.internal/app\n")',
                  r'b"postgresql://user:password@db.internal/app\\n")',
              ),
          )
          for old, new in escaped_fixture_literals:
              if script.count(old) != 1:
                  raise SystemExit(f"unable to escape scanner fixture literal: {old}")
              script = script.replace(old, new, 1)

          Path("/tmp/apply-state-hardening.sh").write_text(script, encoding="utf-8")
          PY
          bash /tmp/apply-state-hardening.sh

      - name: Validate complete appliance definitions
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            deploy/appliance/edutalent-appliance \
            deploy/production/edutalent-production \
            deploy/production/generate-secrets.sh \
            scripts/appliance/offline_smoke.sh \
            scripts/appliance/validate.sh
          python3 -m py_compile scripts/appliance/release_manifest.py
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit source-only corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            deploy/appliance/edutalent-appliance \
            deploy/production/edutalent-production \
            deploy/production/generate-secrets.sh \
            scripts/appliance/offline_smoke.sh \
            scripts/appliance/release_manifest.py \
            scripts/appliance/validate.sh
          git commit -m 'fix(appliance): externalize runtime state and scan all payloads'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
