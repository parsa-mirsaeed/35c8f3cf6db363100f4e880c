name: Fix bundle root resolution

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/fix-bundle-root-resolution.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Prefer packaged verifier over repository ancestors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          launcher_path = Path("deploy/appliance/edutalent-appliance")
          launcher = launcher_path.read_text(encoding="utf-8")
          old = '''SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          if [[ -f "${SCRIPT_DIR}/../../scripts/appliance/release_manifest.py" ]]; then
            ROOT_DIR="$(cd "${SCRIPT_DIR}/../.." && pwd)"
          else
            ROOT_DIR="${SCRIPT_DIR}"
          fi
          '''
          new = '''SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          if [[ -f "${SCRIPT_DIR}/scripts/appliance/release_manifest.py" ]]; then
            # A packaged appliance is self-contained. Prefer its verifier even when the
            # bundle happens to live below a repository-shaped ancestor such as dist/.
            ROOT_DIR="${SCRIPT_DIR}"
          elif [[ -f "${SCRIPT_DIR}/../../scripts/appliance/release_manifest.py" ]]; then
            ROOT_DIR="$(cd "${SCRIPT_DIR}/../.." && pwd)"
          else
            ROOT_DIR="${SCRIPT_DIR}"
          fi
          '''
          if launcher.count(old) != 1:
              raise SystemExit("expected launcher root-resolution block exactly once")
          launcher_path.write_text(launcher.replace(old, new), encoding="utf-8")

          validate_path = Path("scripts/appliance/validate.sh")
          validate = validate_path.read_text(encoding="utf-8")
          anchor = '''PATH="${fixture}/fake-bin:${PATH}" \\
            COSIGN_LOG="${fixture}/cosign.log" \\
            EDUTALENT_APPLIANCE_ALLOW_EPHEMERAL_SIGNATURES=true \\
            bash "${fixture}/bundle/edutalent-appliance" verify >/dev/null
          grep -Fq -- '--key' "${fixture}/cosign.log"

          '''
          replacement = anchor + '''mkdir -p \\
            "${fixture}/repository/scripts/appliance" \\
            "${fixture}/repository/dist"
          cp "${ROOT_DIR}/scripts/appliance/release_manifest.py" \\
            "${fixture}/repository/scripts/appliance/release_manifest.py"
          cp -a "${fixture}/bundle" "${fixture}/repository/dist/packaged-appliance"
          : > "${fixture}/cosign.log"
          PATH="${fixture}/fake-bin:${PATH}" \\
            COSIGN_LOG="${fixture}/cosign.log" \\
            EDUTALENT_APPLIANCE_ALLOW_EPHEMERAL_SIGNATURES=true \\
            bash "${fixture}/repository/dist/packaged-appliance/edutalent-appliance" verify >/dev/null
          grep -Fq -- '--key' "${fixture}/cosign.log"

          '''
          if validate.count(anchor) != 1:
              raise SystemExit("expected ephemeral launcher validation anchor exactly once")
          validate_path.write_text(validate.replace(anchor, replacement), encoding="utf-8")
          PY

      - name: Run exact path-resolution and full appliance regressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/appliance/edutalent-appliance
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit bundle root correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/appliance/edutalent-appliance scripts/appliance/validate.sh
          git commit -m 'fix(appliance): prefer packaged verification root'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feature/air-gapped-packaging-ghcr
