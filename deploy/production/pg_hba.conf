# EduTalent production PostgreSQL client authentication policy.
# This preserves the pinned Supabase self-hosted defaults and adds narrowly
# scoped physical-replication paths for recovery and continuous WAL capture.

local all  supabase_admin     trust
local all  all                peer map=supabase_map

# In-container recovery tooling may take physical backups over loopback as the
# constrained postgres role. The long-running receiver never shares this
# trusted network namespace.
host  replication  postgres  127.0.0.1/32  scram-sha-256

# The continuous receiver uses a dedicated LOGIN REPLICATION role. It is
# explicitly barred from ordinary SQL sessions before the general host rules,
# while physical replication is permitted only from private Docker ranges.
host  all          edutalent_backup  0.0.0.0/0       reject
host  all          edutalent_backup  ::0/0           reject
host  replication  edutalent_backup  10.0.0.0/8      scram-sha-256
host  replication  edutalent_backup  172.16.0.0/12   scram-sha-256
host  replication  edutalent_backup  192.168.0.0/16  scram-sha-256

host  all  all  127.0.0.1/32  trust
host  all  all  ::1/128       trust

host  all  all  10.0.0.0/8      scram-sha-256
host  all  all  172.16.0.0/12   scram-sha-256
host  all  all  192.168.0.0/16  scram-sha-256
host  all  all  0.0.0.0/0       scram-sha-256
host  all  all  ::0/0           scram-sha-256
