# Trigger after the workflow exists on the pull-request branch.
name: Harden Supabase permission fix

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/harden-supabase-permission-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Restrict normalization to fresh upstream definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper_path = Path("deploy/production/normalize-supabase-runtime-permissions.sh")
          helper = helper_path.read_text(encoding="utf-8")
          helper = helper.replace(
              '[[ -n "${runtime_dir}" && -d "${runtime_dir}" ]] || {\n  echo "Usage: normalize-supabase-runtime-permissions.sh <runtime-directory>" >&2\n  exit 2\n}\n\n',
              '[[ -n "${runtime_dir}" && -d "${runtime_dir}" ]] || {\n  echo "Usage: normalize-supabase-runtime-permissions.sh <fresh-upstream-directory>" >&2\n  exit 2\n}\n[[ ! -e "${runtime_dir}/.env" ]] || {\n  echo "Refusing to normalize an initialized Supabase runtime containing .env." >&2\n  exit 1\n}\n\n',
              1,
          )
          helper = helper.replace(
              '# The pinned runtime contains immutable public definitions only. Secrets are\n# generated later and retain mode 0600. Restore read/search access that a\n# strict caller umask may remove while preserving upstream executable bits.',
              '# This helper is restricted to the fresh pinned upstream checkout. Secrets and\n# mutable installation state do not exist yet. Restore read/search access that a\n# strict caller umask may remove while preserving upstream executable bits.',
              1,
          )
          if 'Refusing to normalize an initialized Supabase runtime containing .env.' not in helper:
              raise SystemExit("failed to add initialized-runtime guard")
          helper_path.write_text(helper, encoding="utf-8")

          bootstrap_path = Path("deploy/production/bootstrap-supabase.sh")
          bootstrap = bootstrap_path.read_text(encoding="utf-8")
          bootstrap = bootstrap.replace(
              '    if [[ "${actual}" == "${commit}" ]]; then\n      bash "${PERMISSIONS_HELPER}" "${RUNTIME_DIR}"\n      configure_ci_database_volume',
              '    if [[ "${actual}" == "${commit}" ]]; then\n      configure_ci_database_volume',
              1,
          )
          bootstrap = bootstrap.replace(
              'cp -a "${temporary}/docker" "${RUNTIME_DIR}"\nprintf \'%s\\n\' "${commit}" > "${RUNTIME_DIR}/UPSTREAM_COMMIT"\nbash "${PERMISSIONS_HELPER}" "${RUNTIME_DIR}"\nconfigure_ci_database_volume',
              'bash "${PERMISSIONS_HELPER}" "${temporary}/docker"\ncp -a "${temporary}/docker" "${RUNTIME_DIR}"\nprintf \'%s\\n\' "${commit}" > "${RUNTIME_DIR}/UPSTREAM_COMMIT"\nconfigure_ci_database_volume',
              1,
          )
          if bootstrap.count('bash "${PERMISSIONS_HELPER}"') != 1:
              raise SystemExit("permission helper must run exactly once")
          if 'bash "${PERMISSIONS_HELPER}" "${temporary}/docker"' not in bootstrap:
              raise SystemExit("permission helper is not restricted to the temporary checkout")
          bootstrap_path.write_text(bootstrap, encoding="utf-8")

          validate_path = Path("scripts/appliance/validate.sh")
          validate = validate_path.read_text(encoding="utf-8")
          anchor = 'test "$(stat -c %a "${fixture}/outside.txt")" = "600"\n\nmkdir -p \\\n'
          replacement = '''test "$(stat -c %a "${fixture}/outside.txt")" = "600"

          initialized_fixture="${fixture}/initialized-runtime"
          mkdir -p "${initialized_fixture}"
          printf 'POSTGRES_PASSWORD=fixture-secret\\n' > "${initialized_fixture}/.env"
          chmod 0600 "${initialized_fixture}/.env"
          if bash "${ROOT_DIR}/deploy/production/normalize-supabase-runtime-permissions.sh" \\
            "${initialized_fixture}" >/dev/null 2>&1; then
            echo "Runtime permission normalization accepted an initialized runtime." >&2
            exit 1
          fi
          test "$(stat -c %a "${initialized_fixture}/.env")" = "600"

          mkdir -p \\
'''
          if validate.count(anchor) != 1:
              raise SystemExit("expected initialized-runtime regression anchor exactly once")
          validate_path.write_text(validate.replace(anchor, replacement), encoding="utf-8")
          PY
          rm .github/workflows/harden-supabase-permission-fix.yml

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/production/bootstrap-supabase.sh
          bash -n deploy/production/normalize-supabase-runtime-permissions.sh
          bash -n scripts/appliance/build.sh
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit hardened correction and regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add deploy/production/bootstrap-supabase.sh \
            deploy/production/normalize-supabase-runtime-permissions.sh \
            scripts/appliance/validate.sh \
            .github/workflows/harden-supabase-permission-fix.yml
          git commit -m 'fix(appliance): limit runtime chmod to fresh checkout'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feature/air-gapped-packaging-ghcr
