name: Fix generated production state

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/fix-generated-production-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Implement fail-closed production release staging
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/appliance/stage_production.py <<'PY'
          #!/usr/bin/env python3
          """Stage production definitions without copying mutable installation state."""

          from __future__ import annotations

          import argparse
          import shutil
          import sys
          from pathlib import Path


          SOURCE_MUTABLE_FILES = frozenset({Path(".env.edutalent")})
          RELEASE_MUTABLE_FILES = frozenset(
              {
                  Path(".env.edutalent"),
                  Path("runtime/supabase/.env"),
              }
          )
          RELEASE_IGNORED_DIRECTORIES = frozenset({Path("runtime/supabase/.git")})
          RELEASE_FORBIDDEN_BACKUPS = frozenset(
              {
                  Path("runtime/supabase/.env.old"),
                  Path("runtime/supabase/docker-compose.yml.old"),
                  Path("runtime/supabase/docker-compose.yml.edutalent-backup"),
              }
          )
          RELEASE_ALLOWED_DOTENV = frozenset({Path(".env.edutalent.example")})


          def is_within(relative: Path, roots: frozenset[Path]) -> bool:
              return any(relative == root or root in relative.parents for root in roots)


          def validate_entries(source: Path) -> None:
              for path in source.rglob("*"):
                  relative = path.relative_to(source)
                  if path.is_symlink():
                      raise RuntimeError(f"production source contains a symlink: {relative}")
                  if not path.is_dir() and not path.is_file():
                      raise RuntimeError(
                          f"production source contains a non-regular entry: {relative}"
                      )


          def validate_release_source(source: Path) -> None:
              for path in source.rglob("*"):
                  relative = path.relative_to(source)
                  if is_within(relative, RELEASE_IGNORED_DIRECTORIES):
                      continue
                  if relative in RELEASE_FORBIDDEN_BACKUPS:
                      raise RuntimeError(
                          f"production source retains a generated backup: {relative}"
                      )
                  if not path.is_file() or relative in RELEASE_MUTABLE_FILES:
                      continue
                  name = path.name
                  if name == ".env" or name.startswith(".env."):
                      if name == ".env.example" or relative in RELEASE_ALLOWED_DOTENV:
                          continue
                      raise RuntimeError(
                          f"production source contains an unexpected dotenv file: {relative}"
                      )


          def stage_production(source: Path, destination: Path, mode: str) -> None:
              source = source.resolve()
              destination = destination.resolve()
              if not source.is_dir():
                  raise RuntimeError("production source does not exist")
              if destination.exists():
                  raise RuntimeError("production staging destination already exists")

              validate_entries(source)
              if mode == "release":
                  validate_release_source(source)

              def ignore(directory: str, names: list[str]) -> set[str]:
                  relative = Path(directory).resolve().relative_to(source)
                  ignored: set[str] = set()
                  for name in names:
                      candidate = relative / name
                      if mode == "source":
                          if candidate in SOURCE_MUTABLE_FILES:
                              ignored.add(name)
                          elif relative == Path("runtime") and name == "supabase":
                              ignored.add(name)
                      else:
                          if candidate in RELEASE_MUTABLE_FILES:
                              ignored.add(name)
                          elif candidate in RELEASE_IGNORED_DIRECTORIES:
                              ignored.add(name)
                  return ignored

              shutil.copytree(
                  source,
                  destination,
                  ignore=ignore,
                  copy_function=shutil.copy2,
              )


          def parse_args() -> argparse.Namespace:
              parser = argparse.ArgumentParser()
              parser.add_argument("--source", required=True, type=Path)
              parser.add_argument("--destination", required=True, type=Path)
              parser.add_argument(
                  "--mode",
                  choices=("source", "release"),
                  default="source",
              )
              return parser.parse_args()


          def main() -> int:
              args = parse_args()
              stage_production(args.source, args.destination, args.mode)
              return 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except (OSError, RuntimeError, ValueError) as error:
                  print(f"production staging error: {error}", file=sys.stderr)
                  raise SystemExit(1)
          PY

          python3 - <<'PY'
          from pathlib import Path

          build_path = Path("scripts/appliance/build.sh")
          build = build_path.read_text(encoding="utf-8")
          old_build = '''mkdir -p "${BUNDLE_DIR}/deploy"
          cp -a "${PRODUCTION_DIR}" "${BUNDLE_DIR}/deploy/production"
          rm -f \\
            "${BUNDLE_DIR}/deploy/production/.env.edutalent" \\
            "${BUNDLE_DIR}/deploy/production/runtime/supabase/.env" \\
            "${BUNDLE_DIR}/deploy/production/runtime/supabase/docker-compose.yml.edutalent-backup"
          rm -rf "${BUNDLE_DIR}/deploy/production/runtime/supabase/.git"
          '''
          new_build = '''mkdir -p "${BUNDLE_DIR}/deploy"
          python3 "${ROOT_DIR}/scripts/appliance/stage_production.py" \\
            --source "${PRODUCTION_DIR}" \\
            --destination "${BUNDLE_DIR}/deploy/production" \\
            --mode release
          '''
          if build.count(old_build) != 1:
              raise SystemExit("expected appliance production copy block exactly once")
          build_path.write_text(build.replace(old_build, new_build), encoding="utf-8")

          secrets_path = Path("deploy/production/generate-secrets.sh")
          secrets = secrets_path.read_text(encoding="utf-8")
          anchor = 'APP_TEMPLATE="${SCRIPT_DIR}/.env.edutalent.example"\n'
          replacement = anchor + '''UPSTREAM_ENV_BACKUP="${SUPABASE_DIR}/.env.old"
          UPSTREAM_COMPOSE_BACKUP="${SUPABASE_COMPOSE}.old"
          '''
          if secrets.count(anchor) != 1:
              raise SystemExit("expected generate-secrets variable anchor exactly once")
          secrets = secrets.replace(anchor, replacement)

          old_cleanup = '''cp "${SUPABASE_COMPOSE}" "${SUPABASE_COMPOSE_BACKUP}"
          initialization_complete=false
          cleanup_partial_initialization() {
            if [[ "${initialization_complete}" != true ]]; then
          '''
          new_cleanup = '''cp "${SUPABASE_COMPOSE}" "${SUPABASE_COMPOSE_BACKUP}"
          initialization_complete=false
          cleanup_upstream_backups() {
            rm -f -- "${UPSTREAM_ENV_BACKUP}" "${UPSTREAM_COMPOSE_BACKUP}"
          }
          cleanup_partial_initialization() {
            cleanup_upstream_backups
            if [[ "${initialization_complete}" != true ]]; then
          '''
          if secrets.count(old_cleanup) != 1:
              raise SystemExit("expected generate-secrets cleanup block exactly once")
          secrets = secrets.replace(old_cleanup, new_cleanup)

          old_tools = '''  sh utils/generate-keys.sh --update-env >/dev/null
            sh utils/add-new-auth-keys.sh --update-env >/dev/null
          )

          set_env "${SUPABASE_ENV}" SUPABASE_PUBLIC_URL'''
          new_tools = '''  sh utils/generate-keys.sh --update-env >/dev/null
            sh utils/add-new-auth-keys.sh --update-env >/dev/null
          )
          cleanup_upstream_backups

          set_env "${SUPABASE_ENV}" SUPABASE_PUBLIC_URL'''
          if secrets.count(old_tools) != 1:
              raise SystemExit("expected upstream key utility block exactly once")
          secrets = secrets.replace(old_tools, new_tools)

          old_success = '''chmod 600 "${SUPABASE_ENV}" "${APP_ENV}"

          initialization_complete=true
          rm -f "${SUPABASE_COMPOSE_BACKUP}"
          trap - EXIT
          '''
          new_success = '''chmod 600 "${SUPABASE_ENV}" "${APP_ENV}"

          cleanup_upstream_backups
          initialization_complete=true
          rm -f "${SUPABASE_COMPOSE_BACKUP}"
          trap - EXIT
          '''
          if secrets.count(old_success) != 1:
              raise SystemExit("expected generate-secrets success block exactly once")
          secrets_path.write_text(secrets.replace(old_success, new_success), encoding="utf-8")

          validate_path = Path("scripts/appliance/validate.sh")
          validate = validate_path.read_text(encoding="utf-8")
          static_anchor = '''grep -Fq 'stage_production.py' "${ROOT_DIR}/scripts/appliance/build.sh"
          '''
          static_replacement = static_anchor + '''grep -Fq -- '--mode release' "${ROOT_DIR}/scripts/appliance/build.sh"
          grep -Fq 'cleanup_upstream_backups' "${ROOT_DIR}/deploy/production/generate-secrets.sh"
          grep -Fq 'UPSTREAM_ENV_BACKUP="${SUPABASE_DIR}/.env.old"' "${ROOT_DIR}/deploy/production/generate-secrets.sh"
          grep -Fq 'UPSTREAM_COMPOSE_BACKUP="${SUPABASE_COMPOSE}.old"' "${ROOT_DIR}/deploy/production/generate-secrets.sh"
          '''
          if validate.count(static_anchor) != 1:
              raise SystemExit("expected appliance static validation anchor exactly once")
          validate = validate.replace(static_anchor, static_replacement)

          behavior_anchor = '''grep -Fxq 'live app state' "${fixture}/production-source/.env.edutalent"
          grep -Fxq 'live supabase state' "${fixture}/production-source/runtime/supabase/.env"

          '''
          behavior_replacement = behavior_anchor + '''mkdir -p \\
            "${fixture}/release-source/runtime/supabase/.git" \\
            "${fixture}/release-source/runtime/keep"
          printf 'release definition\\n' > "${fixture}/release-source/keep.txt"
          printf 'generated app secret\\n' > "${fixture}/release-source/.env.edutalent"
          printf 'APP_DOMAIN=\\n' > "${fixture}/release-source/.env.edutalent.example"
          printf 'generated Supabase secret\\n' > "${fixture}/release-source/runtime/supabase/.env"
          printf 'JWT_SECRET=\\n' > "${fixture}/release-source/runtime/supabase/.env.example"
          printf 'services: {}\\n' > "${fixture}/release-source/runtime/supabase/docker-compose.yml"
          printf 'upstream metadata\\n' > "${fixture}/release-source/runtime/supabase/.git/config"
          python3 "${ROOT_DIR}/scripts/appliance/stage_production.py" \\
            --source "${fixture}/release-source" \\
            --destination "${fixture}/release-staged" \\
            --mode release
          test -f "${fixture}/release-staged/keep.txt"
          test -f "${fixture}/release-staged/.env.edutalent.example"
          test -f "${fixture}/release-staged/runtime/supabase/.env.example"
          test ! -e "${fixture}/release-staged/.env.edutalent"
          test ! -e "${fixture}/release-staged/runtime/supabase/.env"
          test ! -e "${fixture}/release-staged/runtime/supabase/.git"

          printf 'stale secret backup\\n' > "${fixture}/release-source/runtime/supabase/.env.old"
          if python3 "${ROOT_DIR}/scripts/appliance/stage_production.py" \\
            --source "${fixture}/release-source" \\
            --destination "${fixture}/release-rejected-env-old" \\
            --mode release >/dev/null 2>&1; then
            echo "Release staging accepted a generated Supabase .env.old backup." >&2
            exit 1
          fi
          rm -f "${fixture}/release-source/runtime/supabase/.env.old"
          printf 'stale compose backup\\n' > "${fixture}/release-source/runtime/supabase/docker-compose.yml.old"
          if python3 "${ROOT_DIR}/scripts/appliance/stage_production.py" \\
            --source "${fixture}/release-source" \\
            --destination "${fixture}/release-rejected-compose-old" \\
            --mode release >/dev/null 2>&1; then
            echo "Release staging accepted a generated Supabase Compose backup." >&2
            exit 1
          fi
          rm -f "${fixture}/release-source/runtime/supabase/docker-compose.yml.old"

          secret_fixture="${fixture}/secret-generation"
          mkdir -p "${secret_fixture}/runtime/supabase/utils"
          cp "${ROOT_DIR}/deploy/production/generate-secrets.sh" "${secret_fixture}/generate-secrets.sh"
          cat > "${secret_fixture}/.env.edutalent" <<'ENV'
          APP_DOMAIN=app.fixture.invalid
          SUPABASE_DOMAIN=supabase.fixture.invalid
          ADMIN_DOMAIN=admin.fixture.invalid
          ENV
          cp "${secret_fixture}/.env.edutalent" "${secret_fixture}/.env.edutalent.example"
          printf 'JWT_SECRET=\\n' > "${secret_fixture}/runtime/supabase/.env.example"
          printf 'services: {}\\n' > "${secret_fixture}/runtime/supabase/docker-compose.yml"
          cat > "${secret_fixture}/runtime/supabase/utils/generate-keys.sh" <<'SH'
          #!/bin/sh
          set -e
          cp .env .env.old
          SH
          cat > "${secret_fixture}/runtime/supabase/utils/add-new-auth-keys.sh" <<'SH'
          #!/bin/sh
          set -e
          cp .env .env.old
          cp docker-compose.yml docker-compose.yml.old
          SH
          bash "${secret_fixture}/generate-secrets.sh" >/dev/null
          test -f "${secret_fixture}/runtime/supabase/.env"
          test ! -e "${secret_fixture}/runtime/supabase/.env.old"
          test ! -e "${secret_fixture}/runtime/supabase/docker-compose.yml.old"
          test ! -e "${secret_fixture}/runtime/supabase/docker-compose.yml.edutalent-backup"

          '''
          if validate.count(behavior_anchor) != 1:
              raise SystemExit("expected appliance staging behavior anchor exactly once")
          validate_path.write_text(
              validate.replace(behavior_anchor, behavior_replacement),
              encoding="utf-8",
          )
          PY

      - name: Run focused and full appliance regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/appliance/stage_production.py
          bash -n scripts/appliance/build.sh
          bash -n deploy/production/generate-secrets.sh
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Commit source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            deploy/production/generate-secrets.sh \
            scripts/appliance/build.sh \
            scripts/appliance/stage_production.py \
            scripts/appliance/validate.sh
          git commit -m 'fix(appliance): exclude generated production state'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:feature/air-gapped-packaging-ghcr
