name: Fix Mirror Air Inputs

on:
  pull_request:
    types:
      - synchronize
    paths:
      - .github/workflows/fix-mirror-air-inputs.yml

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/air-gapped-packaging-ghcr
          fetch-depth: 0
          show-progress: false

      - name: Remove stale reusable input
        run: python3 scripts/ci/fix_mirror_air_inputs.py

      - name: Run focused workflow and appliance regressions
        run: |
          set -euo pipefail
          bash -n scripts/appliance/validate.sh
          bash scripts/appliance/validate.sh
          git diff --check

      - name: Stage tested files
        run: |
          set -euo pipefail
          mkdir -p transformed/.github/workflows transformed/scripts/appliance
          cp .github/workflows/mirror-final-proof.yml transformed/.github/workflows/
          cp scripts/appliance/validate.sh transformed/scripts/appliance/

      - uses: actions/upload-artifact@v6
        with:
          name: mirror-air-input-correction
          path: transformed/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
