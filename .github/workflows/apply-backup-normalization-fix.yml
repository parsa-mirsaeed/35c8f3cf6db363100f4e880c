name: Apply Backup Normalization Fix

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/production-operations' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-operations
          fetch-depth: 0
          show-progress: false

      - name: Normalize encrypted backup payload permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('deploy/production/operations/edutalent_ops.py')
          text = helper.read_text(encoding='utf-8')
          anchor = '''        if path.name != MANIFEST_NAME:
                      yield path


          def create_manifest(root: Path, metadata: dict[str, Any] | None = None) -> dict[str, Any]:
          '''
          replacement = '''        if path.name != MANIFEST_NAME:
                      yield path


          def normalize_payload_permissions(root: Path) -> dict[str, int]:
              root = root.resolve()
              if not root.is_dir():
                  raise RuntimeError(f"backup payload is not a directory: {root}")
              root.chmod(0o700)
              directories = 1
              files = 0
              for path in sorted(root.rglob("*")):
                  if path.is_symlink():
                      raise RuntimeError(
                          f"backup payload contains a symlink: {path.relative_to(root)}"
                      )
                  if path.is_dir():
                      path.chmod(0o700)
                      directories += 1
                      continue
                  if not path.is_file():
                      raise RuntimeError(
                          f"backup payload contains a non-regular entry: {path.relative_to(root)}"
                      )
                  path.chmod(0o600)
                  files += 1
              return {"directories": directories, "files": files}


          def create_manifest(root: Path, metadata: dict[str, Any] | None = None) -> dict[str, Any]:
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one manifest function anchor, found {text.count(anchor)}')
          text = text.replace(anchor, replacement)
          create_anchor = '''    if not root.is_dir():
                  raise RuntimeError(f"backup payload is not a directory: {root}")
              files = []
          '''
          create_replacement = '''    if not root.is_dir():
                  raise RuntimeError(f"backup payload is not a directory: {root}")
              normalize_payload_permissions(root)
              files = []
          '''
          if text.count(create_anchor) != 1:
              raise SystemExit(f'expected one manifest normalization anchor, found {text.count(create_anchor)}')
          helper.write_text(text.replace(create_anchor, create_replacement), encoding='utf-8')

          tests = Path('deploy/production/operations/test_edutalent_ops.py')
          text = tests.read_text(encoding='utf-8')
          if 'import stat\n' not in text:
              text = text.replace('import re\n', 'import re\nimport stat\n', 1)
          start_marker = '    def test_decrypt_restores_archived_modes_before_manifest_verification(self) -> None:\n'
          start = text.find(start_marker)
          end = text.find('\n\n\nclass ComposeSecurityTests', start)
          if start < 0 or end < 0:
              raise SystemExit('backup permission regression test anchor was not found')
          replacement = '''    def test_manifest_normalizes_payload_permissions(self) -> None:
              with tempfile.TemporaryDirectory() as directory:
                  root = Path(directory) / "payload"
                  nested = root / "nested"
                  nested.mkdir(parents=True)
                  root.chmod(0o755)
                  nested.chmod(0o755)
                  public_file = nested / "public.txt"
                  public_file.write_text("public", encoding="utf-8")
                  public_file.chmod(0o644)
                  executable_file = root / "tool"
                  executable_file.write_bytes(b"tool")
                  executable_file.chmod(0o755)

                  manifest = ops.create_manifest(root)
                  ops.verify_manifest(root)

                  self.assertEqual(stat.S_IMODE(root.stat().st_mode), 0o700)
                  self.assertEqual(stat.S_IMODE(nested.stat().st_mode), 0o700)
                  self.assertEqual(stat.S_IMODE(public_file.stat().st_mode), 0o600)
                  self.assertEqual(stat.S_IMODE(executable_file.stat().st_mode), 0o600)
                  self.assertEqual({row["mode"] for row in manifest["files"]}, {0o600})

              script = OPERATIONS_SCRIPT_PATH.read_text(encoding="utf-8")
              decrypt = script.split("decrypt_backup() {", 1)[1].split(
                  "\\nverify_decrypted_payload() {", 1
              )[0]
              self.assertNotIn("--same-permissions", decrypt)
              self.assertIn("manifest-create", script)
          '''
          tests.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

          rm -f .github/workflows/apply-backup-mode-fix.yml
          rm -f .github/workflows/apply-backup-normalization-fix.yml

          bash -n deploy/production/edutalent-operations
          python3 -m unittest discover -s deploy/production/operations -p 'test_*.py' -v
          bash deploy/production/edutalent-operations validate-definitions
          git diff --check

      - name: Commit implementation and regression test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/production/operations/edutalent_ops.py \
            deploy/production/operations/test_edutalent_ops.py \
            .github/workflows/apply-backup-mode-fix.yml \
            .github/workflows/apply-backup-normalization-fix.yml
          git diff --cached --quiet && { echo 'Backup normalization patch produced no change.' >&2; exit 1; }
          git commit -m 'fix: normalize encrypted backup payload permissions'
          git push origin HEAD:feature/production-operations
